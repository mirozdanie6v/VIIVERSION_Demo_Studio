name: The Cloud Russian Demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'examples/the-cloud-russian-demo.json'
      - '.github/workflows/the-cloud-demo.yml'

concurrency:
  group: the-cloud-russian-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python3 -m pip install --quiet numpy -r requirements-tts-chatterbox.txt

      - name: Capture The Cloud guest journey
        env:
          DEMO_STUDIO_ALLOWED_HOSTS: thecloud.viiversion.com
          ALLOW_PRIVATE_TARGETS: "false"
        run: npm run capture -- --scenario examples/the-cloud-russian-demo.json

      - name: Resolve run directory
        id: run
        shell: bash
        run: echo "dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Prepare narration segments
        shell: bash
        env:
          RUN_DIR: ${{ steps.run.outputs.dir }}
        run: |
          mkdir -p "${RUN_DIR}/voices"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const scenario = JSON.parse(fs.readFileSync('examples/the-cloud-russian-demo.json', 'utf8'));
          for (let i = 0; i < scenario.steps.length; i += 1) {
            const step = scenario.steps[i];
            if (!step.narration?.trim()) continue;
            const spoken = (step.voiceText || step.narration).trim();
            fs.writeFileSync(path.join(process.env.RUN_DIR, 'voices', `text-${i}.txt`), spoken + '\n');
          }
          NODE

      - name: Synthesize premium Russian presenter voice
        shell: bash
        env:
          RUN_DIR: ${{ steps.run.outputs.dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import os
          from pathlib import Path

          import torchaudio as ta
          import perth

          if not callable(getattr(perth, "PerthImplicitWatermarker", None)):
              perth.PerthImplicitWatermarker = perth.DummyWatermarker

          from chatterbox.mtl_tts import ChatterboxMultilingualTTS

          run_dir = Path(os.environ["RUN_DIR"])
          try:
              model = ChatterboxMultilingualTTS.from_pretrained(device="cpu", t3_model="v3")
          except TypeError:
              model = ChatterboxMultilingualTTS.from_pretrained(device="cpu")

          for txt_path in sorted(glob.glob(str(run_dir / "voices" / "text-*.txt"))):
              txt = Path(txt_path)
              idx = txt.stem.split("-")[-1]
              text = txt.read_text(encoding="utf-8").strip()
              wav = model.generate(text, language_id="ru")
              ta.save(str(run_dir / "voices" / f"raw-{idx}.wav"), wav, model.sr)
          PY

          run_dir="${{ steps.run.outputs.dir }}"
          for raw in "${run_dir}"/voices/raw-*.wav; do
            base=$(basename "$raw" .wav)
            idx=${base#raw-}
            out="${run_dir}/voices/step-${idx}.mp3"
            ffmpeg -y -i "$raw" \
              -af "volume=0.98,highpass=f=65,lowpass=f=12000,acompressor=threshold=-20dB:ratio=1.5:attack=18:release=180,loudnorm=I=-16:TP=-1.5:LRA=9" \
              -c:a libmp3lame -b:a 224k "$out"
          done

      - name: Synchronize narration and captions
        run: |
          npx tsx src/narration-sync-cli.ts             --run "${{ steps.run.outputs.dir }}"             --bpm 98
          sed -i 's/Style: Default,DejaVu Sans,28,/Style: Default,DejaVu Sans,56,/' "${{ steps.run.outputs.dir }}/synced-captions.ass"

      - name: Generate subtle background music
        shell: bash
        env:
          RUN_DIR: ${{ steps.run.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os, wave
          import numpy as np
          sr=44100
          duration=120.0
          n=int(duration*sr)
          t=np.arange(n,dtype=np.float64)/sr
          left=np.zeros(n,dtype=np.float64)
          right=np.zeros(n,dtype=np.float64)
          chords=[(196.0,246.94,293.66),(174.61,220.0,261.63),(220.0,261.63,329.63),(164.81,196.0,246.94)]
          chord_len=15.0
          for ci in range(int(duration/chord_len)):
              chord=chords[ci%len(chords)]
              start=int(ci*chord_len*sr); end=min(n,int((ci+1)*chord_len*sr))
              tt=np.arange(end-start,dtype=np.float64)/sr
              fade=np.minimum(1,tt/2.0)*np.minimum(1,(chord_len-tt)/2.0)
              for j,f in enumerate(chord):
                  amp=0.025/(j+1)
                  left[start:end]+=amp*np.sin(2*np.pi*f*tt+0.13*j)*fade
                  right[start:end]+=amp*np.sin(2*np.pi*f*tt+0.21*j)*fade
          pulse=0.0022*np.sin(2*np.pi*49*t)*(0.55+0.45*np.sin(2*np.pi*(98/60/2)*t)**2)
          left+=pulse; right+=pulse
          peak=max(np.max(np.abs(left)),np.max(np.abs(right)),1e-9)
          stereo=np.stack([left/peak*0.5,right/peak*0.5],axis=1)
          pcm=(np.clip(stereo,-1,1)*32767).astype(np.int16)
          out=os.path.join(os.environ['RUN_DIR'],'background.wav')
          with wave.open(out,'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr); w.writeframes(pcm.tobytes())
          PY
          run_dir="${{ steps.run.outputs.dir }}"
          ffmpeg -y -i "${run_dir}/background.wav"             -af "highpass=f=70,lowpass=f=8500,loudnorm=I=-28:TP=-7:LRA=6"             -c:a aac -b:a 160k "${run_dir}/background.m4a"

      - name: Render final Russian presentation
        run: |
          npm run render --             --run "${{ steps.run.outputs.dir }}"             --preset 9:16             --voiceover "${{ steps.run.outputs.dir }}/voiceover.mp3"             --captions-file "${{ steps.run.outputs.dir }}/synced-captions.ass"             --music "${{ steps.run.outputs.dir }}/background.m4a"             --music-volume 0.08             --music-bpm 98             --brand "THE CLOUD"             --title "Мини-приложение гостя"             --intro-seconds 2.0             --outro-seconds 4.6             --cta "Выбор атмосферы, бронирование и AI — в одном приложении"             --cta-secondary "The Cloud · Nha Trang"

      - name: Verify final video and create QA frames
        shell: bash
        env:
          RUN_DIR: ${{ steps.run.outputs.dir }}
        run: |
          set -euo pipefail
          run_dir="${RUN_DIR}"
          test -s "${run_dir}/capture.webm"
          test -s "${run_dir}/voiceover.mp3"
          test -s "${run_dir}/synced-captions.ass"
          test -s "${run_dir}/final-9x16.mp4"
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "${run_dir}/final-9x16.mp4")
          echo "FINAL_DURATION=${duration}"
          awk -v d="$duration" 'BEGIN { exit !(d >= 45 && d <= 180) }'
          ffmpeg -y -ss 3 -i "${run_dir}/final-9x16.mp4" -frames:v 1 "${run_dir}/qa-intro.png"
          ffmpeg -y -ss 25 -i "${run_dir}/final-9x16.mp4" -frames:v 1 "${run_dir}/qa-booking.png"
          ffmpeg -y -sseof -15 -i "${run_dir}/final-9x16.mp4" -frames:v 1 "${run_dir}/qa-ai.png"
          ffmpeg -y -sseof -2 -i "${run_dir}/final-9x16.mp4" -frames:v 1 "${run_dir}/qa-outro.png"

      - name: Upload The Cloud presentation
        uses: actions/upload-artifact@v4
        with:
          name: the-cloud-russian-demo
          path: artifacts/
          if-no-files-found: error
