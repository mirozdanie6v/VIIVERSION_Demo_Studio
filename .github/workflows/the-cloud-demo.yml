name: The Cloud Flow Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/the-cloud-demo.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Probe booking and AI
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:430,height:932}});
          const dump=async(label)=>{
            await page.waitForTimeout(900);
            console.log('\n===== '+label+' =====');
            console.log((await page.locator('body').innerText()).slice(0,18000));
            console.log('BUTTONS',JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('INPUTS',JSON.stringify(await page.locator('input,textarea,select').evaluateAll(els=>els.map(e=>({
              tag:e.tagName,type:e.getAttribute('type'),name:e.getAttribute('name'),placeholder:e.getAttribute('placeholder'),value:e.value
            })))));
          };
          await page.goto('https://thecloud.viiversion.com/',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(2500);
          await page.getByRole('button',{name:'Бронировать',exact:true}).last().click();
          await dump('BOOK-1');
          await page.getByRole('button',{name:'Далее',exact:true}).click();
          await dump('BOOK-2');

          let buttons=await page.getByRole('button').allTextContents();
          console.log('STEP2 CANDIDATES',JSON.stringify(buttons));
          for(const n of ['Rooftop View','Sunset Line','Выбрать позицию']){
            const b=page.getByRole('button',{name:n,exact:n!=='Выбрать позицию'}).first();
            if(await b.count()){ try{await b.click(); break;}catch{} }
          }
          if(await page.getByRole('button',{name:'Далее',exact:true}).count()) await page.getByRole('button',{name:'Далее',exact:true}).click();
          await dump('BOOK-3');

          buttons=await page.getByRole('button').allTextContents();
          const excludes=new Set(['Админ','RU','EN','VI','1. Детали','2. Позиция','3. Стол','4. Данные','5. Оплата','Назад','Далее','Главная','Позиции','Бронировать','AI','Брони']);
          const candidate=buttons.find(x=>x.trim()&&!excludes.has(x.trim()));
          console.log('STEP3 PICK',candidate||'NONE');
          if(candidate){
            const b=page.getByRole('button',{name:candidate,exact:true}).first();
            if(await b.count()) try{await b.click();}catch{}
          }
          if(await page.getByRole('button',{name:'Далее',exact:true}).count()) try{await page.getByRole('button',{name:'Далее',exact:true}).click();}catch{}
          await dump('BOOK-4');

          const inputs=page.locator('input,textarea');
          const count=await inputs.count();
          for(let i=0;i<count;i++){
            const el=inputs.nth(i);
            const type=await el.getAttribute('type');
            if(['time','number','date','hidden'].includes(type||'')) continue;
            const ph=(await el.getAttribute('placeholder'))||'';
            const nm=(await el.getAttribute('name'))||'';
            let v='Demo';
            if(/phone|тел/i.test(ph+' '+nm)) v='+84 90 555 12 34';
            else if(/email/i.test(ph+' '+nm)) v='demo@example.com';
            else if(/name|имя/i.test(ph+' '+nm)) v='Анна';
            try{await el.fill(v);}catch{}
          }
          if(await page.getByRole('button',{name:'Далее',exact:true}).count()) try{await page.getByRole('button',{name:'Далее',exact:true}).click();}catch{}
          await dump('BOOK-5');

          await page.goto('https://thecloud.viiversion.com/',{waitUntil:'domcontentloaded',timeout:45000});
          await page.waitForTimeout(2000);
          await page.getByRole('button',{name:'AI',exact:true}).last().click();
          await page.getByRole('button',{name:'Где лучше на закат?',exact:true}).click();
          await page.waitForTimeout(6000);
          await dump('AI-ANSWER');
          await browser.close();
          NODE
