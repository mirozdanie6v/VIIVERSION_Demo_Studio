name: The Cloud Demo Inspect

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/the-cloud-demo.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Inspect The Cloud flows
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:430,height:932}});
          const dump = async (label) => {
            await page.waitForTimeout(900);
            console.log('\n===== '+label+' =====');
            console.log('URL', page.url());
            console.log('BODY\n'+(await page.locator('body').innerText()).slice(0,22000));
            console.log('BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('INPUTS', JSON.stringify(await page.locator('input,textarea,select').evaluateAll(els => els.map(e => ({
              tag:e.tagName,type:e.getAttribute('type'),placeholder:e.getAttribute('placeholder'),value:e.value
            })))));
            await page.screenshot({path:'the-cloud-'+label.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'.png',fullPage:true});
          };
          const home = async () => {
            await page.goto('https://thecloud.viiversion.com/', {waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(2500);
          };
          await home(); await dump('HOME');

          for (const label of ['Позиции','Бронировать','AI']) {
            await home();
            const b=page.getByRole('button',{name:label,exact:true}).last();
            if (await b.count()) {
              await b.click();
              await dump(label);
            }
          }

          await home();
          const book=page.getByRole('button',{name:'Забронировать',exact:true}).first();
          if(await book.count()){ await book.click(); await dump('HOME-BOOK'); }

          await home();
          const ai=page.getByRole('button',{name:'Спросить AI',exact:true}).first();
          if(await ai.count()){ await ai.click(); await dump('HOME-AI'); }
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: the-cloud-deep-inspection
          path: the-cloud-*.png
