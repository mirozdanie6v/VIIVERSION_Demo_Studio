name: Audit Demo Studio Job State (read only)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/audit-demo-studio-jobs.yml"

permissions:
  contents: read
  statuses: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET_NAME: viiversion-demo-studio-artifacts
    steps:
      - name: Read-only inspect stored job/recovery records
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import quote, urlencode
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")
          bucket = os.environ["R2_BUCKET_NAME"]
          if not token:
              raise RuntimeError("Cloudflare token is unavailable: cannot verify job state")

          def get(url, json_response=True):
              request = Request(url, headers={"Authorization": "Bearer " + token}, method="GET")
              with urlopen(request, timeout=30) as response:
                  raw = response.read()
              if not json_response:
                  return raw
              doc = json.loads(raw)
              if not isinstance(doc, dict) or doc.get("success") is not True:
                  raise RuntimeError("Cloudflare read-only API returned an unsuccessful response")
              return doc

          origin = "https://api.cloudflare.com/client/v4"
          if not account:
              accounts = []
              for endpoint, extract in (
                  ("/memberships?status=accepted&per_page=50", lambda row: row.get("account", {}).get("id")),
                  ("/zones?name=viiversion.com&per_page=5", lambda row: row.get("account", {}).get("id")),
              ):
                  try:
                      values = get(origin + endpoint).get("result", [])
                      accounts = sorted(set(filter(None, (extract(row) for row in values))))
                  except (HTTPError, URLError, ValueError):
                      accounts = []
                  if len(accounts) == 1:
                      account = accounts[0]
                      break
              if not account:
                  raise RuntimeError("Cloudflare account cannot be resolved; audit is inconclusive")

          base = origin + "/accounts/" + quote(account, safe="") + "/r2/buckets/" + quote(bucket, safe="")
          def list_keys(prefix):
              keys = []
              cursor = None
              for _ in range(100):
                  query = {"prefix": prefix, "per_page": 1000}
                  if cursor:
                      query["cursor"] = cursor
                  doc = get(base + "/objects?" + urlencode(query))
                  batch = [row.get("key") for row in doc.get("result", []) if isinstance(row, dict)]
                  if any(not isinstance(k, str) for k in batch):
                      raise RuntimeError("Missing object key in R2 listing")
                  keys.extend(batch)
                  if len(keys) > 2000:
                      raise RuntimeError("More than 2000 tracked R2 objects; audit capped as inconclusive")
                  info = doc.get("result_info") or {}
                  if not info.get("is_truncated"):
                      return keys
                  cursor = info.get("cursor")
                  if not cursor:
                      raise RuntimeError("Truncated R2 listing without cursor")
              raise RuntimeError("R2 listing page limit exceeded")

          recovery_keys = list_keys("recovery/")
          job_keys = list_keys("jobs/")
          states = {}
          unresolved = 0
          for key in job_keys:
              raw = get(base + "/objects/" + quote(key, safe="/"), json_response=False)
              try:
                  snapshot = json.loads(raw)
                  state = str(snapshot.get("status", "unknown"))
              except (ValueError, AttributeError, TypeError):
                  state = "unknown"
              states[state] = states.get(state, 0) + 1
              if state not in {"completed", "failed"}:
                  unresolved += 1

          print("R2 recovery records:", len(recovery_keys))
          print("R2 job snapshots:", len(job_keys))
          print("R2 statuses (counts only):", json.dumps(states, sort_keys=True))
          print("R2 nonterminal/unknown snapshots:", unresolved)
          # Read-only Container Instances API complements R2 metadata. A live
          # instance means there may be work not yet recorded in R2.
          apps_doc = get(origin + "/accounts/" + quote(account, safe="") +
                         "/containers/applications?per_page=500")
          apps = apps_doc.get("result", [])
          matches = [app for app in apps if
                     "viiversion-demo-studio" in str(app.get("name", "")).lower() and
                     ("demostudiocontainer" in str(app.get("name", "")).lower() or
                      str(app.get("name", "")).lower() == "viiversion-demo-studio")]
          if len(matches) != 1:
              raise RuntimeError("Cannot uniquely identify the Demo Studio container application")
          application_id = matches[0].get("id")
          if not application_id:
              raise RuntimeError("Container application ID is unavailable")
          instances_url = (origin + "/accounts/" + quote(account, safe="") +
                           "/containers/applications/" + quote(application_id, safe="") +
                           "/instances-v2?state=active&per_page=1000")
          instances_doc = get(instances_url)
          instances = instances_doc.get("result", [])
          if not isinstance(instances, list):
              raise RuntimeError("Container instances result is unexpected")
          active_instances = len(instances)
          if (instances_doc.get("result_info") or {}).get("next_page_token"):
              raise RuntimeError("Active instance result truncated: audit blocked")

          print("Active/provisioning/stopping Demo Studio container instances:", active_instances)
          print("Durable Object active-job KV markers are not directly accessible through this API.")
          if recovery_keys or unresolved or active_instances:
              print("DEPLOYMENT GATE: BLOCKED (possible pending work or running container)")
              sys.exit(2)
          print("READ-ONLY CHECK: CLEAR (R2 terminal, no recovery, no active containers).")
          print("Recheck immediately before deploy; Durable Object marker inspection is a separate control.")
          PY

      - name: Publish safe read-only audit result as commit status
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${AUDIT_OUTCOME}" = "success" ]; then
            state="success"
            description="R2 job audit clear; Durable Object confirmation still required"
          else
            state="failure"
            description="R2 audit blocked or inconclusive; do not deploy"
          fi
          jq -n --arg state "${state}" --arg description "${description}" \
            '{state:$state,description:$description,context:"demo-studio/r2-readonly-audit"}' > /tmp/audit-status.json
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/audit-status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null

      - name: Block release if job-state verification is incomplete
        if: steps.audit.outcome != 'success'
        run: exit 1
