name: Deploy LUME Signature Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-lume-signature-preview.yml'
      - '.deploy/lume-signature-a.json'
      - '.deploy/lume-signature-b.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lume-signature-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            curl -fsS "https://api.cloudflare.com/client/v4/zones?name=viiversion.com&per_page=5"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/zones.json
            id=$(jq -r '[.result[]? | select(.name=="viiversion.com")][0].account.id // empty' /tmp/zones.json)
            test -n "${id}"
            echo "CLOUDFLARE_ACCOUNT_ID=${id}" >> "${GITHUB_ENV}"
          fi

      - name: Materialize feature source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lume-signature
          node <<'NODE'
          const fs=require("fs");
          const path=require("path");
          for(const file of [".deploy/lume-signature-a.json",".deploy/lume-signature-b.json"]){
            const bundle=JSON.parse(fs.readFileSync(file,"utf8"));
            for(const [name,content] of Object.entries(bundle)){
              const target=path.join("lume-signature",name);
              fs.mkdirSync(path.dirname(target),{recursive:true});
              fs.writeFileSync(target,content,"utf8");
            }
          }
          NODE

      - name: Validate and build local LUME media
        shell: bash
        run: |
          set -euo pipefail
          cd lume-signature
          npm install --no-audit --no-fund
          npm run check:syntax
          npm run build
          test -f dist/assets/lume/logo/lume-logo.webp
          test -f dist/assets/lume/hero/lume-hero.webp
          test -f dist/assets/lume/spaces/rooftop-03.webp

      - name: Deploy preview
        shell: bash
        run: |
          set -euo pipefail
          cd lume-signature
          npx --yes wrangler@4 deploy --config wrangler.preview.jsonc

      - name: Verify app and AI contract
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/home.html -w '%{http_code}' "https://lume-v2.viiversion.com/" || true)
            if [ "${code}" = "200" ] && grep -Fq '/assets/lume/hero/lume-hero.webp' /tmp/home.html; then ready=1; break; fi
            sleep 5
          done
          test "${ready}" -eq 1
          curl -fsS "https://lume-v2.viiversion.com/api/health" | jq -e '.ok == true and .aiBinding == true' >/dev/null
          curl -fsS -X POST "https://lume-v2.viiversion.com/api/concierge"             -H 'content-type: application/json'             --data '{"message":"Покажи фотографии всех зон LUME и коротко расскажи о каждой","lang":"ru","history":[],"context":{}}' > /tmp/ai.json
          jq -e '.spaceCardIds | length == 4' /tmp/ai.json >/dev/null
          jq -e '.nextAction == "explore_spaces"' /tmp/ai.json >/dev/null
          jq -e '.reply | test("[А-Яа-яЁё]")' /tmp/ai.json >/dev/null
          ! jq -r '.reply' /tmp/ai.json | grep -Eqi 'cannot.*photo|text.?based|не могу.*фото'
          echo "LUME signature preview verified."
