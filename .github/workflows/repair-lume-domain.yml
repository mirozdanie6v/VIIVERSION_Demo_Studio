name: Repair LUME Cloudflare Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-lume-domain.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TARGET_DOMAIN: lume.viiversion.com
      PAGES_TARGET: lume-mini-app.pages.dev
    steps:
      - name: Resolve zone
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          curl -fsS "https://api.cloudflare.com/client/v4/zones?name=viiversion.com&per_page=5"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/zones.json
          zone=$(jq -r '[.result[]? | select(.name=="viiversion.com")][0].id // empty' /tmp/zones.json)
          test -n "${zone}"
          echo "ZONE_ID=${zone}" >> "${GITHUB_ENV}"

      - name: Ensure CNAME
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records"
          curl -fsS "${api}?name=${TARGET_DOMAIN}&per_page=100"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/records.json

          cname_id=$(jq -r --arg d "${TARGET_DOMAIN}" '[.result[]? | select(.name==$d and .type=="CNAME")][0].id // empty' /tmp/records.json)
          other_count=$(jq -r --arg d "${TARGET_DOMAIN}" '[.result[]? | select(.name==$d and .type!="CNAME")] | length' /tmp/records.json)

          if [ "${other_count}" -gt 0 ]; then
            echo "Conflicting non-CNAME DNS records exist for ${TARGET_DOMAIN}:"
            jq --arg d "${TARGET_DOMAIN}" '.result[]? | select(.name==$d)' /tmp/records.json
            exit 2
          fi

          payload=$(jq -nc --arg name "${TARGET_DOMAIN}" --arg content "${PAGES_TARGET}" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')

          if [ -n "${cname_id}" ]; then
            code=$(curl -sS -o /tmp/dns-write.json -w '%{http_code}' -X PUT "${api}/${cname_id}"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json'               --data "${payload}" || true)
          else
            code=$(curl -sS -o /tmp/dns-write.json -w '%{http_code}' -X POST "${api}"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json'               --data "${payload}" || true)
          fi

          cat /tmp/dns-write.json
          test "${code}" = "200"
          jq -e '.success == true' /tmp/dns-write.json >/dev/null
          echo "CNAME ready: ${TARGET_DOMAIN} -> ${PAGES_TARGET}"

      - name: Verify Pages custom domain
        shell: bash
        run: |
          set -euo pipefail
          account=$(curl -fsS "https://api.cloudflare.com/client/v4/zones?name=viiversion.com&per_page=5"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '[.result[]? | select(.name=="viiversion.com")][0].account.id // empty')
          test -n "${account}"
          api="https://api.cloudflare.com/client/v4/accounts/${account}/pages/projects/lume-mini-app/domains"
          ready=0
          for attempt in $(seq 1 36); do
            curl -fsS "${api}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/domains.json
            status=$(jq -r --arg d "${TARGET_DOMAIN}" '[.result[]? | select(.name==$d)][0].status // empty' /tmp/domains.json)
            verify=$(jq -r --arg d "${TARGET_DOMAIN}" '[.result[]? | select(.name==$d)][0].verification_data.status // empty' /tmp/domains.json)
            echo "Cloudflare domain status: ${status} / verification: ${verify}"
            if [ "${status}" = "active" ] || [ "${verify}" = "active" ]; then
              ready=1
              break
            fi
            sleep 5
          done
          jq --arg d "${TARGET_DOMAIN}" '.result[]? | select(.name==$d)' /tmp/domains.json
          test "${ready}" -eq 1
