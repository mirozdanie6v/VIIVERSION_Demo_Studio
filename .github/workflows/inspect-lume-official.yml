name: Inspect Official LUME Brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-lume-official.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect brand assets
        shell: bash
        run: |
          cat > inspect.mjs <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1200}});
          await page.goto("https://www.lumenhatrang.com/",{waitUntil:"networkidle",timeout:60000});
          await page.screenshot({path:"official-home.png",fullPage:false});
          const data=await page.evaluate(()=>{
            const imgs=[...document.images].map((img,i)=>({i,src:img.currentSrc||img.src,alt:img.alt,w:img.naturalWidth,h:img.naturalHeight,rect:img.getBoundingClientRect().toJSON()}));
            const svgs=[...document.querySelectorAll("svg")].slice(0,30).map((svg,i)=>({i,html:svg.outerHTML.slice(0,5000),rect:svg.getBoundingClientRect().toJSON()}));
            const bg=[...document.querySelectorAll("*")].map((el,i)=>({i,tag:el.tagName,cls:el.className,id:el.id,bg:getComputedStyle(el).backgroundImage,rect:el.getBoundingClientRect().toJSON()})).filter(x=>x.bg&&x.bg!=="none").slice(0,100);
            return {title:document.title,url:location.href,imgs,svgs,bg};
          });
          fs.writeFileSync("brand-assets.json",JSON.stringify(data,null,2));
          console.log(JSON.stringify(data,null,2));
          await browser.close();
          NODE
          node inspect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lume-official-brand-inspection
          path: |
            official-home.png
            brand-assets.json
          if-no-files-found: error
          retention-days: 3
