name: Inspect Official LUME Brand

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-lume-official.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect brand assets
        shell: bash
        run: |
          cat > inspect.mjs <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:1000}});
          await page.goto("https://www.lumenhatrang.com/",{waitUntil:"domcontentloaded",timeout:60000});
          const fullHeight=await page.evaluate(()=>document.documentElement.scrollHeight);
          for(let y=0;y<fullHeight;y+=800){
            await page.evaluate(y=>window.scrollTo(0,y),y);
            await page.waitForTimeout(250);
          }
          await page.evaluate(()=>window.scrollTo(0,0));
          await page.waitForTimeout(500);
          await page.screenshot({path:"official-home.png",fullPage:false});
          const data=await page.evaluate(()=>{
            const extractUrl=bg=>{
              const match=/url\(["']?(.*?)["']?\)/.exec(bg||"");
              return match?.[1]||null;
            };
            const bg=[...document.querySelectorAll("*")].map((el,i)=>{
              const cs=getComputedStyle(el),rect=el.getBoundingClientRect();
              return {i,tag:el.tagName,cls:String(el.className||""),id:el.id||"",bg:cs.backgroundImage,url:extractUrl(cs.backgroundImage),x:rect.x,y:rect.y+scrollY,w:rect.width,h:rect.height};
            }).filter(x=>x.url);
            const unique=[...new Map(bg.map(x=>[x.url,x])).values()];
            const logo=unique.filter(x=>/logo/i.test(x.url));
            return {title:document.title,url:location.href,height:document.documentElement.scrollHeight,logo,backgrounds:unique};
          });
          fs.writeFileSync("brand-assets.json",JSON.stringify(data,null,2));
          console.log("LOGOS="+JSON.stringify(data.logo));
          console.log("BACKGROUNDS="+JSON.stringify(data.backgrounds));
          await browser.close();
          NODE
          node inspect.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lume-official-brand-inspection
          path: |
            official-home.png
            brand-assets.json
          if-no-files-found: error
          retention-days: 3
