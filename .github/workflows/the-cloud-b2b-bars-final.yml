name: The Cloud B2B Bars Final

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/the-cloud-b2b-bars-final.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project and media tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg unzip fonts-dejavu-core

      - name: Download approved premium The Cloud render
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mirozdanie6v/VIIVERSION_Demo_Studio/actions/artifacts/11357956245/zip" \
            -o /tmp/source.zip
          mkdir -p /tmp/source
          unzip -q /tmp/source.zip -d /tmp/source
          src=$(find /tmp/source -type f -name 'final-9x16.mp4' | head -n 1)
          test -n "$src"
          cp "$src" /tmp/source.mp4
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/source.mp4

      - name: Download premium CTA voice
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --silent --show-error \
            'https://dnznrvs05pmza.cloudfront.net/text_to_speech/d8994939-5110-4a90-b1db-ab3a94176ebb/The_Cloud_B2B_bars_CTA_RU.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMDhhZmNlOTE1ZTE2N2EwMiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMxMzgwOX0.4FOy3Q5VcuIQuKkCjWs259EfErivA4NB_l0VrPl-Ci0' \
            -o /tmp/cta.mp3
          test -s /tmp/cta.mp3
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/cta.mp3

      - name: Create premium B2B intro and outro artwork
        run: |
          cat > screens-temp.mjs <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:1080,height:1920}, deviceScaleFactor:1});

          const base = `
          <style>
            *{box-sizing:border-box} html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
            body{font-family:Arial,Helvetica,sans-serif;color:#F6F4EE;background:
              radial-gradient(800px 700px at 92% 12%,rgba(229,177,74,.20),transparent 58%),
              radial-gradient(900px 900px at 5% 92%,rgba(71,91,130,.18),transparent 62%),
              linear-gradient(155deg,#05070B 0%,#090D14 54%,#040509 100%);}
            body:after{content:"";position:absolute;inset:0;opacity:.12;pointer-events:none;background-image:
              repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px);}
            .orb{position:absolute;width:520px;height:520px;border:1px solid rgba(239,190,91,.20);border-radius:50%;right:-180px;top:240px;box-shadow:0 0 120px rgba(225,171,60,.07) inset}
            .wrap{position:absolute;inset:0;padding:128px 86px;display:flex;flex-direction:column}
            .eyebrow{display:inline-flex;align-items:center;gap:14px;font-size:21px;font-weight:700;letter-spacing:3.2px;color:#EAC372;text-transform:uppercase}
            .eyebrow:before{content:"";width:46px;height:2px;background:#EAC372}
            h1{font-size:92px;line-height:.97;letter-spacing:-4.5px;margin:92px 0 38px;font-weight:700;max-width:900px}
            h1 span{color:#EAC372}
            .lead{font-size:33px;line-height:1.35;color:rgba(246,244,238,.74);max-width:820px}
            .glass{margin-top:70px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.025));border-radius:32px;padding:34px;box-shadow:0 28px 90px rgba(0,0,0,.28);backdrop-filter:blur(20px)}
            .chips{display:flex;flex-wrap:wrap;gap:14px}.chip{border:1px solid rgba(234,195,114,.34);border-radius:999px;padding:15px 20px;font-size:20px;letter-spacing:.5px;color:#F6E6BF;background:rgba(234,195,114,.06)}
            .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:22px}.card{height:156px;border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:24px;background:rgba(5,8,13,.50)}
            .num{font-size:39px;color:#EAC372;font-weight:700}.label{font-size:18px;color:rgba(255,255,255,.64);margin-top:12px;line-height:1.2}
            .footer{margin-top:auto;display:flex;align-items:end;justify-content:space-between;color:rgba(255,255,255,.48);font-size:20px;letter-spacing:1.6px}
            .brand{font-weight:700;color:#F7F3E8;font-size:23px;letter-spacing:2.2px}
            .cta{margin-top:55px;display:inline-flex;width:max-content;align-items:center;gap:18px;padding:24px 30px;border-radius:18px;background:linear-gradient(135deg,#F2C66A,#C98B2D);color:#0B0C0E;font-size:24px;font-weight:800;letter-spacing:.6px;box-shadow:0 16px 60px rgba(229,177,74,.28)}
            .cta i{width:28px;height:28px;border-radius:50%;background:#111;position:relative}.cta i:after{content:"→";position:absolute;color:white;font-style:normal;left:7px;top:1px;font-size:20px}
            .micro{font-size:19px;line-height:1.4;color:rgba(255,255,255,.54);margin-top:20px;max-width:780px}
          </style>`;

          await page.setContent(`<!doctype html><html><head><meta charset="utf-8">${base}</head><body>
            <div class="orb"></div><div class="wrap">
              <div class="eyebrow">VIIVERSION · DIGITAL EXPERIENCE FOR BARS</div>
              <h1>Из интереса —<br>в бронь.<br><span>В одном интерфейсе.</span></h1>
              <div class="lead">Демонстрация возможностей для баров на реальном клиентском пути The Cloud.</div>
              <div class="glass">
                <div class="chips">
                  <div class="chip">Бронирование</div><div class="chip">AI-консультант</div><div class="chip">Брендированный UX</div>
                </div>
                <div class="grid">
                  <div class="card"><div class="num">01</div><div class="label">Показать атмосферу и позиции</div></div>
                  <div class="card"><div class="num">02</div><div class="label">Ответить на вопросы гостя</div></div>
                  <div class="card"><div class="num">03</div><div class="label">Довести до бронирования</div></div>
                </div>
              </div>
              <div class="footer"><div class="brand">VIIVERSION</div><div>CASE DEMO · THE CLOUD · NHA TRANG</div></div>
            </div></body></html>`);
          await page.screenshot({path:'/tmp/intro.png'});

          await page.setContent(`<!doctype html><html><head><meta charset="utf-8">${base}</head><body>
            <div class="orb"></div><div class="wrap">
              <div class="eyebrow">VIIVERSION · FOR BARS</div>
              <h1>Ваш бар<br>может работать<br><span>так же.</span></h1>
              <div class="lead">Мини-приложение под ваш бренд — от выбора атмосферы до бронирования и AI-консультации.</div>
              <div class="glass">
                <div class="grid">
                  <div class="card"><div class="num">BOOK</div><div class="label">Бронирование без лишней переписки</div></div>
                  <div class="card"><div class="num">AI</div><div class="label">Консультант знает ваш бар и меню</div></div>
                  <div class="card"><div class="num">CRM</div><div class="label">Интеграция с вашим процессом</div></div>
                </div>
              </div>
              <div class="cta"><span>ПОЛУЧИТЬ ДЕМО ДЛЯ СВОЕГО БАРА</span><i></i></div>
              <div class="micro">Покажем, как такой же клиентский путь будет выглядеть именно для вашего заведения.</div>
              <div class="footer"><div class="brand">VIIVERSION.COM</div><div>MINI APPS · AI · BOOKING</div></div>
            </div></body></html>`);
          await page.screenshot({path:'/tmp/outro.png'});
          await browser.close();
          NODE
          node screens-temp.mjs
          test -s /tmp/intro.png
          test -s /tmp/outro.png

      - name: Build intro, preserved main section, and premium outro
        run: |
          set -euo pipefail
          mkdir -p /tmp/edit

          # New 3.2s premium intro.
          ffmpeg -y -loop 1 -i /tmp/intro.png \
            -f lavfi -i anullsrc=r=44100:cl=stereo \
            -t 3.2 \
            -vf "zoompan=z='min(zoom+0.00018,1.018)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=96:s=1080x1920:fps=30,fade=t=in:st=0:d=0.45,fade=t=out:st=2.75:d=0.45,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 19 -r 30 \
            -c:a aac -b:a 192k -ar 44100 -ac 2 -shortest /tmp/edit/intro.mp4

          # Preserve the approved product demo between the old intro and old outro.
          ffmpeg -y -ss 2.0 -t 97.856 -i /tmp/source.mp4 \
            -vf "fps=30,format=yuv420p" \
            -c:v libx264 -preset veryfast -crf 19 \
            -c:a aac -b:a 192k -ar 44100 -ac 2 /tmp/edit/main.mp4

          # Reuse only the old music-bed tail at low volume; the old outro visuals are discarded.
          ffmpeg -y -sseof -4.6 -i /tmp/source.mp4 -vn -c:a pcm_s16le -ar 44100 -ac 2 /tmp/edit/tail.wav

          # New 15s sales outro with premium spoken CTA.
          ffmpeg -y -loop 1 -i /tmp/outro.png \
            -stream_loop -1 -i /tmp/edit/tail.wav \
            -i /tmp/cta.mp3 \
            -t 15.0 \
            -filter_complex "\
              [0:v]zoompan=z='min(zoom+0.00014,1.014)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d=450:s=1080x1920:fps=30,fade=t=in:st=0:d=0.45,fade=t=out:st=14.15:d=0.85,format=yuv420p[v];\
              [1:a]volume=0.09,atrim=duration=15,asetpts=N/SR/TB[bed];\
              [2:a]adelay=700|700,volume=1.0,apad,atrim=duration=15[voice];\
              [bed][voice]amix=inputs=2:duration=longest:normalize=0,loudnorm=I=-16:TP=-1.5:LRA=8[a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -crf 19 -r 30 \
            -c:a aac -b:a 192k -ar 44100 -ac 2 /tmp/edit/outro.mp4

          # Assemble final presentation.
          ffmpeg -y \
            -i /tmp/edit/intro.mp4 -i /tmp/edit/main.mp4 -i /tmp/edit/outro.mp4 \
            -filter_complex "[0:v][0:a][1:v][1:a][2:v][2:a]concat=n=3:v=1:a=1[v][a]" \
            -map "[v]" -map "[a]" \
            -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p -r 30 \
            -c:a aac -b:a 192k -movflags +faststart \
            /tmp/The_Cloud_B2B_Bars_Premium_RU.mp4

          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/The_Cloud_B2B_Bars_Premium_RU.mp4
          ffmpeg -y -ss 1.4 -i /tmp/The_Cloud_B2B_Bars_Premium_RU.mp4 -frames:v 1 /tmp/qa-intro.png
          ffmpeg -y -sseof -7 -i /tmp/The_Cloud_B2B_Bars_Premium_RU.mp4 -frames:v 1 /tmp/qa-outro.png

      - name: Upload final B2B bar presentation
        uses: actions/upload-artifact@v4
        with:
          name: the-cloud-b2b-bars-premium-ru
          path: |
            /tmp/The_Cloud_B2B_Bars_Premium_RU.mp4
            /tmp/qa-intro.png
            /tmp/qa-outro.png
          if-no-files-found: error
