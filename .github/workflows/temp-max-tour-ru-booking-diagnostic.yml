name: MAX TOUR RU Booking Diagnostic

on:
  push:
    branches:
      - 'feature/max-tour-russian-v9'
    paths:
      - '.github/workflows/temp-max-tour-ru-booking-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect Russian booking
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:430,height:932}});
          const dump=async(label)=>{
            console.log('===',label,'===');
            console.log('TEXT=',JSON.stringify((await page.locator('body').innerText()).slice(-12000)));
            console.log('BUTTONS=',JSON.stringify(await page.locator('button:visible').evaluateAll(els=>els.map((e,i)=>({i,text:(e.textContent||'').replace(/\s+/g,' ').trim(),cls:String(e.className||'')})).filter(x=>x.text))));
            console.log('INPUTS=',JSON.stringify(await page.locator('input:visible,textarea:visible').evaluateAll(els=>els.map((e,i)=>({i,type:e.getAttribute('type'),placeholder:e.getAttribute('placeholder'),value:e.value,cls:String(e.className||'')})))));
          };
          await page.goto('https://max-tour.viiversion.com/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(1400);
          const ru=page.getByRole('button',{name:'RU',exact:true}); if(await ru.count()) await ru.click();
          await page.locator('button.nav-btn:visible').nth(1).click(); await page.waitForTimeout(500);
          await page.locator('h3:has-text("Далат «Премиум»"):visible').click(); await page.waitForTimeout(650);
          const join=page.locator('button:has-text("Индивидуальный от $420"):visible');
          console.log('JOIN_VISIBLE=',await join.count());
          if(await join.count()){ await join.first().click(); await page.waitForTimeout(900); }
          await dump('BOOKING RU');
          await browser.close();
          NODE
