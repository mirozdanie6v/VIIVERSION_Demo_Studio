ine.\",ru:\"Сочетать с красным вином средней плотности.\",vi:\"Hợp vang đỏ vừa.\"}},\n{id:\"sunset\",cat:\"Sky Bar\",img:\"https://images.unsplash.com/photo-1544145945-f90425340c7e?auto=format&fit=crop&w=900&q=82\",price:\"260,000 VND\",title:{en:\"Sunset Negroni\",ru:\"Sunset Negroni\",vi:\"Sunset Negroni\"},desc:{en:\"Bitter orange, vermouth and rooftop mood.\",ru:\"Горький апельсин, вермут и rooftop-настроение.\",vi:\"Cam đắng, vermouth và không khí rooftop.\"},rec:{en:\"Best before dinner at 17:45.\",ru:\"Лучше перед ужином в 17:45.\",vi:\"Hợp trước bữa tối lúc 17:45.\"}},\n{id:\"spritz\",cat:\"Sky Bar\",img:\"https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=900&q=82\",price:\"240,000 VND\",title:{en:\"LUME Spritz\",ru:\"LUME Spritz\",vi:\"LUME Spritz\"},desc:{en:\"Light, bright and easy for sunset.\",ru:\"Лёгкий и яркий для заката.\",vi:\"Nhẹ, tươi, hợp hoàng hôn.\"},rec:{en:\"Start at Sky Bar.\",ru:\"Начать в Sky Bar.\",vi:\"Bắt đầu ở Sky Bar.\"}},\n{id:\"martini\",cat:\"Sky Bar\",img:\"https://images.unsplash.com/photo-1556679343-c7306c1976bc?auto=format&fit=crop&w=900&q=82\",price:\"280,000 VND\",title:{en:\"Lychee Martini\",ru:\"Личи Martini\",vi:\"Lychee Martini\"},desc:{en:\"Floral, clean and polished.\",ru:\"Цветочный, чистый и аккуратный.\",vi:\"Hương hoa, thanh lịch.\"},rec:{en:\"Good for celebrations.\",ru:\"Хорошо для праздника.\",vi:\"Hợp dịp đặc biệt.\"}},\n{id:\"sauv\",cat:\"Wine\",img:\"https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=900&q=82\",price:\"320,000 VND / glass\",title:{en:\"Sauvignon Blanc\",ru:\"Sauvignon Blanc\",vi:\"Sauvignon Blanc\"},desc:{en:\"Crisp white wine for seafood.\",ru:\"Свежее белое вино к морепродуктам.\",vi:\"Vang trắng tươi cho hải sản.\"},rec:{en:\"Pair with lobster or tuna.\",ru:\"К лобстеру или тунцу.\",vi:\"Hợp tôm hùm hoặc cá ngừ.\"}},\n{id:\"pinot\",cat:\"Wine\",img:\"https://images.unsplash.com/photo-1506377247377-2a5b3b417ebb?auto=format&fit=crop&w=900&q=82\",price:\"390,000 VND / glass\",title:{en:\"Pinot Noir\",ru:\"Pinot Noir\",vi:\"Pinot Noir\"},desc:{en:\"Elegant red for duck and softer dinners.\",ru:\"Элегантное красное к утке и мягкому ужину.\",vi:\"Vang đỏ thanh cho vịt.\"},rec:{en:\"Pair with duck.\",ru:\"К утке.\",vi:\"Hợp vịt.\"}},\n{id:\"champagne\",cat:\"Wine\",img:\"https://images.unsplash.com/photo-1578911373434-0cb395d2cbfb?auto=format&fit=crop&w=900&q=82\",price:\"2,200,000 VND / bottle\",title:{en:\"Champagne\",ru:\"Champagne\",vi:\"Champagne\"},desc:{en:\"For birthdays and first arrival.\",ru:\"Для праздника и первого тоста.\",vi:\"Cho sinh nhật và khai tiệc.\"},rec:{en:\"Best for Private Dining.\",ru:\"Лучше для Private Dining.\",vi:\"Hợp Private Dining.\"}},\n{id:\"family\",cat:\"Set\",img:\"https://images.unsplash.com/photo-1555244162-803834f70033?auto=format&fit=crop&w=900&q=82\",price:\"1,950,000 VND\",title:{en:\"Family sharing set\",ru:\"Family sharing set\",vi:\"Set gia đình\"},desc:{en:\"Shared plates for four to six guests.\",ru:\"Сет на 4–6 гостей.\",vi:\"Món chia sẻ cho 4–6 khách.\"},rec:{en:\"Good for Sky Garden.\",ru:\"Хорошо для Sky Garden.\",vi:\"Hợp Sky Garden.\"}},\n{id:\"celebration\",cat:\"Set\",img:\"https://images.unsplash.com/photo-1555243896-c709bfa0b564?auto=format&fit=crop&w=900&q=82\",price:\"from 4,500,000 VND\",title:{en:\"Celebration menu\",ru:\"Праздничное меню\",vi:\"Menu tiệc\"},desc:{en:\"For birthdays and private dinners.\",ru:\"Для дней рождения и частных ужинов.\",vi:\"Cho sinh nhật và tiệc riêng.\"},rec:{en:\"Choose Private Dining.\",ru:\"Выберите Private Dining.\",vi:\"Chọn Private Dining.\"}}\n]);\n\nexport const itemById=id=>MENU_ITEMS.find(item=>item.id===id);\nexport const spaceById=id=>SPACES.find(space=>space.id===id);\n","src/domain/reservation.js":"export const ReservationStep = Object.freeze({\n  DETAILS:0,\n  SPACE:1,\n  REVIEW:2,\n  DEPOSIT:3,\n  CONFIRMED:4\n});\n\nexport function validateDetails(draft){\n  const errors={};\n  if(!draft.name?.trim()) errors.name=\"required\";\n  if(!draft.phone?.trim()) errors.phone=\"required\";\n  if(!draft.date) errors.date=\"required\";\n  return errors;\n}\n\nexport function canContinueFromSpace(state){\n  return Boolean(state.selectedAreaId);\n}\n\nexport function createReservationRequest(state){\n  return Object.freeze({\n    id:\"LUME-\"+Math.floor(10000+Math.random()*90000),\n    createdAt:new Date().toISOString(),\n    status:\"request_created\",\n    areaId:state.selectedAreaId,\n    menuItemIds:[...state.selectedMenuIds],\n    details:{...state.reservationDraft}\n  });\n}\n\nexport function applyConciergePlan(state,plan){\n  if(!plan) return state;\n  const draft={...state.reservationDraft};\n  if(plan.time) draft.time=plan.time;\n  if(plan.guests) draft.guests=plan.guests;\n  return {\n    ...state,\n    selectedAreaId:plan.areaId || state.selectedAreaId,\n    selectedMenuIds:[...new Set([...state.selectedMenuIds,...(plan.menuItemIds||[])])],\n    reservationDraft:draft,\n    reservationStep:ReservationStep.DETAILS,\n    tab:\"reserve\"\n  };\n}\n","src/i18n/index.js":"import en from \"./locales/en.js\";\nimport ru from \"./locales/ru.js\";\nimport vi from \"./locales/vi.js\";\n\nconst locales={en,ru,vi};\nexport const SUPPORTED_LANGS=Object.keys(locales);\nexport const DEFAULT_LANG=\"en\";\n\nexport function t(lang,path){\n  const source=locales[SUPPORTED_LANGS.includes(lang)?lang:DEFAULT_LANG]||en;\n  return path.split(\".\").reduce((value,key)=>value?.[key],source) ?? path;\n}\nexport function tr(lang,value){return value?.[lang]??value?.[DEFAULT_LANG]??\"\";}\n\nfunction flatten(obj,prefix=\"\",out=new Set()){\n  Object.entries(obj).forEach(([key,value])=>{\n    const path=prefix?prefix+\".\"+key:key;\n    if(value&&typeof value===\"object\"&&!Array.isArray(value)) flatten(value,path,out);\n    else out.add(path);\n  });\n  return out;\n}\nexport function validateLocales(){\n  const base=flatten(en),missing=[];\n  for(const lang of SUPPORTED_LANGS){\n    for(const path of base){\n      const source=locales[lang];\n      const value=path.split(\".\").reduce((v,k)=>v?.[k],source);\n      if(value===undefined) missing.push(lang+\":\"+path);\n    }\n  }\n  return missing;\n}\n","src/i18n/locales/en.js":"export default {\nnav:{home:\"Home\",menu:\"Menu\",guest:\"Guest\",reserve:\"Reserve\",ask:\"Ask\"},\ncommon:{back:\"Back\",continue:\"Continue\",select:\"Select\",selected:\"Selected\",close:\"Close\",add:\"Add\",remove:\"Remove\",send:\"Send\",save:\"Save\"},\nhome:{service:\"Dinner service · 17:00–22:00\",kicker:\"Nha Trang · from a higher perspective\",title:\"Elevate every moment\",lead:\"Sky dining above Nha Trang. Panoramic views, refined cuisine and an evening shaped around you.\",reserve:\"Reserve a table\",menu:\"Explore menu\",spaces:\"Choose the experience\",spacesHint:\"Explore LUME’s signature spaces. Choose one now or refine the plan with the concierge.\",statement:\"A rooftop destination where city, sea and mountains become part of the evening.\",private:\"Private Dining & Events\",privateHint:\"For celebrations, business dinners and more private moments.\",proposal:\"Request proposal\"},\nmenu:{title:\"Menu\",hint:\"The demo catalog stays unchanged. Add items as preferences for your evening.\",myEvening:\"My evening\",empty:\"No preferences selected yet.\",notPreorder:\"Preferences, not a pre-order.\"},\nreserve:{title:\"Reserve\",hint:\"Create a reservation request in four clear steps.\",details:\"Details\",space:\"Space\",review:\"Review\",payment:\"Deposit\",date:\"Date\",time:\"Time\",guests:\"Guests\",occasion:\"Occasion\",name:\"Guest name\",phone:\"Phone\",email:\"Email\",chooseSpace:\"Choose a space\",secure:\"Continue to deposit\",submit:\"Confirm request\",requestOnly:\"This demo creates a reservation request. Live table availability is not connected yet.\",confirmed:\"Reservation request created\",required:\"Required field\"},\nguest:{title:\"Guest\",hint:\"Contact details, preferences and reservation requests live here.\",empty:\"No reservation requests yet.\"},\nconcierge:{title:\"Ask LUME\",hint:\"Describe the evening you want. The concierge considers your party, budget, menu preferences and the character of each space.\",placeholder:\"Tell LUME what kind of evening you want\",thinking:\"Curating your evening\",error:\"The concierge is temporarily unavailable. Please try again.\",plan:\"Your LUME plan\",space:\"Space\",time:\"Time\",mood:\"Mood\",pairing:\"Pairing\",why:\"Why it fits\",reserve:\"Reserve this plan\",add:\"Add suggested items\",prompts:[\"Romantic dinner for two\",\"Best cocktails for sunset\",\"Dinner with family\",\"Birthday for 12 guests\",\"Recommend wine for seafood\",\"Dinner under 2,000,000 VND\"]}\n};\n","src/i18n/locales/ru.js":"export default {\nnav:{home:\"Главная\",menu:\"Меню\",guest:\"Гость\",reserve:\"Бронь\",ask:\"AI\"},\ncommon:{back:\"Назад\",continue:\"Далее\",select:\"Выбрать\",selected:\"Выбрано\",close:\"Закрыть\",add:\"Добавить\",remove:\"Убрать\",send:\"Отправить\",save:\"Сохранить\"},\nhome:{service:\"Вечерний сервис · 17:00–22:00\",kicker:\"Нячанг · взгляд с высоты\",title:\"Поднять каждый момент выше\",lead:\"Ужин над Нячангом: панорамный вид, продуманная кухня и вечер, собранный вокруг ваших пожеланий.\",reserve:\"Забронировать стол\",menu:\"Открыть меню\",spaces:\"Выберите пространство\",spacesHint:\"Познакомьтесь с ключевыми пространствами LUME. Выберите сразу или уточните план с AI-консьержем.\",statement:\"Rooftop-пространство, где город, море и горы становятся частью вечера.\",private:\"Private Dining & Events\",privateHint:\"Для праздников, деловых ужинов и более приватных событий.\",proposal:\"Запросить предложение\"},\nmenu:{title:\"Меню\",hint:\"Демо-каталог оставлен без изменений. Добавляйте блюда как предпочтения к вечеру.\",myEvening:\"Мой вечер\",empty:\"Предпочтения пока не выбраны.\",notPreorder:\"Это предпочтения, а не предзаказ.\"},\nreserve:{title:\"Бронирование\",hint:\"Создайте запрос на стол в четырёх понятных шагах.\",details:\"Детали\",space:\"Пространство\",review:\"Проверка\",payment:\"Депозит\",date:\"Дата\",time:\"Время\",guests:\"Гостей\",occasion:\"Повод\",name:\"Имя гостя\",phone:\"Телефон\",email:\"Email\",chooseSpace:\"Выберите пространство\",secure:\"Перейти к депозиту\",submit:\"Подтвердить запрос\",requestOnly:\"Демо создаёт запрос на бронирование. Live-доступность столов пока не подключена.\",confirmed:\"Запрос на бронирование создан\",required:\"Обязательное поле\"},\nguest:{title:\"Гость\",hint:\"Контакты, предпочтения и запросы на бронирование хранятся здесь.\",empty:\"Запросов на бронирование пока нет.\"},\nconcierge:{title:\"Спросить LUME\",hint:\"Опишите желаемый вечер. Консьерж учитывает компанию, бюджет, выбранные блюда и характер каждого пространства.\",placeholder:\"Опишите, какой вечер вы хотите\",thinking:\"Собираю ваш вечер\",error:\"Консьерж временно недоступен. Попробуйте ещё раз.\",plan:\"Ваш план LUME\",space:\"Пространство\",time:\"Время\",mood:\"Настроение\",pairing:\"Сочетание\",why:\"Почему подходит\",reserve:\"Забронировать план\",add:\"Добавить рекомендации\",prompts:[\"Романтический ужин на двоих\",\"Лучшие коктейли на закате\",\"Ужин с семьёй\",\"День рождения на 12 гостей\",\"Вино к морепродуктам\",\"Ужин до 2 000 000 VND\"]}\n};\n"}
