          {"src/i18n/locales/vi.js":"export default {\nnav:{home:\"Trang chủ\",menu:\"Thực đơn\",guest:\"Khách\",reserve:\"Đặt bàn\",ask:\"AI\"},\ncommon:{back:\"Quay lại\",continue:\"Tiếp tục\",select:\"Chọn\",selected:\"Đã chọn\",close:\"Đóng\",add:\"Thêm\",remove:\"Xóa\",send:\"Gửi\",save:\"Lưu\"},\nhome:{service:\"Phục vụ buổi tối · 17:00–22:00\",kicker:\"Nha Trang · góc nhìn trên cao\",title:\"Nâng tầm từng khoảnh khắc\",lead:\"Ẩm thực trên cao tại Nha Trang với tầm nhìn toàn cảnh, món ăn tinh tế và một buổi tối theo mong muốn của bạn.\",reserve:\"Đặt bàn\",menu:\"Xem thực đơn\",spaces:\"Chọn không gian\",spacesHint:\"Khám phá các không gian đặc trưng của LUME. Chọn ngay hoặc để AI Concierge tinh chỉnh kế hoạch.\",statement:\"Không gian rooftop nơi thành phố, biển và núi trở thành một phần của trải nghiệm.\",private:\"Private Dining & Events\",privateHint:\"Dành cho tiệc, gặp gỡ công việc và những dịp riêng tư.\",proposal:\"Yêu cầu đề xuất\"},\nmenu:{title:\"Thực đơn\",hint:\"Danh mục demo được giữ nguyên. Thêm món như sở thích cho buổi tối.\",myEvening:\"Buổi tối của tôi\",empty:\"Chưa chọn sở thích.\",notPreorder:\"Đây là sở thích, không phải đặt món trước.\"},\nreserve:{title:\"Đặt bàn\",hint:\"Tạo yêu cầu đặt bàn qua bốn bước rõ ràng.\",details:\"Chi tiết\",space:\"Không gian\",review:\"Kiểm tra\",payment:\"Đặt cọc\",date:\"Ngày\",time:\"Giờ\",guests:\"Khách\",occasion:\"Dịp\",name:\"Tên khách\",phone:\"Điện thoại\",email:\"Email\",chooseSpace:\"Chọn không gian\",secure:\"Tiếp tục đặt cọc\",submit:\"Xác nhận yêu cầu\",requestOnly:\"Bản demo tạo yêu cầu đặt bàn. Tình trạng bàn trực tiếp chưa được kết nối.\",confirmed:\"Đã tạo yêu cầu đặt bàn\",required:\"Trường bắt buộc\"},\nguest:{title:\"Khách\",hint:\"Thông tin liên hệ, sở thích và yêu cầu đặt bàn được lưu tại đây.\",empty:\"Chưa có yêu cầu đặt bàn.\"},\nconcierge:{title:\"Hỏi LUME\",hint:\"Hãy mô tả buổi tối bạn muốn. Concierge cân nhắc số khách, ngân sách, món đã chọn và tính cách của từng không gian.\",placeholder:\"Hãy mô tả buổi tối bạn mong muốn\",thinking:\"Đang thiết kế buổi tối của bạn\",error:\"Concierge tạm thời chưa khả dụng. Vui lòng thử lại.\",plan:\"Kế hoạch LUME của bạn\",space:\"Không gian\",time:\"Thời gian\",mood:\"Không khí\",pairing:\"Gợi ý kết hợp\",why:\"Vì sao phù hợp\",reserve:\"Đặt kế hoạch này\",add:\"Thêm gợi ý\",prompts:[\"Bữa tối lãng mạn cho hai người\",\"Cocktail đẹp nhất lúc hoàng hôn\",\"Bữa tối gia đình\",\"Sinh nhật cho 12 khách\",\"Gợi ý vang cho hải sản\",\"Bữa tối dưới 2.000.000 VND\"]}\n};\n","src/services/concierge.js":"export async function askConcierge(payload, {signal} = {}) {\n  const response = await fetch(\"/api/concierge\", {\n    method: \"POST\",\n    headers: {\"content-type\":\"application/json\"},\n    body: JSON.stringify(payload),\n    signal\n  });\n  if (!response.ok) {\n    const body = await response.json().catch(() => ({}));\n    throw new Error(body.error || \"concierge_request_failed\");\n  }\n  return response.json();\n}\n","src/state/store.js":"const tomorrow = new Date(Date.now()+86400000).toISOString().slice(0,10);\n\nconst initialState = {\n  tab: \"home\",\n  lang: localStorage.getItem(\"lume_lang\") || \"en\",\n  category: \"Signature\",\n  selectedMenuIds: [],\n  selectedAreaId: null,\n  reservationStep: 0,\n  reservationDraft: {date:tomorrow,time:\"19:00\",guests:2,occasion:\"\",name:\"\",phone:\"\",email:\"\"},\n  reservationErrors: {},\n  reservationRequests: [],\n  conciergeHistory: [],\n  conciergePlan: null,\n  conciergeBusy: false\n};\n\nlet state = structuredClone(initialState);\nconst listeners = new Set();\n\nexport const store = {\n  get(){ return state; },\n  set(patch){\n    state = {...state, ...patch};\n    if (patch.lang) localStorage.setItem(\"lume_lang\", patch.lang);\n    listeners.forEach(fn => fn(state));\n  },\n  update(updater){\n    state = updater(state);\n    if (state.lang) localStorage.setItem(\"lume_lang\", state.lang);\n    listeners.forEach(fn => fn(state));\n  },\n  subscribe(fn){ listeners.add(fn); return () => listeners.delete(fn); }\n};\n","src/ui/dom.js":"export const escapeHtml = value => String(value ?? \"\").replace(/[&<>\\\"']/g, ch => ({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\\\"':\"&quot;\",\"'\":\"&#39;\"}[ch]));\nexport const qs = (selector, root=document) => root.querySelector(selector);\nexport const qsa = (selector, root=document) => [...root.querySelectorAll(selector)];\nexport function mount(root, markup){ root.innerHTML = markup; }\n","src/ui/screens/home.js":"import { BRAND } from \"../../brand.js\";\nimport { SPACES } from \"../../data/catalog.js\";\nimport { escapeHtml } from \"../dom.js\";\n\nexport function renderHome(state,{t,tr}){\n  const cards=SPACES.map(space=>[\n    '<button class=\"space-card\" data-action=\"choose-space\" data-id=\"'+space.id+'\">',\n    '<img src=\"'+space.image+'\" alt=\"\">',\n    '<span class=\"space-card-copy\"><h3>'+escapeHtml(tr(space.title))+'</h3><span class=\"muted\">'+escapeHtml(tr(space.text))+'</span></span>',\n    '</button>'\n  ].join(\"\")).join(\"\");\n  return [\n    '<section class=\"hero\" style=\"background-image:url(\\''+BRAND.heroImage+'\\')\">',\n      '<div class=\"hero-content\">',\n        '<div class=\"kicker\">'+escapeHtml(t(\"home.service\"))+'</div>',\n        '<h1 class=\"display\">'+escapeHtml(t(\"home.title\"))+'</h1>',\n        '<p class=\"lead\">'+escapeHtml(t(\"home.lead\"))+'</p>',\n        '<div class=\"actions\"><button class=\"btn\" data-action=\"tab\" data-tab=\"reserve\">'+escapeHtml(t(\"home.reserve\"))+'</button><button class=\"btn secondary\" data-action=\"tab\" data-tab=\"menu\">'+escapeHtml(t(\"home.menu\"))+'</button></div>',\n      '</div>',\n    '</section>',\n    '<section class=\"section\"><div class=\"kicker\">'+escapeHtml(t(\"home.kicker\"))+'</div><p class=\"statement\">'+escapeHtml(t(\"home.statement\"))+'</p></section>',\n    '<section class=\"section\"><div class=\"kicker\">LUME</div><h2 class=\"section-title\">'+escapeHtml(t(\"home.spaces\"))+'</h2><p class=\"muted\">'+escapeHtml(t(\"home.spacesHint\"))+'</p><div class=\"space-grid\">'+cards+'</div></section>',\n    '<section class=\"section private-card\"><div><div class=\"kicker\">'+escapeHtml(t(\"home.private\"))+'</div><p class=\"muted\">'+escapeHtml(t(\"home.privateHint\"))+'</p></div><button class=\"btn small\" data-action=\"event-request\">'+escapeHtml(t(\"home.proposal\"))+'</button></section>'\n  ].join(\"\");\n}","src/ui/screens/menu.js":"import { CATEGORIES, MENU_ITEMS } from \"../../data/catalog.js\";\nimport { escapeHtml } from \"../dom.js\";\n\nexport function renderMenu(state,{t,tr}){\n  const chips=CATEGORIES.map(cat=>'<button class=\"chip '+(state.category===cat?\"active\":\"\")+'\" data-action=\"category\" data-category=\"'+cat+'\">'+escapeHtml(cat)+'</button>').join(\"\");\n  const items=MENU_ITEMS.filter(item=>item.cat===state.category).map(item=>{\n    const selected=state.selectedMenuIds.includes(item.id);\n    return [\n      '<button class=\"menu-card\" data-action=\"toggle-menu-item\" data-id=\"'+item.id+'\">',\n        '<img src=\"'+item.img+'\" alt=\"\">',\n        '<span class=\"menu-card-body\"><h3>'+escapeHtml(tr(item.title))+'</h3><span class=\"muted\">'+escapeHtml(tr(item.desc))+'</span><p class=\"price\">'+escapeHtml(item.price)+(selected?\" · ✓\":\"\")+'</p></span>',\n      '</button>'\n    ].join(\"\");\n  }).join(\"\");\n  const selectedText=state.selectedMenuIds.length?state.selectedMenuIds.map(id=>MENU_ITEMS.find(item=>item.id===id)).filter(Boolean).map(item=>escapeHtml(tr(item.title))).join(\" · \"):escapeHtml(t(\"menu.empty\"));\n  return [\n    '<section class=\"section\"><div class=\"kicker\">LUME</div><h1 class=\"section-title\">'+escapeHtml(t(\"menu.title\"))+'</h1><p class=\"muted\">'+escapeHtml(t(\"menu.hint\"))+'</p></section>',\n    '<div class=\"chips\">'+chips+'</div>',\n    '<div class=\"menu-grid\">'+items+'</div>',\n    '<div class=\"floating-summary\"><div><strong>'+escapeHtml(t(\"menu.myEvening\"))+'</strong><div class=\"muted\">'+selectedText+'</div></div><button class=\"btn small\" data-action=\"tab\" data-tab=\"reserve\">→</button></div>'\n  ].join(\"\");\n}","src/ui/screens/guest.js":"import { spaceById } from \"../../data/catalog.js\";\nimport { escapeHtml } from \"../dom.js\";\n\nexport function renderGuest(state,{t,tr}){\n  const requests=state.reservationRequests.length?state.reservationRequests.map(request=>{\n    const space=spaceById(request.areaId);\n    return '<div class=\"panel\"><div class=\"kicker\">'+escapeHtml(request.id)+'</div><h3>'+escapeHtml(space?tr(space.title):\"LUME\")+'</h3><p class=\"muted\">'+escapeHtml(request.details.date||\"\")+' · '+escapeHtml(request.details.time||\"\")+' · '+escapeHtml(String(request.details.guests||\"\"))+'</p></div>';\n  }).join(\"\"):'<div class=\"empty\">'+escapeHtml(t(\"guest.empty\"))+'</div>';\n  return '<section class=\"section\"><div class=\"kicker\">LUME</div><h1 class=\"section-title\">'+escapeHtml(t(\"guest.title\"))+'</h1><p class=\"muted\">'+escapeHtml(t(\"guest.hint\"))+'</p></section><div class=\"form-grid\">'+requests+'</div>';\n}","src/ui/screens/reserve.js":"import { SPACES, MENU_ITEMS, spaceById } from \"../../data/catalog.js\";\nimport { ReservationStep } from \"../../domain/reservation.js\";\nimport { escapeHtml } from \"../dom.js\";\n\nfunction stepper(step){return '<div class=\"stepper\">'+[0,1,2,3].map(i=>'<span class=\"'+(i<=step?\"on\":\"\")+'\"></span>').join(\"\")+'</div>';}\nfunction field(label,name,value,type,errorText){\n  return '<div class=\"field\"><label>'+escapeHtml(label)+'</label><input data-field=\"'+name+'\" type=\"'+type+'\" value=\"'+escapeHtml(value??\"\")+'\">'+(errorText?'<span class=\"error\">'+escapeHtml(errorText)+'</span>':\"\")+'</div>';\n}\n\nexport function renderReserve(state,{t,tr}){\n  const d=state.reservationDraft;\n  const errors=state.reservationErrors||{};\n  const required=t(\"reserve.required\");\n  let body=\"\";\n  if(state.reservationStep===ReservationStep.DETAILS){\n    body=['<div class=\"panel form-grid\">',\n      field(t(\"reserve.date\"),\"date\",d.date,\"date\",errors.date?required:\"\"),\n      field(t(\"reserve.time\"),\"time\",d.time,\"time\",\"\"),\n      field(t(\"reserve.guests\"),\"guests\",d.guests,\"number\",\"\"),\n      field(t(\"reserve.occasion\"),\"occasion\",d.occasion,\"text\",\"\"),\n      field(t(\"reserve.name\"),\"name\",d.name,\"text\",errors.name?required:\"\"),\n      field(t(\"reserve.phone\"),\"phone\",d.phone,\"tel\",errors.phone?required:\"\"),\n      field(t(\"reserve.email\"),\"email\",d.email,\"email\",\"\"),\n      '<button class=\"btn full\" data-action=\"reserve-next-details\">'+escapeHtml(t(\"common.continue\"))+'</button></div>'\n    ].join(\"\");\n  } else if(state.reservationStep===ReservationStep.SPACE){\n    const options=SPACES.map(space=>'<button class=\"space-option '+(state.selectedAreaId===space.id?\"selected\":\"\")+'\" data-action=\"select-reserve-space\" data-id=\"'+space.id+'\"><img src=\"'+space.image+'\" alt=\"\"><span><strong>'+escapeHtml(tr(space.title))+'</strong><span class=\"muted\">'+escapeHtml(tr(space.text))+'</span></span></button>').join(\"\");\n    body='<h2 class=\"section-title\">'+escapeHtml(t(\"reserve.chooseSpace\"))+'</h2>'+(errors.space?'<p class=\"error\">'+escapeHtml(required)+'</p>':\"\")+options+'<div class=\"actions\"><button class=\"btn secondary\" data-action=\"reserve-back\">'+escapeHtml(t(\"common.back\"))+'</button><button class=\"btn\" data-action=\"reserve-next-space\">'+escapeHtml(t(\"common.continue\"))+'</button></div>';\n  } else if(state.reservationStep===ReservationStep.REVIEW){\n    const space=spaceById(state.selectedAreaId);\n    const prefs=state.selectedMenuIds.map(id=>MENU_ITEMS.find(item=>item.id===id)).filter(Boolean).map(item=>escapeHtml(tr(item.title))).join(\", \");\n    body='<div class=\"panel summary-list\"><div class=\"summary-row\"><span>'+escapeHtml(t(\"reserve.space\"))+'</span><strong>'+escapeHtml(space?tr(space.title):\"—\")+'</strong></div><div class=\"summary-row\"><span>'+escapeHtml(t(\"reserve.date\"))+'</span><strong>'+escapeHtml(d.date||\"—\")+'</strong></div><div class=\"summary-row\"><span>'+escapeHtml(t(\"reserve.time\"))+'</span><strong>'+escapeHtml(d.time||\"—\")+'</strong></div><div class=\"summary-row\"><span>'+escapeHtml(t(\"reserve.guests\"))+'</span><strong>'+escapeHtml(String(d.guests||\"—\"))+'</strong></div><div class=\"summary-row\"><span>Menu</span><strong>'+(prefs||\"—\")+'</strong></div></div><div class=\"actions\"><button class=\"btn secondary\" data-action=\"reserve-back\">'+escapeHtml(t(\"common.back\"))+'</button><button class=\"btn\" data-action=\"reserve-next-review\">'+escapeHtml(t(\"reserve.secure\"))+'</button></div>';\n  } else if(state.reservationStep===ReservationStep.DEPOSIT){\n    body='<div class=\"panel\"><div class=\"kicker\">500,000 VND</div><h2 class=\"section-title\">'+escapeHtml(t(\"reserve.payment\"))+'</h2><p class=\"muted\">'+escapeHtml(t(\"reserve.requestOnly\"))+'</p><div class=\"actions\"><button class=\"btn secondary\" data-action=\"reserve-back\">'+escapeHtml(t(\"common.back\"))+'</button><button class=\"btn\" data-action=\"reserve-confirm\">'+escapeHtml(t(\"reserve.submit\"))+'</button></div></div>';\n  } else {\n    body='<div class=\"panel\"><div class=\"kicker\">LUME</div><h2 class=\"section-title\">'+escapeHtml(t(\"reserve.confirmed\"))+'</h2><button class=\"btn\" data-action=\"tab\" data-tab=\"guest\">'+escapeHtml(t(\"nav.guest\"))+'</button></div>';\n  }\n  return '<section class=\"section\"><div class=\"kicker\">LUME</div><h1 class=\"section-title\">'+escapeHtml(t(\"reserve.title\"))+'</h1><p class=\"muted\">'+escapeHtml(t(\"reserve.hint\"))+'</p>'+stepper(state.reservationStep)+'</section>'+body;\n}","src/ui/screens/concierge.js":"import { BRAND } from \"../../brand.js\";\nimport { spaceById } from \"../../data/catalog.js\";\nimport { escapeHtml } from \"../dom.js\";\n\nfunction renderPlan(state,t,tr){\n  const plan=state.conciergePlan;\n  if(!plan) return \"\";\n  const space=spaceById(plan.areaId);\n  return [\n    '<div class=\"plan\"><div class=\"plan-head\"><div class=\"kicker\">'+escapeHtml(t(\"concierge.plan\"))+'</div><h3>'+escapeHtml(plan.title||t(\"concierge.plan\"))+'</h3></div>',\n    '<div class=\"plan-grid\">',\n      '<div class=\"plan-cell\"><b>'+escapeHtml(t(\"concierge.space\"))+'</b>'+escapeHtml(space?tr(space.title):(plan.areaId||\"—\"))+'</div>',\n      '<div class=\"plan-cell\"><b>'+escapeHtml(t(\"concierge.time\"))+'</b>'+escapeHtml(plan.time||\"—\")+'</div>',\n      '<div class=\"plan-cell\"><b>'+escapeHtml(t(\"concierge.mood\"))+'</b>'+escapeHtml(plan.mood||\"—\")+'</div>',\n      '<div class=\"plan-cell\"><b>'+escapeHtml(t(\"concierge.pairing\"))+'</b>'+escapeHtml(plan.pairing||\"—\")+'</div>',\n    '</div><div class=\"plan-head\"><b class=\"kicker\">'+escapeHtml(t(\"concierge.why\"))+'</b><p class=\"muted\">'+escapeHtml(plan.reason||\"\")+'</p></div>',\n    '<div class=\"plan-actions\"><button class=\"btn small\" data-action=\"concierge-reserve\">'+escapeHtml(t(\"concierge.reserve\"))+'</button><button class=\"btn secondary small\" data-action=\"concierge-add\">'+escapeHtml(t(\"concierge.add\"))+'</button></div></div>'\n  ].join(\"\");\n}\n\nexport function renderConcierge(state,{t,tr}){\n  const prompts=t(\"concierge.prompts\").map(prompt=>'<button class=\"chip\" data-action=\"concierge-prompt\" data-prompt=\"'+escapeHtml(prompt)+'\">'+escapeHtml(prompt)+'</button>').join(\"\");\n  const history=state.conciergeHistory.map(msg=>'<div class=\"message '+(msg.role===\"user\"?\"user\":\"\")+'\">'+escapeHtml(msg.content)+'</div>').join(\"\");\n  const busy=state.conciergeBusy?'<div class=\"message thinking\">'+escapeHtml(t(\"concierge.thinking\"))+'…</div>':\"\";\n  return [\n    '<div class=\"concierge-hero\" style=\"background-image:url(\\''+BRAND.conciergeImage+'\\')\"><div class=\"kicker\">LUME CONCIERGE</div><h1 class=\"section-title\">'+escapeHtml(t(\"concierge.title\"))+'</h1><p class=\"muted\">'+escapeHtml(t(\"concierge.hint\"))+'</p></div>',\n    '<div class=\"chips\" style=\"margin-top:14px\">'+prompts+'</div>',\n    '<div class=\"chat\">'+history+busy+renderPlan(state,t,tr)+'</div>',\n    '<div class=\"chat-input\"><div class=\"row\"><input id=\"concierge-input\" placeholder=\"'+escapeHtml(t(\"concierge.placeholder\"))+'\"><button class=\"btn small\" data-action=\"concierge-send\">'+escapeHtml(t(\"common.send\"))+'</button></div></div>'\n  ].join(\"\");\n}","worker/domain.js":"export const MODEL = \"@cf/meta/llama-3.3-70b-instruct-fp8-fast\";\n\nexport const VENUE = Object.freeze({\n  name:\"LUME Sky Dining & Bar\",\n  city:\"Nha Trang\",\n  address:\"29 Phan Chu Trinh, Nha Trang, Khanh Hoa, Vietnam\",\n  hours:{breakfast:\"08:00–10:30\",lunch:\"11:00–14:30\",dinner:\"17:00–22:00\"},\n  spaces:{\n    dining:\"Sky Dining — refined rooftop dining, strongest fit for a composed dinner and wine pairing.\",\n    garden:\"Sky Garden — open-air greenery, sunset light, softer rhythm for families and relaxed groups.\",\n    bar:\"Sky Bar — signature cocktails, music, city lights and a more social evening.\",\n    rooftop:\"Rooftop — the widest panorama across city, mountains, river and sea.\"\n  },\n  specialSpaces:[\n    \"Private Dining — for important meetings, birthdays and intimate celebrations.\",\n    \"Wine Cellar — a private wine-focused setting.\"\n  ]\n});\n\nexport const MENU = Object.freeze([\n  {id:\"lobster\",title:\"Nha Trang lobster\",price:\"1,450,000 VND\",note:\"grilled local lobster with citrus butter; pairs with Sauvignon Blanc\"},\n  {id:\"beef\",title:\"Wagyu striploin\",price:\"890,000 VND\",note:\"charcoal grilled with truffle jus\"},\n  {id:\"tuna\",title:\"Tuna tartare\",price:\"420,000 VND\",note:\"fresh tuna, avocado and ponzu\"},\n  {id:\"duck\",title:\"Five-spice duck\",price:\"690,000 VND\",note:\"crisp skin, plum glaze and greens; pairs with medium red wine\"},\n  {id:\"sunset\",title:\"Sunset Negroni\",price:\"260,000 VND\",note:\"bitter orange, vermouth and rooftop mood\"},\n  {id:\"spritz\",title:\"LUME Spritz\",price:\"240,000 VND\",note:\"light aperitif, sparkling wine and soda\"},\n  {id:\"martini\",title:\"Lychee Martini\",price:\"280,000 VND\",note:\"floral vodka, lychee and citrus\"},\n  {id:\"sauv\",title:\"Sauvignon Blanc\",price:\"320,000 VND / glass\",note:\"crisp white wine for seafood\"},\n  {id:\"pinot\",title:\"Pinot Noir\",price:\"390,000 VND / glass\",note:\"elegant red for duck\"},\n  {id:\"champagne\",title:\"Champagne\",price:\"2,200,000 VND / bottle\",note:\"for celebrations and first toast\"},\n  {id:\"family\",title:\"Family sharing set\",price:\"1,950,000 VND\",note:\"shared plates for four to six guests\"},\n  {id:\"celebration\",title:\"Celebration menu\",price:\"from 4,500,000 VND\",note:\"custom courses, wine and dessert\"}\n]);\n\nconst AREA_IDS=new Set([\"dining\",\"garden\",\"bar\",\"rooftop\"]);\nconst EXPERIENCE_IDS=new Set([\"romantic\",\"sunset\",\"family\",\"private\"]);\nconst MENU_IDS=new Set(MENU.map(item=>item.id));\n\nexport const menuIds=()=>Array.from(MENU_IDS);\n\nexport function cleanText(value,max=1200){\n  return String(value==null?\"\":value).replace(/\\0/g,\"\").trim().slice(0,max);\n}\n\nexport function safeHistory(value){\n  if(!Array.isArray(value)) return [];\n  return value.slice(-8)\n    .map(entry=>({role:entry?.role===\"assistant\"?\"assistant\":\"user\",content:cleanText(entry?.content,800)}))\n    .filter(entry=>Boolean(entry.content));\n}\n\nexport function normalizePlan(plan){\n  if(!plan||typeof plan!==\"object\") return null;\n  const areaId=AREA_IDS.has(plan.areaId)?plan.areaId:null;\n  const experienceId=EXPERIENCE_IDS.has(plan.experienceId)?plan.experienceId:null;\n  const menuItemIds=Array.isArray(plan.menuItemIds)?plan.menuItemIds.filter(id=>MENU_IDS.has(id)).slice(0,5):[];\n  const guests=Number.isFinite(Number(plan.guests))?Math.min(50,Math.max(1,Number(plan.guests))):null;\n  const time=/^(1[7-9]|20):[0-5]\\d$/.test(String(plan.time||\"\"))?String(plan.time):null;\n  if(!areaId&&!experienceId&&!menuItemIds.length&&!plan.title) return null;\n  return {\n    title:cleanText(plan.title,100),\n    areaId,\n    experienceId,\n    time,\n    guests,\n    mood:cleanText(plan.mood,140),\n    pairing:cleanText(plan.pairing,180),\n    reason:cleanText(plan.reason,280),\n    menuItemIds\n  };\n}\n\nexport function buildPrompt({message,lang,history,context}){\n  const language=lang===\"ru\"?\"Russian\":lang===\"vi\"?\"Vietnamese\":\"English\";\n  const menu=MENU.map(item=>item.id+\": \"+item.title+\" — \"+item.price+\"; \"+item.note).join(\"\\n\");\n  const spaces=Object.entries(VENUE.spaces).map(([id,text])=>id+\": \"+text).join(\"\\n\");\n  const prior=history.map(entry=>entry.role.toUpperCase()+\": \"+entry.content).join(\"\\n\");\n  return [\n    \"You are LUME Concierge, a premium restaurant concierge for \"+VENUE.name+\" in \"+VENUE.city+\".\",\n    \"Reply in \"+language+\". Be concise, elegant, useful and concrete.\",\n    \"\",\n    \"AUTHORITATIVE VENUE FACTS\",\n    \"Address: \"+VENUE.address,\n    \"Hours: breakfast \"+VENUE.hours.breakfast+\"; lunch \"+VENUE.hours.lunch+\"; dinner \"+VENUE.hours.dinner+\".\",\n    \"Spaces:\",\n    spaces,\n    \"Special spaces:\",\n    \"- \"+VENUE.specialSpaces.join(\"\\n- \"),\n    \"\",\n    \"DEMO MENU — use only these item IDs and titles when recommending menu items:\",\n    menu,\n    \"\",\n    \"TRUTH RULES\",\n    \"- Never claim live table availability, confirmed booking, confirmed payment or real-time inventory.\",\n    \"- The demo creates a reservation request only.\",\n    \"- Never invent menu items, prices, spaces, opening hours or policies.\",\n    \"- Respect budget, dietary preference, party size, occasion and selected menu items in context.\",\n    \"- If the request is broad, propose one best-fit plan.\",\n    \"- Return only valid JSON.\",\n    \"\",\n    \"CURRENT APP CONTEXT\",\n    JSON.stringify(context||{}),\n    \"\",\n    \"RECENT CONVERSATION\",\n    prior||\"(none)\",\n    \"\",\n    \"CURRENT USER MESSAGE\",\n    message\n  ].join(\"\\n\");\n}\n","worker/concierge.js":"import { MODEL, buildPrompt, cleanText, menuIds, normalizePlan, safeHistory } from \"./domain.js\";\n\nfunction json(data,status=200){\n  return new Response(JSON.stringify(data),{\n    status,\n    headers:{\"content-type\":\"application/json; charset=utf-8\",\"cache-control\":\"no-store\",\"x-content-type-options\":\"nosniff\"}\n  });\n}\n\nfunction extractJson(value){\n  const raw=typeof value===\"string\"?value:JSON.stringify(value==null?{}:value);\n  const first=raw.indexOf(\"{\"),last=raw.lastIndexOf(\"}\");\n  if(first<0||last<first) throw new Error(\"Model did not return JSON\");\n  return JSON.parse(raw.slice(first,last+1));\n}\n\nexport async function handleConcierge(request,env){\n  let body;\n  try{body=await request.json();}catch{return json({error:\"invalid_json\"},400);}\n  const message=cleanText(body?.message,1200);\n  if(!message) return json({error:\"message_required\"},400);\n  if(!env.AI) return json({error:\"ai_binding_unavailable\"},503);\n\n  const history=safeHistory(body?.history);\n  const prompt=buildPrompt({message,lang:body?.lang,history,context:body?.context&&typeof body.context===\"object\"?body.context:{}});\n\n  try{\n    const ids=menuIds();\n    const result=await env.AI.run(MODEL,{\n      messages:[\n        {role:\"system\",content:\"You are LUME Concierge. Follow the supplied venue facts and truth rules exactly.\"},\n        {role:\"user\",content:prompt}\n      ],\n      response_format:{\n        type:\"json_schema\",\n        json_schema:{\n          type:\"object\",\n          properties:{\n            reply:{type:\"string\"},\n            plan:{\n              type:\"object\",\n              properties:{\n                title:{type:\"string\"},\n                areaId:{type:\"string\",enum:[\"dining\",\"garden\",\"bar\",\"rooftop\"]},\n                experienceId:{type:\"string\",enum:[\"romantic\",\"sunset\",\"family\",\"private\"]},\n                time:{type:\"string\"},\n                guests:{type:\"number\"},\n                mood:{type:\"string\"},\n                pairing:{type:\"string\"},\n                reason:{type:\"string\"},\n                menuItemIds:{type:\"array\",items:{type:\"string\",enum:ids}}\n              },\n              required:[\"title\",\"areaId\",\"experienceId\",\"time\",\"guests\",\"mood\",\"pairing\",\"reason\",\"menuItemIds\"]\n            }\n          },\n          required:[\"reply\",\"plan\"]\n        }\n      },\n      max_tokens:700,\n      temperature:0.3\n    });\n\n    const raw=result?.response ?? result?.choices?.[0]?.message?.content ?? result;\n    const parsed=raw&&typeof raw===\"object\"&&!Array.isArray(raw)?raw:extractJson(raw);\n    const reply=cleanText(parsed?.reply,900);\n    if(!reply) throw new Error(\"Empty reply\");\n    return json({reply,plan:normalizePlan(parsed?.plan),source:\"workers-ai\",model:MODEL});\n  }catch(error){\n    console.error(\"LUME concierge inference failed\",error);\n    return json({error:\"concierge_inference_failed\"},502);\n  }\n}\n","worker/index.js":"import { MODEL } from \"./domain.js\";\nimport { handleConcierge } from \"./concierge.js\";\n\nfunction json(data,status=200){\n  return new Response(JSON.stringify(data),{\n    status,\n    headers:{\"content-type\":\"application/json; charset=utf-8\",\"cache-control\":\"no-store\"}\n  });\n}\n\nexport default {\n  async fetch(request,env){\n    const url=new URL(request.url);\n    if(url.pathname===\"/api/health\"){\n      return json({ok:true,service:\"lume-mini-app-v2\",aiBinding:Boolean(env.AI),model:MODEL});\n    }\n    if(url.pathname===\"/api/concierge\"){\n      if(request.method!==\"POST\") return json({error:\"method_not_allowed\"},405);\n      return handleConcierge(request,env);\n    }\n    return env.ASSETS.fetch(request);\n  }\n};\n"}
          LUME_BUNDLE_B
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          for (const file of ['/tmp/bundle-a.json','/tmp/bundle-b.json']) {
            const bundle = JSON.parse(fs.readFileSync(file,'utf8'));
            for (const [name, content] of Object.entries(bundle)) {
              const target = path.join('lume-v2', name);
              fs.mkdirSync(path.dirname(target), {recursive:true});
              fs.writeFileSync(target, content, 'utf8');
            }
          }
          NODE

      - name: Validate and build
        shell: bash
        run: |
          set -euo pipefail
          cd lume-v2
          npm run check:syntax
          npm run build
          test -f dist/index.html
          test -f dist/src/app.js
          test -f dist/styles/app.css

      - name: Deploy Cloudflare preview
        shell: bash
        run: |
          set -euo pipefail
          cd lume-v2
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify preview and AI
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/lume-v2.html -w '%{http_code}' "https://lume-v2.viiversion.com/" || true)
            if [ "${code}" = "200" ] && grep -Fq '<title>LUME</title>' /tmp/lume-v2.html && grep -Fq '/src/app.js' /tmp/lume-v2.html; then
              ready=1
              break
            fi
            echo "Waiting for preview (attempt ${attempt}, HTTP ${code})"
            sleep 5
          done
          test "${ready}" -eq 1

          curl -fsS "https://lume-v2.viiversion.com/api/health" > /tmp/health.json
          jq -e '.ok == true and .aiBinding == true' /tmp/health.json >/dev/null

          curl -fsS -X POST "https://lume-v2.viiversion.com/api/concierge" \
            -H 'content-type: application/json' \
            --data '{"message":"Romantic dinner for two with seafood around sunset","lang":"en","history":[],"context":{"selectedMenuItemIds":["lobster"]}}' \
            > /tmp/concierge.json
          jq -e '.reply | type == "string" and length > 0' /tmp/concierge.json >/dev/null
          jq -e '.plan.areaId | IN("dining","garden","bar","rooftop")' /tmp/concierge.json >/dev/null
          echo "LUME v2 preview verified: https://lume-v2.viiversion.com"
