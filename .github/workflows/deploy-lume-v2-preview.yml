name: Deploy LUME v2 Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-lume-v2-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lume-v2-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare token
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            exit 0
          fi
          curl -fsS "https://api.cloudflare.com/client/v4/zones?name=viiversion.com&per_page=5" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/zones.json
          id=$(jq -r '[.result[]? | select(.name=="viiversion.com")][0].account.id // empty' /tmp/zones.json)
          test -n "${id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${id}" >> "${GITHUB_ENV}"

      - name: Materialize v2 source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lume-v2
          cat > /tmp/bundle-a.json <<'LUME_BUNDLE_A'
          {"index.html":"<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n  <meta name=\"theme-color\" content=\"#070605\">\n  <title>LUME</title>\n  <link rel=\"canonical\" href=\"https://lume.viiversion.com/\">\n  <link rel=\"stylesheet\" href=\"/styles/tokens.css\">\n  <link rel=\"stylesheet\" href=\"/styles/app.css\">\n</head>\n<body>\n  <div class=\"app\">\n    <header class=\"topbar\" id=\"topbar\"></header>\n    <main class=\"screen\" id=\"screen\"></main>\n    <nav class=\"bottom-nav\" id=\"bottom-nav\"></nav>\n  </div>\n  <script type=\"module\" src=\"/src/app.js\"></script>\n</body>\n</html>","package.json":"{\n  \"name\": \"lume-mini-app\",\n  \"private\": true,\n  \"type\": \"module\",\n  \"scripts\": {\n    \"build\": \"node scripts/build-static.mjs\",\n    \"check:syntax\": \"node --check src/app.js && node --check worker/index.js && node --check worker/concierge.js && node --check worker/domain.js\"\n  }\n}\n","scripts/build-static.mjs":"import { cp, mkdir, rm } from \"node:fs/promises\";\nimport { resolve } from \"node:path\";\n\nconst root=process.cwd();\nconst dist=resolve(root,\"dist\");\nawait rm(dist,{recursive:true,force:true});\nawait mkdir(dist,{recursive:true});\nawait cp(resolve(root,\"index.html\"),resolve(dist,\"index.html\"));\nawait cp(resolve(root,\"src\"),resolve(dist,\"src\"),{recursive:true});\nawait cp(resolve(root,\"styles\"),resolve(dist,\"styles\"),{recursive:true});\nconsole.log(\"Built static app into dist/\");","wrangler.jsonc":"{\n  \"$schema\": \"./node_modules/wrangler/config-schema.json\",\n  \"name\": \"lume-mini-app-v2\",\n  \"main\": \"worker/index.js\",\n  \"compatibility_date\": \"2026-10-06\",\n  \"workers_dev\": true,\n  \"routes\": [\n    {\n      \"pattern\": \"lume-v2.viiversion.com\",\n      \"custom_domain\": true\n    }\n  ],\n  \"assets\": {\n    \"directory\": \"./dist\",\n    \"binding\": \"ASSETS\",\n    \"run_worker_first\": [\"/api/*\"]\n  },\n  \"ai\": {\n    \"binding\": \"AI\"\n  },\n  \"observability\": {\n    \"enabled\": true\n  }\n}\n","styles/tokens.css":":root{\n  color-scheme:dark;\n  --bg:#070605;\n  --surface:#0f0c09;\n  --surface-2:#17120d;\n  --text:#f7f0e5;\n  --muted:rgba(247,240,229,.66);\n  --line:rgba(232,201,139,.16);\n  --gold:#dfbd76;\n  --gold-strong:#efcf8d;\n  --success:#a8d6b6;\n  --danger:#ff9b89;\n  --radius-sm:16px;\n  --radius-md:24px;\n  --radius-lg:34px;\n  --shadow:0 28px 80px rgba(0,0,0,.48);\n  --font-display:Georgia,\"Times New Roman\",serif;\n  --font-ui:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;\n}\n","styles/app.css":"*{box-sizing:border-box}\nhtml,body{margin:0;min-height:100%;background:#030303;color:var(--text);font-family:var(--font-ui)}\nbody{overflow:hidden}\nbutton,input,select{font:inherit;color:inherit}\nbutton{border:0;cursor:pointer}\n.app{width:min(460px,100vw);height:100dvh;margin:auto;position:relative;overflow:hidden;background:radial-gradient(circle at 50% -15%,rgba(223,189,118,.16),transparent 34%),var(--bg)}\n.topbar{height:66px;position:absolute;inset:0 0 auto;z-index:30;display:flex;align-items:center;justify-content:space-between;padding:10px 15px;background:linear-gradient(180deg,rgba(0,0,0,.45),transparent)}\n.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);letter-spacing:.2em}\n.brand-mark{width:30px;height:30px;border:1px solid rgba(223,189,118,.42);border-radius:50%;display:grid;place-items:center;color:var(--gold)}\n.langs{display:flex;padding:4px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.35);backdrop-filter:blur(16px)}\n.langs button{background:transparent;color:var(--muted);border-radius:999px;padding:7px 9px;font-size:11px}\n.langs button.active{background:rgba(223,189,118,.18);color:var(--text)}\n.screen{position:absolute;inset:0;padding:72px 14px 104px;overflow:auto;scrollbar-width:none}\n.screen::-webkit-scrollbar{display:none}\n.hero{min-height:540px;margin:-72px -14px 22px;border-radius:0 0 var(--radius-lg) var(--radius-lg);background-size:cover;background-position:center;position:relative;overflow:hidden;box-shadow:var(--shadow)}\n.hero::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.08) 34%,rgba(7,6,5,.3) 56%,#070605 100%),linear-gradient(90deg,rgba(0,0,0,.5),transparent 68%)}\n.hero-content{position:absolute;z-index:2;left:18px;right:18px;bottom:32px}\n.kicker{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-strong);font-weight:700}\n.display{font-family:var(--font-display);font-size:49px;line-height:.93;font-weight:400;margin:10px 0 12px;letter-spacing:-.035em}\n.lead{font-size:16px;line-height:1.48;color:rgba(247,240,229,.86);max-width:350px}\n.actions,.row{display:flex;gap:9px}\n.actions{margin-top:18px}\n.btn{min-height:48px;border-radius:999px;padding:0 18px;background:linear-gradient(135deg,#eccb87,#ae7e40);color:#160f08;font-weight:800;display:inline-flex;align-items:center;justify-content:center}\n.btn.secondary{background:rgba(5,4,3,.5);color:var(--text);border:1px solid rgba(232,201,139,.24);backdrop-filter:blur(15px)}\n.btn.small{min-height:38px;padding:0 13px;font-size:12px}\n.btn.full{width:100%}\n.section{margin:26px 0}\n.section-title{font:400 32px/1 var(--font-display);margin:7px 0}\n.muted{color:var(--muted);font-size:13px;line-height:1.48}\n.statement{font:400 21px/1.35 var(--font-display);color:rgba(247,240,229,.88);padding:0 4px}\n.space-grid,.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:14px}\n.space-card{min-height:205px;border:1px solid var(--line);border-radius:25px;overflow:hidden;position:relative;background:#15110d;box-shadow:0 22px 55px rgba(0,0,0,.35);text-align:left;padding:0}\n.space-card img{width:100%;height:100%;position:absolute;object-fit:cover}\n.space-card::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,transparent 28%,rgba(0,0,0,.9))}\n.space-card-copy{position:absolute;z-index:2;left:13px;right:13px;bottom:13px}\n.space-card h3,.menu-card h3{font:400 20px/1.05 var(--font-display);margin:0 0 5px}\n.private-card,.panel{border:1px solid var(--line);background:linear-gradient(140deg,rgba(223,189,118,.09),rgba(255,255,255,.025));border-radius:var(--radius-md);padding:15px}\n.private-card{display:flex;align-items:center;justify-content:space-between;gap:14px}\n.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 12px;scrollbar-width:none}\n.chip{white-space:nowrap;padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted)}\n.chip.active{background:var(--gold);color:#171008;font-weight:800}\n.menu-card{border:1px solid var(--line);border-radius:22px;overflow:hidden;background:rgba(255,255,255,.035);text-align:left;padding:0}\n.menu-card img{width:100%;height:135px;object-fit:cover}\n.menu-card-body{padding:12px}\n.price{color:var(--gold-strong);font-weight:800}\n.floating-summary{position:sticky;bottom:0;margin-top:12px;border:1px solid rgba(223,189,118,.28);background:rgba(20,15,10,.92);backdrop-filter:blur(18px);border-radius:22px;padding:11px 13px;display:flex;justify-content:space-between;align-items:center}\n.form-grid{display:grid;gap:11px}\n.field{display:grid;gap:6px}\n.field label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}\n.field input,.field select{width:100%;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:15px;padding:0 13px;outline:none}\n.error{font-size:11px;color:var(--danger)}\n.space-option{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:10px;border:1px solid var(--line);border-radius:20px;margin-bottom:10px;background:rgba(255,255,255,.025);text-align:left}\n.space-option.selected{border-color:rgba(223,189,118,.75)}\n.space-option img{width:96px;height:88px;border-radius:15px;object-fit:cover}\n.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:12px 0 16px}\n.stepper span{height:4px;border-radius:999px;background:rgba(255,255,255,.12)}\n.stepper span.on{background:var(--gold)}\n.concierge-hero{min-height:190px;border-radius:28px;padding:20px;display:flex;flex-direction:column;justify-content:end;background-size:cover;background-position:center;position:relative;overflow:hidden}\n.concierge-hero::after{content:\"\";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.82))}\n.concierge-hero>*{position:relative;z-index:2}\n.chat{display:grid;gap:10px;margin-top:12px}\n.message{max-width:91%;padding:12px 13px;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.04);line-height:1.45;font-size:13px}\n.message.user{margin-left:auto;background:rgba(223,189,118,.13)}\n.plan{border:1px solid rgba(223,189,118,.24);border-radius:20px;overflow:hidden;margin-top:10px}\n.plan-head{padding:13px;background:rgba(223,189,118,.09)}\n.plan-grid{display:grid;grid-template-columns:1fr 1fr}\n.plan-cell{padding:11px;border-top:1px solid var(--line)}\n.plan-cell:nth-child(odd){border-right:1px solid var(--line)}\n.plan-cell b{display:block;font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--gold);margin-bottom:4px}\n.plan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px;border-top:1px solid var(--line)}\n.thinking{color:var(--muted);font-size:12px}\n.chat-input{position:sticky;bottom:0;padding-top:12px;background:linear-gradient(180deg,transparent,var(--bg) 24%)}\n.chat-input .row{align-items:center}\n.chat-input input{flex:1;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:999px;padding:0 15px;outline:none}\n.bottom-nav{position:absolute;z-index:40;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);padding:7px;border:1px solid var(--line);border-radius:24px;background:rgba(7,6,5,.88);backdrop-filter:blur(18px)}\n.nav-btn{height:54px;border-radius:18px;background:transparent;color:var(--muted);display:grid;place-items:center;font-size:10px}\n.nav-btn.active{background:rgba(223,189,118,.12);color:#f7dfad}\n.nav-icon{font-size:17px}\n.empty{padding:28px;border:1px dashed var(--line);border-radius:22px;text-align:center;color:var(--muted)}\n.summary-list{display:grid;gap:9px}\n.summary-row{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);padding:8px 0}\n.summary-row:last-child{border-bottom:0}\n@media(max-width:360px){.space-grid,.menu-grid{grid-template-columns:1fr}.display{font-size:44px}}\n","src/app.js":"import { BRAND } from \"./brand.js\";\nimport { store } from \"./state/store.js\";\nimport { t as translate, tr as localize, SUPPORTED_LANGS, validateLocales } from \"./i18n/index.js\";\nimport { MENU_ITEMS } from \"./data/catalog.js\";\nimport { askConcierge } from \"./services/concierge.js\";\nimport { ReservationStep, validateDetails, canContinueFromSpace, createReservationRequest, applyConciergePlan } from \"./domain/reservation.js\";\nimport { renderHome } from \"./ui/screens/home.js\";\nimport { renderMenu } from \"./ui/screens/menu.js\";\nimport { renderGuest } from \"./ui/screens/guest.js\";\nimport { renderReserve } from \"./ui/screens/reserve.js\";\nimport { renderConcierge } from \"./ui/screens/concierge.js\";\nimport { qs, escapeHtml } from \"./ui/dom.js\";\n\nconst screen = qs(\"#screen\");\nconst topbar = qs(\"#topbar\");\nconst nav = qs(\"#bottom-nav\");\nconst renderers = {home:renderHome, menu:renderMenu, guest:renderGuest, reserve:renderReserve, concierge:renderConcierge};\nconst icons = {home:\"⌂\",menu:\"≋\",guest:\"◎\",reserve:\"□\",concierge:\"✦\"};\n\nfunction i18nFor(state){\n  return {\n    t:(path)=>translate(state.lang,path),\n    tr:(value)=>localize(state.lang,value)\n  };\n}\n\nfunction renderTopbar(state){\n  topbar.innerHTML = [\n    '<div class=\"brand\"><span class=\"brand-mark\">'+BRAND.mark+'</span><span>'+BRAND.name+'</span></div>',\n    '<div class=\"langs\">'+SUPPORTED_LANGS.map(lang=>'<button class=\"'+(state.lang===lang?\"active\":\"\")+'\" data-action=\"lang\" data-lang=\"'+lang+'\">'+lang.toUpperCase()+'</button>').join(\"\")+'</div>'\n  ].join(\"\");\n}\n\nfunction renderNav(state){\n  const t=(path)=>translate(state.lang,path);\n  const items=[[\"home\",\"home\"],[\"menu\",\"menu\"],[\"guest\",\"guest\"],[\"reserve\",\"reserve\"],[\"concierge\",\"ask\"]];\n  nav.innerHTML=items.map(([tab,key])=>[\n    '<button class=\"nav-btn '+(state.tab===tab?\"active\":\"\")+'\" data-action=\"tab\" data-tab=\"'+tab+'\">',\n    '<span class=\"nav-icon\">'+icons[tab]+'</span><span>'+escapeHtml(t(\"nav.\"+key))+'</span></button>'\n  ].join(\"\")).join(\"\");\n}\n\nfunction render(){\n  const state=store.get();\n  document.documentElement.lang=state.lang;\n  renderTopbar(state);\n  renderNav(state);\n  const renderer=renderers[state.tab]||renderHome;\n  screen.innerHTML=renderer(state,i18nFor(state));\n}\n\nfunction updateDraftFromDom(){\n  const fields=[...document.querySelectorAll(\"[data-field]\")];\n  if(!fields.length) return;\n  const draft={...store.get().reservationDraft};\n  fields.forEach(field=>{\n    const key=field.dataset.field;\n    draft[key]=key===\"guests\"?Number(field.value||0):field.value;\n  });\n  store.set({reservationDraft:draft});\n}\n\nasync function runConcierge(message){\n  const clean=String(message||\"\").trim();\n  if(!clean || store.get().conciergeBusy) return;\n  const before=store.get();\n  const historyBefore=before.conciergeHistory.slice(-8);\n  store.set({\n    conciergeBusy:true,\n    conciergeHistory:[...before.conciergeHistory,{role:\"user\",content:clean}],\n    conciergePlan:null\n  });\n  try{\n    const state=store.get();\n    const result=await askConcierge({\n      message:clean,\n      lang:state.lang,\n      history:historyBefore,\n      context:{\n        selectedArea:state.selectedAreaId,\n        selectedMenuItemIds:state.selectedMenuIds,\n        details:state.reservationDraft,\n        guest:{name:state.reservationDraft.name||\"\"}\n      }\n    });\n    const current=store.get();\n    store.set({\n      conciergeBusy:false,\n      conciergePlan:result.plan||null,\n      conciergeHistory:[...current.conciergeHistory,{role:\"assistant\",content:result.reply||\"\"}]\n    });\n  }catch(error){\n    console.error(\"Concierge request failed\",error);\n    const current=store.get();\n    store.set({\n      conciergeBusy:false,\n      conciergeHistory:[...current.conciergeHistory,{role:\"assistant\",content:translate(current.lang,\"concierge.error\")}]\n    });\n  }\n}\n\ndocument.addEventListener(\"click\",event=>{\n  const target=event.target.closest(\"[data-action]\");\n  if(!target) return;\n  const action=target.dataset.action;\n  const state=store.get();\n\n  if(action===\"tab\"){ store.set({tab:target.dataset.tab}); return; }\n  if(action===\"lang\"){ store.set({lang:target.dataset.lang}); return; }\n  if(action===\"category\"){ store.set({category:target.dataset.category}); return; }\n  if(action===\"choose-space\"){ store.set({selectedAreaId:target.dataset.id,tab:\"reserve\",reservationStep:ReservationStep.DETAILS}); return; }\n  if(action===\"event-request\"){ store.set({tab:\"reserve\",reservationStep:ReservationStep.DETAILS,reservationDraft:{...state.reservationDraft,occasion:\"Private Dining & Events\"}}); return; }\n  if(action===\"toggle-menu-item\"){\n    const id=target.dataset.id;\n    const selected=state.selectedMenuIds.includes(id);\n    store.set({selectedMenuIds:selected?state.selectedMenuIds.filter(x=>x!==id):[...state.selectedMenuIds,id]});\n    return;\n  }\n  if(action===\"select-reserve-space\"){ store.set({selectedAreaId:target.dataset.id,reservationErrors:{}}); return; }\n  if(action===\"reserve-next-details\"){\n    updateDraftFromDom();\n    const next=store.get();\n    const errors=validateDetails(next.reservationDraft);\n    if(Object.keys(errors).length){ store.set({reservationErrors:errors}); return; }\n    store.set({reservationErrors:{},reservationStep:ReservationStep.SPACE});\n    return;\n  }\n  if(action===\"reserve-next-space\"){\n    if(!canContinueFromSpace(state)){ store.set({reservationErrors:{space:\"required\"}}); return; }\n    store.set({reservationErrors:{},reservationStep:ReservationStep.REVIEW});\n    return;\n  }\n  if(action===\"reserve-next-review\"){ store.set({reservationStep:ReservationStep.DEPOSIT}); return; }\n  if(action===\"reserve-back\"){ store.set({reservationStep:Math.max(ReservationStep.DETAILS,state.reservationStep-1),reservationErrors:{}}); return; }\n  if(action===\"reserve-confirm\"){\n    const request=createReservationRequest(state);\n    store.set({reservationRequests:[request,...state.reservationRequests],reservationStep:ReservationStep.CONFIRMED});\n    return;\n  }\n  if(action===\"concierge-prompt\"){ runConcierge(target.dataset.prompt); return; }\n  if(action===\"concierge-send\"){ const input=qs(\"#concierge-input\"); if(input){const value=input.value;input.value=\"\";runConcierge(value);} return; }\n  if(action===\"concierge-reserve\"){ store.update(current=>applyConciergePlan(current,current.conciergePlan)); return; }\n  if(action===\"concierge-add\"){\n    const ids=(state.conciergePlan?.menuItemIds||[]).filter(id=>MENU_ITEMS.some(item=>item.id===id));\n    store.set({selectedMenuIds:[...new Set([...state.selectedMenuIds,...ids])],tab:\"menu\"});\n    return;\n  }\n});\n\ndocument.addEventListener(\"keydown\",event=>{\n  if(event.key===\"Enter\" && event.target?.id===\"concierge-input\"){\n    event.preventDefault();\n    const value=event.target.value; event.target.value=\"\"; runConcierge(value);\n  }\n});\n\nstore.subscribe(render);\nconst missing=validateLocales();\nif(missing.length) console.warn(\"Missing locale keys\",missing);\nrender();","src/brand.js":"export const BRAND = Object.freeze({\n  name: \"LUME\",\n  fullName: \"LUME Sky Dining & Bar\",\n  city: \"Nha Trang\",\n  canonicalUrl: \"https://lume.viiversion.com/\",\n  mark: \"✦\",\n  heroImage: \"https://images2.thanhnien.vn/528068263637045248/2026/5/15/lume-gardentwilight1-17788331464582114233393.jpg\",\n  conciergeImage: \"https://images2.thanhnien.vn/528068263637045248/2026/5/15/lume-gardengolden-hour2-1778833146454533308569.jpg\",\n  dinnerHours: \"17:00–22:00\"\n});\n","src/data/catalog.js":"export const SPACES = Object.freeze([\n  {id:\"dining\",image:\"https://images.unsplash.com/photo-1414235077428-338989a2e8c0?auto=format&fit=crop&w=1200&q=86\",title:{en:\"Sky Dining\",ru:\"Sky Dining\",vi:\"Sky Dining\"},text:{en:\"Refined rooftop dining with a composed evening mood.\",ru:\"Изысканный ужин на высоте в более камерной атмосфере.\",vi:\"Không gian ăn tối tinh tế trên cao với nhịp điệu thanh lịch.\"}},\n  {id:\"garden\",image:\"https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=86\",title:{en:\"Sky Garden\",ru:\"Sky Garden\",vi:\"Sky Garden\"},text:{en:\"Open-air greenery, sunset light and a softer rhythm.\",ru:\"Открытый сад, зелень, закатный свет и более спокойный ритм.\",vi:\"Không gian ngoài trời với cây xanh, ánh hoàng hôn và nhịp điệu thư thái.\"}},\n  {id:\"bar\",image:\"https://images.unsplash.com/photo-1572116469696-31de0f17cc34?auto=format&fit=crop&w=1200&q=86\",title:{en:\"Sky Bar\",ru:\"Sky Bar\",vi:\"Sky Bar\"},text:{en:\"Signature cocktails, music and a more social evening.\",ru:\"Авторские коктейли, музыка и более живой вечер.\",vi:\"Cocktail đặc trưng, âm nhạc và không khí sôi động.\"}},\n  {id:\"rooftop\",image:\"https://images.unsplash.com/photo-1470337458703-46ad1756a187?auto=format&fit=crop&w=1200&q=86\",title:{en:\"Rooftop\",ru:\"Rooftop\",vi:\"Rooftop\"},text:{en:\"The broadest panorama and the strongest sense of height.\",ru:\"Самая широкая панорама и максимальное ощущение в