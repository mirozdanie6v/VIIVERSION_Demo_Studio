name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Check Cloudflare Worker syntax
        run: node --check cloudflare/worker.js

      - name: Check local TTS bridge syntax
        run: python3 -m py_compile scripts/hf_tts.py

      - name: Test
        run: npm test
