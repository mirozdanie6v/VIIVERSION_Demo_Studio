          function renderReserve(){ if(tab!=="reserve") return; $(".step").forEach((s,i)=>s.classList.toggle("on",i<=step)); const pane=$("#reservePane"); if(reserveMode==="event"){ renderEventRequest(); return; }
           if(currentReservation){pane.innerHTML=`<div class="notice"><p class="eyebrow">${t("payment.depositSecured")}</p><h2>${currentReservation.ref}</h2><p class="muted">${t("payment.awaiting")}</p></div>${reservationCard(currentReservation)}<div class="row" style="margin-top:14px"><button class="btn full" onclick="switchTab('guest')">${t("guest.viewGuest")}</button><button class="btn secondary full" onclick="currentReservation=null;step=0;selectedArea=null;renderReserve()">${t("reserve.newRequest")}</button></div>`; return}
           if(step===0){ const exp=DATA.experiences.find(x=>x.id===selectedExp); pane.innerHTML=`${exp?`<div class="notice"><p class="eyebrow">${t("reserve.experienceSelected")}</p><h3>${tr(exp.title)}</h3><p class="muted">${tr(exp.text)}</p><button class="btn ghost small" onclick="selectedExp=null;renderReserve()">${t("reserve.changeExperience")}</button></div>`:""}<div class="panel stack"><p class="eyebrow">${t("reserve.details")}</p><div class="field"><label>${t("reserve.date")}</label><input id="rDate" type="date" value="${window.details?.date||new Date(Date.now()+86400000).toISOString().slice(0,10)}"></div><div class="two"><div class="field"><label>${t("reserve.time")}</label><select id="rTime">${["17:30","18:00","18:30","19:00","20:00"].map(v=>`<option ${window.details?.time===v?"selected":""}>${v}</option>`).join("")}</select></div><div class="field"><label>${t("reserve.guests")}</label><select id="rGuests">${["2","4","6","8","12"].map(v=>`<option ${window.details?.guests===v?"selected":""}>${v}</option>`).join("")}</select></div></div><div class="field"><label>${t("reserve.occasion")}</label><select id="rOcc">${occasionOptions().map(o=>`<option value="${o.en}" ${window.details?.occ===o.en?"selected":""}>${o[lang]||o.en}</option>`).join("")}</select></div><div class="field"><label>${t("reserve.comment")}</label><textarea id="rNote">${window.details?.note||""}</textarea></div></div><div class="panel stack"><p class="eyebrow">${t("reserve.guestDetails")}</p><div class="field"><label>${t("reserve.guestName")}</label><input id="gName" value="${guest.name}" placeholder="${t("reserve.guestName")}"></div><div class="two"><div class="field"><label>${t("reserve.phone")}</label><input id="gPhone" value="${guest.phone}" placeholder="+84"></div><div class="field"><label>${t("reserve.email")}</label><input id="gEmail" value="${guest.email}" placeholder="name@email.com"></div></div><div id="guestErr" class="inline-error"></div><div class="sticky-actions"><button class="btn full" onclick="saveDetails()">${t("common.continue")}</button></div></div>`}
           if(step===1){pane.innerHTML=`<h3>${t("reserve.chooseSeating")}</h3><p class="muted" style="margin-bottom:12px">${t("reserve.seatingHint")}</p>${areaError?`<div class="inline-error">${t("reserve.chooseAreaFirst")}</div>`:""}${DATA.areas.map(a=>`<div class="zone ${selectedArea===a.id?'selected':''}"><img src="${a.img}" alt=""><div class="pad"><div class="head" style="margin:0 0 8px"><div><h3>${tr(a.title)}</h3><p class="muted">${tr(a.text)}</p></div><span class="pill">${selectedArea===a.id?t("common.selected"):""}</span></div><div class="row"><button class="btn secondary full" onclick="openArea('${a.id}')">${t("common.view")}</button><button class="btn full" onclick="selectedArea='${a.id}';areaError=false;renderReserve()">${t("common.select")}</button></div></div></div>`).join("")}<div class="sticky-actions"><div class="row"><button class="btn secondary full" onclick="step=0;renderReserve()">${t("common.back")}</button><button class="btn full" onclick="continueFromSeating()">${t("common.continue")}</button></div></div>`}
           if(step===2){pane.innerHTML=`<div class="panel">${reviewHtml()}<div class="sticky-actions"><div class="row"><button class="btn secondary full" onclick="step=1;renderReserve()">${t("common.back")}</button><button class="btn full" onclick="step=3;renderReserve()">${t("reserve.secure")}</button></div></div></div>`}
           if(step===3){ const label=payMethod==="card"?t("payment.confirmCard"):payMethod==="qr"?t("payment.confirmQr"):payMethod==="wallet"?t("payment.confirmWallet"):t("payment.confirmBank"); pane.innerHTML=`<div class="panel"><p class="eyebrow">${t("payment.paymentTitle")}</p><h2>500,000 VND</h2><p class="muted">${t("payment.paymentHint")}</p><div class="notice method-note">${paymentSummaryHtml()}</div><div class="pay-methods" style="margin-top:14px">${["card","qr","wallet","bank"].map(m=>`<button class="method ${payMethod===m?'active':''}" onclick="payMethod='${m}';renderReserve()"><strong>${t(m)}</strong><span>${methodSub(m)}</span></button>`).join("")}</div>${paymentMethodHtml()}<div class="sticky-actions"><div class="row"><button class="btn secondary full" onclick="step=2;renderReserve()">${t("common.back")}</button><button class="btn full" id="payBtn" onclick="confirmReservation()">${label}</button></div></div></div>`}}
          function occasionOptions(){return [{en:"Romantic dinner",ru:"Романтический ужин",vi:"Bữa tối lãng mạn"},{en:"Birthday",ru:"День рождения",vi:"Sinh nhật"},{en:"Anniversary",ru:"Годовщина",vi:"Kỷ niệm"},{en:"Business",ru:"Деловая встреча",vi:"Công việc"},{en:"Family dinner",ru:"Семейный ужин",vi:"Bữa tối gia đình"}]}
          function saveDetails(){ guest.name=$("#gName").value.trim(); guest.phone=$("#gPhone").value.trim(); guest.email=$("#gEmail").value.trim(); const err=$("#guestErr"); if(!guest.name){err.textContent=t("errors.requiredName"); return} if(!guest.phone){err.textContent=t("errors.requiredPhone"); return} window.details={date:$("#rDate").value,time:$("#rTime").value,guests:$("#rGuests").value,occ:$("#rOcc").value,note:$("#rNote").value}; step=1; renderReserve(); renderGuest();}
          function continueFromSeating(){ if(!selectedArea){areaError=true; renderReserve(); return;} step=2; renderReserve();}
          function prefsHtml(){ return evening.length?evening.map(id=>`<span class="pill">${tr(DATA.items.find(i=>i.id===id).title)}</span>`).join(" "):`<span class="muted">${t("reserve.noPrefs")} ${t("menu.notPreorder")}</span>`}
          function reviewHtml(){ const a=DATA.areas.find(x=>x.id===selectedArea); const exp=DATA.experiences.find(x=>x.id===selectedExp); return `<p class="eyebrow">${t("reserve.reviewTitle")}</p><h2>${exp?tr(exp.title):t("reserve.reserveTitle")}</h2><div class="stack" style="margin-top:12px"><div class="edit-row"><div><b>${t("reserve.date")} / ${t("reserve.time")}</b><p class="muted">${window.details?.date||""} · ${window.details?.time||""} · ${window.details?.guests||""} ${t("reserve.guests").toLowerCase()}</p></div><button class="btn ghost small" onclick="step=0;renderReserve()">${t("reserve.editDetails")}</button></div><div class="edit-row"><div><b>${t("reserve.seating")}</b><p class="muted">${a?tr(a.title):""}</p></div><button class="btn ghost small" onclick="step=1;renderReserve()">${t("reserve.editSeating")}</button></div><div class="edit-row"><div><b>${t("reserve.guestDetails")}</b><p class="muted">${guest.name} · ${guest.phone}${guest.email?` · ${guest.email}`:""}</p></div><button class="btn ghost small" onclick="step=0;renderReserve()">${t("common.change")}</button></div><div><p class="eyebrow">${t("reserve.prefs")}</p><div class="row" style="flex-wrap:wrap">${prefsHtml()}</div><button class="btn ghost small" style="margin-top:10px" onclick="switchTab('menu');openEveningSheet()">${t("reserve.editMenu")}</button></div></div>`}
          function methodSub(m){return m==="card"?"Visa · Mastercard":m==="qr"?"VNPay · Bank QR":m==="wallet"?"Apple Pay · Google Pay":"Transfer details"}
          function paymentSummaryHtml(){ const a=DATA.areas.find(x=>x.id===selectedArea); return `<p class="eyebrow">${t("payment.paymentSummary")}</p><p><b>${t("payment.depositFor")}</b></p><p class="muted">${a?tr(a.title):""} · ${window.details?.date||""} · ${window.details?.time||""} · ${window.details?.guests||""} ${t("reserve.guests").toLowerCase()}</p>`}
          function paymentMethodHtml(){ if(payMethod==="card") return `<p class="muted method-note">${t("payment.cardHint")}</p><div class="card-fields"><div class="field"><label>${t("payment.cardName")}</label><input value="${guest.name||"ALEX NGUYEN"}"></div><div class="field"><label>${t("payment.cardNo")}</label><input value="4242 4242 4242 4242"></div><div class="two"><div class="field"><label>${t("payment.expiry")}</label><input value="12 / 29"></div><div class="field"><label>${t("payment.cvc")}</label><input value="123"></div></div></div>`; if(payMethod==="qr") return `<div class="notice method-note"><div class="qrbox"></div><p class="muted">${t("payment.qrHint")}</p></div>`; if(payMethod==="wallet") return `<div class="notice method-note"><p class="muted">${t("payment.walletHint")}</p></div>`; return `<div class="notice method-note"><p class="muted">${t("payment.bankHint")}</p></div>`}
          function confirmReservation(){ const btn=$("#payBtn"); if(btn){btn.disabled=true;btn.textContent=t("common.processing")+"…"} setTimeout(()=>{const res={ref:"LUME-"+Math.floor(10000+Math.random()*89999),created:new Date().toLocaleString(),area:selectedArea,prefs:[...evening],details:{...window.details},guest:{...guest},experience:selectedExp,method:payMethod,status:t("payment.depositSecured")}; reservations.unshift(res); currentReservation=res; step=4; renderReserve(); renderGuest();},600)}
          function reservationCard(res=currentReservation){ if(!res) return ""; const a=DATA.areas.find(x=>x.id===res.area); const prefs=res.prefs.length?res.prefs.map(id=>`<span class="pill">${tr(DATA.items.find(i=>i.id===id).title)}</span>`).join(" "):`<span class="muted">${t("reserve.noPrefs")}</span>`; return `<div class="booking-card" style="margin-top:12px;align-items:flex-start"><div class="grow"><h3>${a?tr(a.title):""}</h3><p class="muted">${res.details.date} · ${res.details.time} · ${res.details.guests} ${t("reserve.guests").toLowerCase()}</p><p class="ok" style="margin-top:7px">500,000 VND · ${t("payment.depositSecured")} · ${t("payment.awaiting")}</p><p class="micro">${res.ref}</p><div style="margin-top:10px"><p class="eyebrow">${t("reserve.prefs")}</p><div class="row" style="flex-wrap:wrap">${prefs}</div></div></div></div>`}
          
          function renderGuest(){ const box=$("#guestPane"); if(!box) return; const upcoming=reservations.length?reservationCard(reservations[0]):`<div class="empty">${t("reserve.noReservations")}<br><br><button class="btn small" onclick="switchTab('reserve')">${t("home.reserveTable")}</button></div>`; const history=reservations.slice(1).length?reservations.slice(1).map(r=>reservationCard(r)).join(""):`<div class="empty">${t("guest.noHistory")}</div>`; const events=eventRequests.length?eventRequests.map(e=>`<div class="booking-card" style="margin-top:10px"><div><h3>${t("events.eventTitle")}</h3><p class="muted">${e.date} · ${e.guests} ${t("reserve.guests").toLowerCase()} · ${e.occasion}</p><p class="micro">${e.contact}</p></div></div>`).join(""):""; const prefText=evening.length?evening.map(id=>tr(DATA.items.find(i=>i.id===id).title)).join(" · "):t("guest.emptyPrefs"); box.innerHTML=`<div class="panel profile-card"><div class="row"><div class="avatar">L</div><div><h3>${guest.name|| t("guest.fallbackName")}</h3><p class="muted">${guest.phone|| t("guest.fallbackContact")}</p></div></div><div class="two"><div class="field"><label>${t("reserve.phone")}</label><input value="${guest.phone}" oninput="guest.phone=this.value"></div><div class="field"><label>${t("reserve.email")}</label><input value="${guest.email}" oninput="guest.email=this.value"></div></div><div class="field"><label>${t("reserve.guestName")}</label><input value="${guest.name}" oninput="guest.name=this.value"></div><button class="btn small" onclick="renderGuest()">${t("common.save")}</button></div><div class="panel"><p class="eyebrow">${t("reserve.upcoming")}</p>${upcoming}</div><div class="panel"><p class="eyebrow">${t("guest.history")}</p>${history}</div>${events?`<div class="panel"><p class="eyebrow">${t("events.eventTitle")}</p>${events}</div>`:""}<div class="panel"><p class="eyebrow">${t("reserve.savedPrefs")}</p><p class="muted">${prefText}</p></div><div class="panel"><p class="eyebrow">${t("reserve.privacy")}</p><p class="muted">${t("guest.privacyCopy")}</p></div>`}
          
          function startEventRequest(expId){ selectedExp=expId||"private"; reserveMode="event"; closeSheet(); switchTab("reserve"); renderEventRequest();}
          function eventOccasionOptions(){return [
            {value:"birthday",label:"events.occasions.birthday"},
            {value:"corporate",label:"events.occasions.corporate"},
            {value:"privateDinner",label:"events.occasions.privateDinner"},
            {value:"celebration",label:"events.occasions.celebration"}
          ]}
          function renderEventRequest(){ const pane=$("#reservePane"); pane.innerHTML=`<div class="panel stack"><p class="eyebrow">${t("events.eventTitle")}</p><h2>${t("events.requestProposal")}</h2><p class="muted">${t("events.eventHint")}</p><div class="field"><label>${t("reserve.date")}</label><input id="eDate" type="date" value="${new Date(Date.now()+86400000*7).toISOString().slice(0,10)}"></div><div class="two"><div class="field"><label>${t("reserve.guests")}</label><select id="eGuests"><option>8</option><option>12</option><option>20</option><option>30</option><option>50</option></select></div><div class="field"><label>${t("reserve.occasion")}</label><select id="eOcc">${eventOccasionOptions().map(o=>`<option value="${o.value}">${t(o.label)}</option>`).join("")}</select></div></div><div class="field"><label>${t("events.budget")}</label><input id="eBudget" placeholder="10,000,000 VND"></div><div class="field"><label>${t("events.contact")}</label><input id="eContact" value="${guest.phone||guest.email}" placeholder="+84 / email"></div><div class="field"><label>${t("reserve.comment")}</label><textarea id="eNote"></textarea></div><div class="sticky-actions"><div class="row"><button class="btn secondary full" onclick="reserveMode='table';renderReserve()">${t("common.back")}</button><button class="btn full" onclick="submitEventRequest()">${t("events.requestProposal")}</button></div></div></div>`}
          function submitEventRequest(){ const req={date:$("#eDate").value,guests:$("#eGuests").value,occasion:$("#eOcc").value,budget:$("#eBudget").value,contact:$("#eContact").value,note:$("#eNote").value}; eventRequests.unshift(req); $("#reservePane").innerHTML=`<div class="notice"><p class="eyebrow">${t("events.eventSent")}</p><h2>${t("events.requestProposal")}</h2><p class="muted">${t("events.eventCopy")}</p></div><div class="row" style="margin-top:14px"><button class="btn full" onclick="switchTab('guest')">${t("guest.viewGuest")}</button><button class="btn secondary full" onclick="reserveMode='table';renderReserve()">${t("home.reserveTable")}</button></div>`; renderGuest();}
          
          function renderPrompts(){
            const p=[
              t("concierge.prompts.romantic"),
              t("concierge.prompts.cocktails"),
              t("concierge.prompts.family"),
              t("concierge.prompts.birthday"),
              t("concierge.prompts.wine"),
              t("concierge.prompts.budget")
            ];
            $("#prompts").innerHTML=p.map(x=>`<button class="chip" onclick="ask('${x.replace(/'/g,"")}')">${x}</button>`).join("");
          }
          function conciergeAnswerKey(q){
            const lower=q.toLowerCase();
            if(lower.includes("birthday") || lower.includes("12") || lower.includes("день") || lower.includes("sinh nhật")) return "concierge.answers.birthday";
            if(lower.includes("wine") || lower.includes("seafood") || lower.includes("вино") || lower.includes("морепр") || lower.includes("rượu") || lower.includes("hải sản")) return "concierge.answers.wine";
            if(lower.includes("budget") || lower.includes("2,000,000") || lower.includes("бюджет") || lower.includes("dưới")) return "concierge.answers.budget";
            return "concierge.answers.default";
          }
          function ask(q){
            addMsg(q,"me");
            setTimeout(()=>{
              const picks=evening.map(id=>tr(DATA.items.find(i=>i.id===id).title));
              let txt=t(conciergeAnswerKey(q));
              if(picks.length) txt += " " + t("concierge.answers.preferencesPrefix") + picks.join(", ") + ".";
              addMsg(txt+`<div class="row" style="margin-top:10px"><button class="btn small" onclick="switchTab('reserve')">${t("concierge.reservePlan")}</button><button class="btn secondary small" onclick="switchTab('menu')">${t("menu.exploreMatching")}</button></div>`,"ai");
            },250)
          }
          
          function addMsg(text,type){ $("#chat").insertAdjacentHTML("beforeend",`<div class="msg ${type}">${text}</div>`); $("#chat").scrollIntoView(false)}
          $("#sendChat").onclick=()=>{ const v=$("#chatInput").value.trim(); if(v){$("#chatInput").value=""; ask(v)}};
          document.addEventListener("click",e=>{ const b=e.target.closest("[data-act='tab']"); if(b) switchTab(b.dataset.tab);});
          function renderAll(){renderLangs();renderText();renderExperiences();renderMenu();renderEvening();renderEveningBar();renderPrompts();renderReserve();renderGuest();}
          validateI18n();
          renderAll();
          </script>
          </body>
          </html>
          LUME_EOF
          grep -Fq '<title>LUME</title>' site/index.html
          echo "LUME source materialized."

      - name: Ensure Pages project exists
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          code=$(curl -sS -o /tmp/pages-project.json -w '%{http_code}' "${api}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' || true)
          if [ "${code}" = "200" ] && jq -e '.success == true' /tmp/pages-project.json >/dev/null 2>&1; then
            echo "Pages project ${PROJECT_NAME} already exists."
          elif [ "${code}" = "404" ]; then
            npx --yes wrangler@4 pages project create "${PROJECT_NAME}" --production-branch main
          else
            cat /tmp/pages-project.json || true
            exit 1
          fi

      - name: Link Pages project to LUME GitHub
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          payload=$(jq -nc '{
            production_branch:"main",
            source:{
              type:"github",
              config:{
                owner:"mirozdanie6v",
                owner_id:"49186663",
                repo_name:"lume-mini-app",
                repo_id:"1407147394",
                production_branch:"main",
                production_deployments_enabled:true,
                preview_deployment_setting:"none",
                pr_comments_enabled:false
              }
            }
          }')
          code=$(curl -sS -o /tmp/link-source.json -w '%{http_code}' -X PATCH "${api}" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "${payload}" || true)
          if [ "${code}" = "200" ] && jq -e '.success == true' /tmp/link-source.json >/dev/null 2>&1; then
            echo "Cloudflare Pages linked directly to mirozdanie6v/lume-mini-app."
          else
            echo "Git source linking was not applied (HTTP ${code}); direct Pages deployment remains active."
            cat /tmp/link-source.json || true
          fi

      - name: Deploy production
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy site             --project-name "${PROJECT_NAME}"             --branch main             --commit-hash "${GITHUB_SHA}"             --commit-message "Deploy LUME mini app"

      - name: Attach custom domain
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          curl -fsS "${api}/domains"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Content-Type: application/json' > /tmp/domains.json
          if jq -e --arg d "${CUSTOM_DOMAIN}" '.result[]? | select(.name == $d)' /tmp/domains.json >/dev/null; then
            echo "Custom domain already attached."
          else
            curl -fsS -X POST "${api}/domains"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"               -H 'Content-Type: application/json'               --data "$(jq -nc --arg name "${CUSTOM_DOMAIN}" '{name:$name}')"               > /tmp/domain-create.json
            jq -e '.success == true' /tmp/domain-create.json >/dev/null
            echo "Custom domain attachment requested."
          fi

      - name: Verify Pages production
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          curl -fsS "${api}"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"             -H 'Content-Type: application/json' > /tmp/project.json
          subdomain=$(jq -r '.result.subdomain' /tmp/project.json)
          test -n "${subdomain}"
          test "${subdomain}" != "null"
          echo "Pages URL: https://${subdomain}"
          ready=0
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/lume-live.html -w '%{http_code}' "https://${subdomain}/" || true)
            if [ "${code}" = "200" ] && grep -Fq '<title>LUME</title>' /tmp/lume-live.html; then
              ready=1
              break
            fi
            echo "Waiting for Pages deployment (attempt ${attempt}, HTTP ${code})"
            sleep 5
          done
          test "${ready}" -eq 1
          echo "LUME production verified at https://${subdomain}"

      - name: Verify custom domain
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/lume-domain.html -w '%{http_code}' "https://${CUSTOM_DOMAIN}/" || true)
            if [ "${code}" = "200" ] && grep -Fq '<title>LUME</title>' /tmp/lume-domain.html && grep -Fq 'https://lume.viiversion.com/' /tmp/lume-domain.html; then
              ready=1
              break
            fi
            echo "Waiting for custom domain (attempt ${attempt}, HTTP ${code})"
            sleep 5
          done
          test "${ready}" -eq 1
          echo "Custom domain live and canonical: https://${CUSTOM_DOMAIN}"
