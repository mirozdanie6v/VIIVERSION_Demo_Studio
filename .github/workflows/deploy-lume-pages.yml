            walk("", I18N[DEFAULT_LANG]);
            SUPPORTED_LANGS.forEach(l=>{
              paths.forEach(p=>{
                if(getPath(I18N[l], p) === undefined) I18N_MISSING.add(`${l}:${p}`);
