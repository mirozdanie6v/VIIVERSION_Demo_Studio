                <div class="stepper"><span class="step"></span><span class="step"></span><span class="step"></span><span class="step"></span></div>
                <div id="reservePane"></div>
              </section>
            </main>
          
            <div class="evening-bar" id="eveningBar">
              <div><strong data-k="menu.myEvening"></strong><div class="micro" id="barText"></div></div>
              <button class="btn small" onclick="openEveningSheet()" data-k="menu.openList"></button>
            </div>
          
            <nav class="bottom">
              <button class="nav active" data-act="tab" data-tab="home"><b>⌂</b><span data-k="nav.home"></span></button>
              <button class="nav" data-act="tab" data-tab="menu"><b>≋</b><span data-k="nav.menu"></span></button>
              <button class="nav" data-act="tab" data-tab="guest"><b>◌</b><span data-k="nav.guest"></span></button>
              <button class="nav" data-act="tab" data-tab="reserve"><b>⌁</b><span data-k="nav.reserve"></span></button>
              <button class="nav" data-act="tab" data-tab="concierge"><b>✦</b><span data-k="nav.ask"></span></button>
            </nav>
          
            <div class="sheet" id="sheet" aria-hidden="true"></div>
          </div>
          
