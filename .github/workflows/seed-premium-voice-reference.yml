name: Seed Premium Voice Reference

on:
  push:
    branches:
      - vii-125-production-plugin-release
    paths:
      - '.github/workflows/seed-premium-voice-reference.yml'

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EXPECTED_SHA256: 6106dc2efca1f7cbd6dcc52bf480afec2aeafe1c43a10618a82486d4e5577de4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare credentials
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"

      - name: Download approved MAX TOUR v9 artifact
        uses: actions/download-artifact@v4
        with:
          name: max-tour-premium-russian-v9-final
          path: reference-source
          github-token: ${{ github.token }}
          run-id: 37353860935

      - name: Prepare canonical Niki reference
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          test -s reference-source/voiceover_ru.wav
          ffmpeg -y -hide_banner -loglevel error \
            -i reference-source/voiceover_ru.wav \
            -t 8.8 \
            -af "highpass=f=70,lowpass=f=11500,loudnorm=I=-17:TP=-2:LRA=8" \
            -ar 24000 -ac 1 niki-reference.wav
          actual=$(sha256sum niki-reference.wav | awk '{print $1}')
          test "${actual}" = "${EXPECTED_SHA256}"

      - name: Upload canonical reference to private R2
        run: |
          set -euo pipefail
          npx wrangler@4 r2 object put \
            viiversion-demo-studio-artifacts/voice-references/niki-reference.wav \
            --file=niki-reference.wav \
            --content-type=audio/wav \
            --remote

      - name: Verify private R2 copy
        run: |
          set -euo pipefail
          npx wrangler@4 r2 object get \
            viiversion-demo-studio-artifacts/voice-references/niki-reference.wav \
            --file=/tmp/niki-reference.wav \
            --remote
          actual=$(sha256sum /tmp/niki-reference.wav | awk '{print $1}')
          test "${actual}" = "${EXPECTED_SHA256}"
          echo "NIKI_REFERENCE_SHA256=${actual}"
