            {value:"celebration",label:"events.occasions.celebration"}
          ]}
          function renderEventRequest(){ const pane=$("#reservePane"); pane.innerHTML=`<div class="panel stack"><p class="eyebrow">${t("events.eventTitle")}</p><h2>${t("events.requestProposal")}</h2><p class="muted">${t("events.eventHint")}</p><div class="field"><label>${t("reserve.date")}</label><input id="eDate" type="date" value="${new Date(Date.now()+86400000*7).toISOString().slice(0,10)}"></div><div class="two"><div class="field"><label>${t("reserve.guests")}</label><select id="eGuests"><option>8</option><option>12</option><option>20</option><option>30</option><option>50</option></select></div><div class="field"><label>${t("reserve.occasion")}</label><select id="eOcc">${eventOccasionOptions().map(o=>`<option value="${o.value}">${t(o.label)}</option>`).join("")}</select></div></div><div class="field"><label>${t("events.budget")}</label><input id="eBudget" placeholder="10,000,000 VND"></div><div class="field"><label>${t("events.contact")}</label><input id="eContact" value="${guest.phone||guest.email}" placeholder="+84 / email"></div><div class="field"><label>${t("reserve.comment")}</label><textarea id="eNote"></textarea></div><div class="sticky-actions"><div class="row"><button class="btn secondary full" onclick="reserveMode='table';renderReserve()">${t("common.back")}</button><button class="btn full" onclick="submitEventRequest()">${t("events.requestProposal")}</button></div></div></div>`}
          function submitEventRequest(){ const req={date:$("#eDate").value,guests:$("#eGuests").value,occasion:$("#eOcc").value,budget:$("#eBudget").value,contact:$("#eContact").value,note:$("#eNote").value}; eventRequests.unshift(req); $("#reservePane").innerHTML=`<div class="notice"><p class="eyebrow">${t("events.eventSent")}</p><h2>${t("events.requestProposal")}</h2><p class="muted">${t("events.eventCopy")}</p></div><div class="row" style="margin-top:14px"><button class="btn full" onclick="switchTab('guest')">${t("guest.viewGuest")}</button><button class="btn secondary full" onclick="reserveMode='table';renderReserve()">${t("home.reserveTable")}</button></div>`; renderGuest();}
          
          function renderPrompts(){
            const p=[
              t("concierge.prompts.romantic"),
              t("concierge.prompts.cocktails"),
              t("concierge.prompts.family"),
              t("concierge.prompts.birthday"),
              t("concierge.prompts.wine"),
              t("concierge.prompts.budget")
            ];
            $("#prompts").innerHTML=p.map((x,i)=>'<button class="chip" data-prompt="'+i+'">'+escapeHtml(x)+'</button>').join("");
            $$("#prompts [data-prompt]").forEach((b,i)=>b.onclick=()=>ask(p[i]));
          }
          let chatHistory=[], lastConciergePlan=null, conciergeBusy=false;
          function escapeHtml(value){return String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}
          function conciergeAreaTitle(id){const a=DATA.areas.find(x=>x.id===id);return a?tr(a.title):""}
          function renderConciergePlan(plan){
            if(!plan) return "";
            const area=conciergeAreaTitle(plan.areaId);
            return '<div class="ai-plan">'+
              '<div class="ai-plan-top"><p class="eyebrow">'+escapeHtml(t("concierge.planTitle"))+'</p><h3>'+escapeHtml(plan.title||t("concierge.planTitle"))+'</h3></div>'+
              '<div class="ai-plan-grid">'+
                '<div class="ai-plan-cell"><b>'+escapeHtml(t("concierge.space"))+'</b><span>'+escapeHtml(area||plan.areaId||"—")+'</span></div>'+
                '<div class="ai-plan-cell"><b>'+escapeHtml(t("concierge.timeLabel"))+'</b><span>'+escapeHtml(plan.time||"—")+'</span></div>'+
                '<div class="ai-plan-cell"><b>'+escapeHtml(t("concierge.moodLabel"))+'</b><span>'+escapeHtml(plan.mood||"—")+'</span></div>'+
                '<div class="ai-plan-cell"><b>'+escapeHtml(t("concierge.pairingLabel"))+'</b><span>'+escapeHtml(plan.pairing||"—")+'</span></div>'+
              '</div>'+
              '<div class="ai-plan-top"><b style="font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#e4c37d">'+escapeHtml(t("concierge.whyLabel"))+'</b><p class="muted" style="margin-top:6px">'+escapeHtml(plan.reason||"")+'</p></div>'+
              '<div class="ai-plan-actions"><button class="btn small" onclick="reserveConciergePlan()">'+escapeHtml(t("concierge.reservePlan"))+'</button><button class="btn secondary small" onclick="addConciergeItems()">'+escapeHtml(t("concierge.addSuggested"))+'</button></div>'+
            '</div>';
          }
          function addMsg(text,type,opts={}){
            const node=document.createElement("div");
            node.className="msg "+type;
            if(opts.id) node.id=opts.id;
            if(opts.html) node.innerHTML=text; else node.textContent=text;
            $("#chat").appendChild(node);
            node.scrollIntoView({behavior:"smooth",block:"end"});
          }
          function addThinking(){addMsg('<div class="ai-thinking"><span>'+escapeHtml(t("concierge.thinking"))+'</span><i></i><i></i><i></i></div>',"ai",{html:true,id:"aiThinking"})}
          function removeThinking(){document.querySelector("#aiThinking")?.remove()}
          function conciergeContext(){return {selectedArea,selectedExperience:selectedExp,selectedMenuItemIds:[...evening],details:window.details||null,guest:{name:guest.name||"",preferences:guest.preferences||""}}}
          async function ask(q){
            q=String(q||"").trim();
            if(!q||conciergeBusy) return;
            conciergeBusy=true;
            addMsg(q,"me");
            chatHistory.push({role:"user",content:q});
            chatHistory=chatHistory.slice(-8);
            addThinking();
            try{
              const res=await fetch("/api/concierge",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({message:q,lang,history:chatHistory,context:conciergeContext()})});
              if(!res.ok) throw new Error("HTTP "+res.status);
              const data=await res.json();
              removeThinking();
              lastConciergePlan=data.plan||null;
              addMsg(escapeHtml(data.reply||"")+renderConciergePlan(lastConciergePlan),"ai",{html:true});
              chatHistory.push({role:"assistant",content:data.reply||""});
              chatHistory=chatHistory.slice(-8);
            }catch(err){
              removeThinking();
              addMsg(t("concierge.error"),"ai");
              console.error("Concierge error",err);
            }finally{
              conciergeBusy=false;
            }
          }
          function addConciergeItems(){
            const ids=Array.isArray(lastConciergePlan?.menuItemIds)?lastConciergePlan.menuItemIds:[];
            ids.forEach(id=>{if(DATA.items.some(x=>x.id===id)&&!evening.includes(id)) evening.push(id)});
            renderEvening();renderEveningBar();renderReserve();switchTab("menu");
          }
          function reserveConciergePlan(){
            const p=lastConciergePlan;
            if(!p) return;
            if(DATA.areas.some(x=>x.id===p.areaId)) selectedArea=p.areaId;
            if(DATA.experiences.some(x=>x.id===p.experienceId)) selectedExp=p.experienceId;
            const base=window.details||{};
            window.details={...base,time:p.time||base.time||"19:00",guests:String(p.guests||base.guests||"2"),occ:base.occ||"",note:base.note||""};
            const ids=Array.isArray(p.menuItemIds)?p.menuItemIds:[];
            ids.forEach(id=>{if(DATA.items.some(x=>x.id===id)&&!evening.includes(id)) evening.push(id)});
            step=0;switchTab("reserve");renderReserve();
          }
          $("#sendChat").onclick=()=>{const v=$("#chatInput").value.trim();if(v){$("#chatInput").value="";ask(v)}};
          $("#chatInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#sendChat").click()}});
          document.addEventListener("click",e=>{ const b=e.target.closest("[data-act='tab']"); if(b) switchTab(b.dataset.tab);});
          function renderAll(){renderLangs();renderText();renderExperiences();renderMenu();renderEvening();renderEveningBar();renderPrompts();renderReserve();renderGuest();}
          validateI18n();
          renderAll();
          </script>
          </body>
          </html>
          LUME_HTML
          cat > worker.js <<'LUME_WORKER'
          const MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast";
          
          const VENUE = {
            name: "LUME Sky Dining & Bar",
            city: "Nha Trang",
            address: "29 Phan Chu Trinh, Nha Trang, Khanh Hoa, Vietnam",
            hours: { breakfast: "08:00–10:30", lunch: "11:00–14:30", dinner: "17:00–22:00" },
            spaces: {
              dining: "Sky Dining — refined rooftop dining, strongest fit for a composed dinner and wine pairing.",
              garden: "Sky Garden — open-air greenery, sunset light, softer rhythm for families and relaxed groups.",
              bar: "Sky Bar — signature cocktails, music, city lights and a more social evening.",
              rooftop: "Rooftop — the widest panorama across city, mountains, river and sea."
            },
            specialSpaces: [
              "Private Dining — for important meetings, birthdays and intimate celebrations.",
              "Wine Cellar — a private wine-focused setting."
            ]
          };
          
          const MENU = [
            {id:"lobster",category:"Signature",title:"Nha Trang lobster",price:"1,450,000 VND",note:"grilled local lobster with citrus butter; pairs with Sauvignon Blanc"},
            {id:"beef",category:"Signature",title:"Wagyu striploin",price:"890,000 VND",note:"charcoal grilled with truffle jus"},
            {id:"tuna",category:"Signature",title:"Tuna tartare",price:"420,000 VND",note:"fresh tuna, avocado and ponzu"},
            {id:"duck",category:"Signature",title:"Five-spice duck",price:"690,000 VND",note:"crisp skin, plum glaze and greens; pairs with medium red wine"},
            {id:"sunset",category:"Sky Bar",title:"Sunset Negroni",price:"260,000 VND",note:"bitter orange, vermouth and rooftop mood"},
            {id:"spritz",category:"Sky Bar",title:"LUME Spritz",price:"240,000 VND",note:"light aperitif, sparkling wine and soda"},
            {id:"martini",category:"Sky Bar",title:"Lychee Martini",price:"280,000 VND",note:"floral vodka, lychee and citrus"},
            {id:"sauv",category:"Wine",title:"Sauvignon Blanc",price:"320,000 VND / glass",note:"crisp white wine for seafood"},
            {id:"pinot",category:"Wine",title:"Pinot Noir",price:"390,000 VND / glass",note:"elegant red for duck"},
            {id:"champagne",category:"Wine",title:"Champagne",price:"2,200,000 VND / bottle",note:"for celebrations and first toast"},
            {id:"family",category:"Set",title:"Family sharing set",price:"1,950,000 VND",note:"shared plates for four to six guests"},
            {id:"celebration",category:"Set",title:"Celebration menu",price:"from 4,500,000 VND",note:"custom courses, wine and dessert"}
          ];
          
          const EXPERIENCE_IDS = new Set(["romantic","sunset","family","private"]);
          const AREA_IDS = new Set(["dining","garden","bar","rooftop"]);
          const MENU_IDS = new Set(MENU.map(function(x){return x.id;}));
          
          function json(data,status){
            return new Response(JSON.stringify(data),{
              status:status||200,
              headers:{
                "content-type":"application/json; charset=utf-8",
                "cache-control":"no-store",
                "x-content-type-options":"nosniff"
              }
            });
          }
          
          function cleanText(value,max){
            return String(value==null?"":value).replace(/\0/g,"").trim().slice(0,max||1200);
          }
          
          function safeHistory(value){
            if(!Array.isArray(value)) return [];
            return value.slice(-8).map(function(x){
              return { role:x&&x.role==="assistant"?"assistant":"user", content:cleanText(x&&x.content,800) };
            }).filter(function(x){return Boolean(x.content);});
          }
          
          function extractJson(value){
            const raw=typeof value==="string"?value:JSON.stringify(value==null?{}:value);
            const first=raw.indexOf("{");
            const last=raw.lastIndexOf("}");
            if(first<0||last<first) throw new Error("Model did not return JSON");
            return JSON.parse(raw.slice(first,last+1));
          }
          
          function normalizePlan(plan){
            if(!plan||typeof plan!=="object") return null;
            const areaId=AREA_IDS.has(plan.areaId)?plan.areaId:null;
            const experienceId=EXPERIENCE_IDS.has(plan.experienceId)?plan.experienceId:null;
            const menuItemIds=Array.isArray(plan.menuItemIds)?plan.menuItemIds.filter(function(id){return MENU_IDS.has(id);}).slice(0,5):[];
            const guests=Number.isFinite(Number(plan.guests))?Math.min(50,Math.max(1,Number(plan.guests))):null;
            const time=/^(1[7-9]|20):[0-5]\d$/.test(String(plan.time||""))?String(plan.time):null;
            if(!areaId&&!experienceId&&!menuItemIds.length&&!plan.title) return null;
            return {
              title:cleanText(plan.title,100),
              areaId:areaId,
              experienceId:experienceId,
              time:time,
              guests:guests,
              mood:cleanText(plan.mood,140),
              pairing:cleanText(plan.pairing,180),
              reason:cleanText(plan.reason,280),
              menuItemIds:menuItemIds
            };
          }
          
          function buildPrompt(input){
            const language=input.lang==="ru"?"Russian":input.lang==="vi"?"Vietnamese":"English";
            const menu=MENU.map(function(x){return x.id+": "+x.title+" — "+x.price+"; "+x.note;}).join("\n");
            const spaces=Object.entries(VENUE.spaces).map(function(pair){return pair[0]+": "+pair[1];}).join("\n");
            const prior=input.history.map(function(x){return x.role.toUpperCase()+": "+x.content;}).join("\n");
            return [
              "You are LUME Concierge, a premium restaurant concierge for "+VENUE.name+" in "+VENUE.city+".",
              "Reply in "+language+". Be concise, elegant, useful and concrete.",
              "",
              "AUTHORITATIVE VENUE FACTS",
              "Address: "+VENUE.address,
              "Hours: breakfast "+VENUE.hours.breakfast+"; lunch "+VENUE.hours.lunch+"; dinner "+VENUE.hours.dinner+".",
              "Spaces:",
              spaces,
              "Special spaces:",
              "- "+VENUE.specialSpaces.join("\n- "),
              "",
              "DEMO MENU — use only these item IDs and titles when making menu recommendations:",
              menu,
              "",
              "SAFETY / TRUTH RULES",
              "- Never claim live table availability, confirmed booking, confirmed payment or real-time inventory. The demo currently creates a reservation request only.",
              "- If the guest asks about availability, say live availability is not connected yet and offer a recommended request plan.",
              "- Never invent menu items, prices, spaces, opening hours or policies.",
              "- Recommendations may combine space, time, mood and the demo menu.",
              "- Respect any budget, dietary preference, party size, occasion and current selected menu items in context.",
              "- If the request is broad, still be helpful and propose one best-fit plan.",
              "- Return ONLY valid JSON, with no markdown.",
              "",
              "JSON SCHEMA",
              '{"reply":"natural concierge response","plan":{"title":"short plan title","areaId":"dining|garden|bar|rooftop","experienceId":"romantic|sunset|family|private|null","time":"HH:MM between 17:00 and 20:59 or null","guests":"number_or_null","mood":"short mood","pairing":"short pairing recommendation","reason":"short reason this plan fits","menuItemIds":["zero or more valid menu IDs"]}}',
              "",
              "CURRENT APP CONTEXT",
              JSON.stringify(input.context||{}),
              "",
              "RECENT CONVERSATION",
              prior||"(none)",
              "",
              "CURRENT USER MESSAGE",
              input.message
            ].join("\n");
          }
          
          async function concierge(request,env){
            let body;
            try{ body=await request.json(); }catch(e){ return json({error:"invalid_json"},400); }
            const message=cleanText(body&&body.message,1200);
            if(!message) return json({error:"message_required"},400);
            if(!env.AI) return json({error:"ai_binding_unavailable"},503);
            const history=safeHistory(body&&body.history);
            const context=body&&body.context&&typeof body.context==="object"?body.context:{};
            const prompt=buildPrompt({message:message,lang:body&&body.lang,history:history,context:context});
            try{
              const result=await env.AI.run(MODEL,{
                messages:[
                  {role:"system",content:"You are LUME Concierge. Follow the user instruction exactly."},
                  {role:"user",content:prompt}
                ],
                response_format:{
                  type:"json_schema",
                  json_schema:{
                    type:"object",
                    properties:{
                      reply:{type:"string"},
                      plan:{
                        type:"object",
                        properties:{
                          title:{type:"string"},
                          areaId:{type:"string",enum:["dining","garden","bar","rooftop"]},
                          experienceId:{type:"string",enum:["romantic","sunset","family","private"]},
                          time:{type:"string"},
                          guests:{type:"number"},
                          mood:{type:"string"},
                          pairing:{type:"string"},
                          reason:{type:"string"},
                          menuItemIds:{
                            type:"array",
                            items:{type:"string",enum:Array.from(MENU_IDS)}
                          }
                        },
                        required:["title","areaId","experienceId","time","guests","mood","pairing","reason","menuItemIds"]
                      }
                    },
                    required:["reply","plan"]
                  }
                },
                max_tokens:700,
                temperature:0.3
              });
              const raw=result&&result.response!=null
                ? result.response
                : result&&Array.isArray(result.choices)&&result.choices[0]&&result.choices[0].message
                  ? result.choices[0].message.content
                  : result;
              const parsed=raw&&typeof raw==="object"&&!Array.isArray(raw)?raw:extractJson(raw);
              const reply=cleanText(parsed&&parsed.reply,900);
              if(!reply) throw new Error("Empty reply");
              return json({reply:reply,plan:normalizePlan(parsed&&parsed.plan),source:"workers-ai",model:MODEL});
            }catch(error){
              console.error("LUME concierge inference failed",error);
              return json({error:"concierge_inference_failed",detail:cleanText(error&&error.message,500)},502);
            }
          }
          
          export default {
            async fetch(request,env){
              const url=new URL(request.url);
              if(url.pathname==="/api/health") return json({ok:true,service:"lume-mini-app",aiBinding:Boolean(env.AI),model:MODEL});
              if(url.pathname==="/api/concierge"){
                if(request.method!=="POST") return json({error:"method_not_allowed"},405);
                return concierge(request,env);
              }
              return env.ASSETS.fetch(request);
            }
          };
          
          LUME_WORKER
          cat > wrangler-lume.jsonc <<'LUME_WRANGLER'
