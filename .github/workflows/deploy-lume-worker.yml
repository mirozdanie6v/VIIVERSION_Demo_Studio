          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/lume-health.json -w '%{http_code}' "https://${TARGET_DOMAIN}/api/health" || true)
            if [ "${code}" = "200" ] && jq -e '.ok == true and .service == "lume-mini-app" and .aiBinding == true' /tmp/lume-health.json >/dev/null 2>&1; then
              ready=1
              break
            fi
            echo "Waiting for LUME Worker (attempt ${attempt}, HTTP ${code})"
