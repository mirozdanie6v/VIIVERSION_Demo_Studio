name: Deploy LUME Worker Domain

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-lume-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lume-production-worker
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_DOMAIN: lume.viiversion.com

    steps:
      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            curl -fsS "https://api.cloudflare.com/client/v4/zones?name=viiversion.com&per_page=5" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/zones.json
            id=$(jq -r '[.result[]? | select(.name=="viiversion.com")][0].account.id // empty' /tmp/zones.json)
            test -n "${id}"
            echo "CLOUDFLARE_ACCOUNT_ID=${id}" >> "${GITHUB_ENV}"
          fi

      - name: Materialize LUME source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          cat > site/index.html <<'LUME_HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8"/>
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
          <title>LUME</title>
          <link rel="canonical" href="https://lume.viiversion.com/">
          <style>
          :root{
            --bg:#070604; --text:#fff8ed; --muted:rgba(255,248,237,.68);
            --line:rgba(255,255,255,.13); --panel:rgba(17,14,10,.74); --panel2:rgba(255,255,255,.075);
            --gold:#e8c47a; --gold2:#a87336; --green:#9bd3b0; --danger:#ff9a86;
            --r:24px; --shadow:0 28px 80px rgba(0,0,0,.48);
          }
          *{box-sizing:border-box} html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
          body{overflow:hidden} button,input,select,textarea{font:inherit} button{border:0;cursor:pointer;color:inherit} 
          .app{width:min(430px,100vw);height:100dvh;margin:0 auto;position:relative;overflow:hidden;background:
          radial-gradient(circle at 10% -10%,rgba(232,196,122,.22),transparent 36%),
          radial-gradient(circle at 90% 5%,rgba(150,82,35,.20),transparent 36%),var(--bg);}
          .top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;position:absolute;z-index:40;width:100%;pointer-events:none}
          .logo{letter-spacing:.42em;font-size:14px;font-weight:700;text-shadow:0 1px 18px rgba(0,0,0,.7)}
          .langs{display:flex;gap:5px;pointer-events:auto;background:rgba(0,0,0,.28);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:4px}
          .langs button{height:28px;padding:0 8px;border-radius:999px;background:transparent;color:var(--muted);font-size:11px}
          .langs button.active{background:rgba(232,196,122,.20);color:var(--text)}
          .view{position:absolute;inset:0;padding:64px 14px calc(118px + env(safe-area-inset-bottom));overflow:auto;display:none;scroll-behavior:smooth}
          .view.active{display:block}.view::-webkit-scrollbar{display:none}
          .hero{min-height:470px;border-radius:0 0 34px 34px;margin:-64px -14px 18px;position:relative;overflow:hidden;background-image:
          linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,.12) 34%,rgba(7,6,4,.22) 56%,#070604 100%),
          url("https://images.unsplash.com/photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=1200&q=82");background-size:cover;background-position:center;}
          .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 18%,transparent 0 24%,rgba(0,0,0,.48) 75%)}
          .hero-copy{position:absolute;left:18px;right:18px;bottom:34px;z-index:2;text-shadow:0 2px 26px rgba(0,0,0,.85)}
          .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 10px}
          h1{font-family:Georgia,serif;font-size:48px;line-height:.86;margin:0 0 12px;letter-spacing:-.04em}
          h2{font-family:Georgia,serif;font-size:31px;line-height:1.02;margin:0 0 8px;letter-spacing:-.03em}
          h3{font-size:18px;margin:0 0 5px} p{margin:0}.lead{font-size:17px;line-height:1.42;color:rgba(255,248,237,.88);max-width:330px}
          .row{display:flex;gap:10px;align-items:center}.stack{display:grid;gap:12px}.section{margin:20px 0}.head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px}.muted{color:var(--muted);font-size:13px;line-height:1.42}.micro{font-size:11px;color:var(--muted);line-height:1.35}.price{color:var(--gold);font-weight:700}
          .btn{min-height:48px;border-radius:999px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,var(--gold),#8e602f);color:#140e08;font-weight:800;box-shadow:0 12px 34px rgba(232,196,122,.18)}
          .btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--line);box-shadow:none}
          .btn.ghost{background:transparent;color:var(--gold);border:1px solid rgba(232,196,122,.35);box-shadow:none}
          .btn.full{width:100%}.btn.small{min-height:38px;font-size:12px;padding:0 13px}.btn:disabled{opacity:.45;cursor:not-allowed}
          .quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.quick .btn{font-size:13px}
          .exp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.exp-card{min-height:172px;border-radius:25px;overflow:hidden;position:relative;border:1px solid var(--line);background:#12100c;box-shadow:var(--shadow)}
          .exp-card img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;filter:saturate(1.02) contrast(1.02)}
          .exp-card .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.36) 44%,rgba(0,0,0,.86) 100%)}
          .exp-card .txt{position:absolute;left:12px;right:12px;bottom:12px;z-index:1}
          .exp-card h3{font-size:17px;text-shadow:0 2px 18px rgba(0,0,0,.95)}.exp-card p{font-size:11px;color:rgba(255,248,237,.82);line-height:1.28;text-shadow:0 2px 15px rgba(0,0,0,.9)}
          .chips{display:flex;gap:8px;overflow:auto;padding:2px 0 11px}.chips::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:9px 13px;color:var(--muted);font-size:12px}.chip.active{color:#120d08;background:var(--gold);font-weight:800}
          .menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid var(--line);background:rgba(255,255,255,.055);border-radius:24px;overflow:hidden;text-align:left;min-height:238px}
          .item img{width:100%;height:122px;object-fit:cover;display:block}.item .pad{padding:12px}.item h3{font-size:15px;line-height:1.08}.item .muted{font-size:11.5px;margin:5px 0 10px}
          .panel{background:var(--panel);backdrop-filter:blur(18px);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
          .field{display:grid;gap:6px}.field label{font-size:11px;color:var(--gold);letter-spacing:.12em;text-transform:uppercase;font-weight:800}.field input,.field select,.field textarea{width:100%;min-height:48px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);border-radius:16px;padding:0 13px;outline:none}.field textarea{padding:12px;min-height:86px;resize:none} option{background:#17130e}
          .bottom{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));padding:7px;background:rgba(10,8,6,.74);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(18px);z-index:60;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
          .nav{height:54px;border-radius:19px;background:transparent;color:var(--muted);font-size:10px;display:grid;place-items:center;gap:1px}.nav b{font-size:18px;line-height:1}.nav.active{background:rgba(232,196,122,.17);color:var(--text)}
          .evening-bar{position:absolute;left:14px;right:14px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:59;border:1px solid rgba(232,196,122,.35);background:rgba(20,15,10,.86);backdrop-filter:blur(16px);border-radius:22px;padding:11px 12px;display:none;align-items:center;justify-content:space-between;gap:10px;box-shadow:var(--shadow)}
          .evening-bar.show{display:flex}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);border-radius:999px;padding:7px 10px;font-size:12px;color:var(--muted)}
          .evening-item,.booking-card{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:18px}.evening-item img{width:50px;height:50px;object-fit:cover;border-radius:15px}.grow{flex:1}
          .stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 14px}.step{height:5px;border-radius:999px;background:rgba(255,255,255,.12)}.step.on{background:var(--gold)}
          .zone{border-radius:25px;overflow:hidden;border:1px solid var(--line);background:rgba(255,255,255,.055);margin-bottom:12px}.zone img{height:158px;width:100%;object-fit:cover;display:block}.zone .pad{padding:13px}.zone.selected{border-color:rgba(232,196,122,.75);box-shadow:0 0 0 1px rgba(232,196,122,.30)}
          .pay-methods{display:grid;grid-template-columns:1fr 1fr;gap:10px}.method{min-height:62px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.055);text-align:left;padding:11px}.method.active{border-color:var(--gold);background:rgba(232,196,122,.12)}.method strong{display:block;font-size:13px}.method span{font-size:11px;color:var(--muted)}
          .card-fields{display:grid;gap:10px;margin-top:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
          .sheet{position:absolute;inset:0;background:rgba(0,0,0,.58);z-index:100;display:none;align-items:flex-end;padding:12px}.sheet.open{display:flex}.sheet-card{width:100%;max-height:88dvh;overflow:auto;background:#100d09;border:1px solid var(--line);border-radius:30px;padding:14px;box-shadow:0 -30px 90px rgba(0,0,0,.6);animation:up .22s ease}.sheet-card::-webkit-scrollbar{display:none}@keyframes up{from{transform:translateY(22px);opacity:.7}to{transform:translateY(0);opacity:1}}
          .sheet-hero{height:230px;border-radius:24px;overflow:hidden;position:relative;margin-bottom:13px}.sheet-hero img{width:100%;height:100%;object-fit:cover}.x{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.56);backdrop-filter:blur(10px);font-size:22px}
          .notice{border:1px solid rgba(155,211,176,.35);background:rgba(155,211,176,.08);border-radius:20px;padding:13px}.ok{color:var(--green);font-weight:800}.empty{min-height:180px;display:grid;place-items:center;text-align:center;border:1px dashed var(--line);border-radius:25px;padding:22px;color:var(--muted)}
          .chat{display:grid;gap:10px}.msg{max-width:86%;padding:12px 13px;border-radius:18px;background:rgba(255,255,255,.07);line-height:1.38;font-size:13px}.msg.ai{border-top-left-radius:6px}.msg.me{margin-left:auto;background:rgba(232,196,122,.16);border-top-right-radius:6px}.chatbox{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#070604 18%);padding-top:12px}
          
          .sticky-actions{position:sticky;bottom:0;z-index:20;margin:14px -14px -14px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(7,6,4,0),rgba(7,6,4,.92) 24%,rgba(7,6,4,.98));border-radius:0 0 var(--r) var(--r)}
          .profile-card{display:grid;gap:10px}.avatar{width:54px;height:54px;border-radius:18px;background:linear-gradient(135deg,var(--gold),#8e602f);color:#120d08;display:grid;place-items:center;font-weight:900;font-size:20px}
          
          @media(max-width:360px){.menu-grid,.exp-grid{grid-template-columns:1fr}.bottom{grid-template-columns:repeat(5,1fr)}h1{font-size:43px}.hero{min-height:445px}.view{padding-left:12px;padding-right:12px}}
          
          /* Flow-only fixes: no visual redesign, only states/feedback */
          .inline-error{color:var(--danger);font-size:12px;margin-top:8px}
          .btn:disabled{opacity:.45;cursor:not-allowed}
          .edit-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0}
          .edit-row:last-child{border-bottom:0}
          .method-note{margin-top:12px}
          .notice .qrbox{width:112px;height:112px;border-radius:18px;border:1px solid var(--line);background:
          linear-gradient(45deg,rgba(255,255,255,.12) 25%,transparent 25% 50%,rgba(255,255,255,.12) 50% 75%,transparent 75%),
          rgba(255,255,255,.08);background-size:18px 18px;margin:10px auto}
          
          
          /* LUME premium brand pass */
          :root{--bg:#080706;--text:#f8f1e6;--muted:rgba(248,241,230,.66);--line:rgba(240,211,161,.16);--panel:rgba(14,12,10,.78);--panel2:rgba(255,255,255,.055);--gold:#d9b56d;--gold2:#8a6534;--green:#a7d6b6;--danger:#ff9a86;--r:26px;--shadow:0 30px 90px rgba(0,0,0,.52);--hero:url("https://images2.thanhnien.vn/528068263637045248/2026/5/15/lume-gardentwilight1-17788331464582114233393.jpg")}
          html,body{background:#050403}.app{max-width:460px;background:radial-gradient(circle at 50% -16%,rgba(218,181,109,.18),transparent 32%),linear-gradient(180deg,#0b0907 0%,#070605 42%,#050403 100%)}
          .top{height:68px;padding:10px 15px;background:linear-gradient(180deg,rgba(0,0,0,.38),transparent)}.logo{display:flex;align-items:center;gap:8px;letter-spacing:.22em;font-family:Georgia,ui-serif,serif;font-size:13px;font-weight:600}.logo::before{content:"✦";width:29px;height:29px;border:1px solid rgba(217,181,109,.42);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:15px;box-shadow:0 0 26px rgba(217,181,109,.18)}
          .langs{background:rgba(8,6,4,.42);border-color:rgba(240,211,161,.18)}.langs button.active{background:rgba(217,181,109,.20);color:#fff9ef}.view{padding-top:72px}
          .hero{min-height:540px;margin-top:-72px;border-radius:0 0 38px 38px;background-image:linear-gradient(180deg,rgba(0,0,0,.16) 0%,rgba(0,0,0,.02) 26%,rgba(6,5,4,.36) 58%,#080706 100%),var(--hero);background-position:center 48%;box-shadow:0 26px 70px rgba(0,0,0,.44)}
          .hero::after{background:radial-gradient(circle at 68% 18%,transparent 0 20%,rgba(0,0,0,.22) 62%,rgba(0,0,0,.58) 100%),linear-gradient(90deg,rgba(5,4,3,.48),transparent 64%)}.hero-copy{bottom:30px}.hero-copy::before{content:"LUME · NHA TRANG";display:block;color:rgba(248,241,230,.82);font-size:10px;letter-spacing:.26em;margin-bottom:12px;font-weight:700}
          h1,h2{font-family:Georgia,"Times New Roman",ui-serif,serif;font-weight:400}h1{font-size:51px;line-height:.92;max-width:340px}.hero .lead{font-size:16px;max-width:350px;color:rgba(248,241,230,.86)}.eyebrow{color:#e8c983}
          .btn{background:linear-gradient(135deg,#eccb87,#b78443);box-shadow:0 14px 34px rgba(204,160,86,.20);font-weight:750}.btn.secondary{background:rgba(9,8,7,.46);border-color:rgba(240,211,161,.26);backdrop-filter:blur(18px)}.btn.ghost{color:#e8c983;border-color:rgba(232,201,131,.30)}
          .section{margin:24px 0}.head h2{font-size:34px}.exp-grid{gap:12px}.exp-card{min-height:205px;border-radius:26px;border-color:rgba(240,211,161,.16);box-shadow:0 24px 60px rgba(0,0,0,.42)}.exp-card .shade{background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.18) 38%,rgba(4,3,2,.92) 100%)}.exp-card h3{font-family:Georgia,ui-serif,serif;font-size:22px;font-weight:400}.exp-card p{font-size:11.5px;line-height:1.38;color:rgba(248,241,230,.74)}
          .panel,.zone,.item{border-color:rgba(240,211,161,.14);background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.028)),rgba(10,8,6,.72)}.item{border-radius:22px}.item img{height:138px}.item h3{font-family:Georgia,ui-serif,serif;font-size:18px;font-weight:400}.chip{border-color:rgba(240,211,161,.15);background:rgba(255,255,255,.035)}.chip.active{background:linear-gradient(135deg,#e6c37d,#ab7a3f);color:#140f09}
          .bottom{background:rgba(7,6,5,.86);border-color:rgba(240,211,161,.14);box-shadow:0 -18px 60px rgba(0,0,0,.34)}.nav{font-size:9.5px}.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}.nav.active{background:rgba(217,181,109,.12);color:#f6e5bd}
          .sheet-card{background:linear-gradient(180deg,#15110c,#0c0a08);border-color:rgba(240,211,161,.18)}.zone.selected{border-color:rgba(232,201,131,.72);box-shadow:0 0 0 1px rgba(232,201,131,.22),0 20px 55px rgba(0,0,0,.34)}
          .brand-statement{padding:16px 4px 2px}.brand-statement p:last-child{font-family:Georgia,ui-serif,serif;font-size:20px;line-height:1.35;color:rgba(248,241,230,.88)}.private-card{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px;border:1px solid rgba(232,201,131,.18);border-radius:24px;background:linear-gradient(120deg,rgba(217,181,109,.10),rgba(255,255,255,.025))}.private-card h3{font-family:Georgia,ui-serif,serif;font-size:18px;line-height:1.25;font-weight:400}
          .concierge-hero{position:relative;overflow:hidden;border-radius:30px;padding:22px 18px 20px;margin:0 0 18px;min-height:184px;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(7,6,5,.84)),url("https://images2.thanhnien.vn/528068263637045248/2026/5/15/lume-gardengolden-hour2-1778833146454533308569.jpg") center/cover}.concierge-hero::before{content:"✦";display:grid;place-items:center;width:38px;height:38px;border:1px solid rgba(232,201,131,.42);border-radius:50%;color:#edcf8c;margin-bottom:30px;background:rgba(7,6,5,.34);backdrop-filter:blur(12px)}.concierge-hero h2{font-size:39px;margin-bottom:7px}.concierge-hero .muted{font-size:13px;color:rgba(248,241,230,.80);max-width:300px}
          .chat{gap:12px}.msg{max-width:91%;padding:13px 14px;border:1px solid rgba(240,211,161,.11);background:rgba(255,255,255,.045);font-size:13.5px;line-height:1.48}.msg.ai{border-top-left-radius:7px;background:linear-gradient(180deg,rgba(217,181,109,.08),rgba(255,255,255,.035))}.msg.me{background:rgba(217,181,109,.13);border-color:rgba(217,181,109,.17)}
          .ai-thinking{display:flex;gap:6px;align-items:center;color:var(--muted)}.ai-thinking i{width:5px;height:5px;border-radius:50%;background:#e4c37d;animation:pulse 1s infinite alternate}.ai-thinking i:nth-child(2){animation-delay:.18s}.ai-thinking i:nth-child(3){animation-delay:.36s}@keyframes pulse{to{opacity:.25;transform:translateY(-2px)}}.ai-plan{margin-top:11px;border:1px solid rgba(232,201,131,.22);border-radius:21px;overflow:hidden;background:rgba(7,6,5,.64)}.ai-plan-top{padding:14px;background:linear-gradient(135deg,rgba(217,181,109,.15),rgba(255,255,255,.03))}.ai-plan-top .eyebrow{margin-bottom:7px}.ai-plan-top h3{font-family:Georgia,ui-serif,serif;font-size:23px;font-weight:400}.ai-plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(232,201,131,.10)}.ai-plan-cell{padding:11px;background:#0c0a08}.ai-plan-cell b{display:block;color:#e4c37d;font-size:10px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}.ai-plan-cell span{font-size:12px;line-height:1.35}.ai-plan-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:11px;background:#0c0a08}.chatbox{bottom:-1px;background:linear-gradient(180deg,transparent,#080706 24%)}#chatInput{border-color:rgba(240,211,161,.17)!important;background:rgba(255,255,255,.045)!important}
          @media(max-width:360px){.hero{min-height:515px}.exp-grid{grid-template-columns:1fr}.hero-copy h1{font-size:46px}}
          
          </style>
          </head>
          <body>
          <div class="app">
            <div class="top"><div class="logo">LUME</div><div class="langs" id="langs"></div></div>
            <main id="home" class="view active">
              <section class="hero">
                <div class="hero-copy">
                  <p class="eyebrow" data-k="common.open"></p>
                  <h1 data-k="home.heroTitle"></h1>
                  <p class="lead" data-k="home.heroText"></p>
                  <div class="quick">
                    <button class="btn" data-act="tab" data-tab="reserve" data-k="home.reserveTable"></button>
                    <button class="btn secondary" data-act="tab" data-tab="menu" data-k="home.exploreMenu"></button>
                  </div>
                </div>
              </section>
              <section class="brand-statement">
                <p class="eyebrow" data-k="home.brandKicker"></p>
                <p data-k="home.brandStatement"></p>
              </section>
              <section class="section">
                <div class="head"><div><p class="eyebrow" data-k="common.start"></p><h2 data-k="home.chooseExperience"></h2></div></div>
                <p class="muted" data-k="home.experienceHint"></p>
                <div class="exp-grid" id="experiences"></div>
