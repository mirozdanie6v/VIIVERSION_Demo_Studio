name: LUME Signature Browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lume-signature-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null

      - name: Run exact mobile UX scenarios
        shell: bash
        run: |
          cat > qa.mjs <<'NODE'
          import { chromium } from "playwright";
          import fs from "node:fs";

          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({
            viewport:{width:430,height:932},
            deviceScaleFactor:1,
            isMobile:true,
            hasTouch:true
          });

          const errors=[];
          const failed=[];
          page.on("console",m=>{if(m.type()==="error") errors.push("console: "+m.text())});
          page.on("pageerror",e=>errors.push("pageerror: "+e.message));
          page.on("requestfailed",r=>{if(!r.url().includes("/cdn-cgi/")) failed.push(r.url()+" :: "+(r.failure()?.errorText||""));});

          const url="https://lume-v2.viiversion.com/";
          await page.goto(url,{waitUntil:"networkidle",timeout:60000});
          await page.waitForSelector(".hero-signature");

          const logo=await page.locator(".brand-logo").evaluate(img=>({src:img.currentSrc||img.src,w:img.naturalWidth,h:img.naturalHeight}));
          if(!logo.src.includes("/assets/lume/logo/lume-logo.webp")||logo.w<100) throw new Error("Official local LUME logo did not render");

          const hero=await page.locator(".hero-media").evaluate(img=>({src:img.currentSrc||img.src,w:img.naturalWidth,h:img.naturalHeight}));
          if(!hero.src.includes("/assets/lume/hero/lume-hero.webp")||hero.w<500) throw new Error("Local LUME hero did not render");

          const spaceImages=await page.locator(".space-card img").evaluateAll(imgs=>imgs.map(img=>({src:img.currentSrc||img.src,w:img.naturalWidth,h:img.naturalHeight})));
          if(spaceImages.length!==4||spaceImages.some(x=>x.w===0||!x.src.includes("/assets/lume/spaces/"))) throw new Error("Home LUME spaces are not fully local/loaded");

          await page.screenshot({path:"01-home.png",fullPage:true});

          // Reproduce user's menu bug: scroll deep on Home, then use nav.
          await page.locator("#screen").evaluate(el=>el.scrollTop=el.scrollHeight);
          const before=await page.locator("#screen").evaluate(el=>el.scrollTop);
          if(before<300) throw new Error("Could not create deep Home scroll state");
          await page.locator('#bottom-nav [data-tab="menu"]').click();
          await page.waitForSelector(".menu-grid");
          const after=await page.locator("#screen").evaluate(el=>el.scrollTop);
          if(after>20) throw new Error("Menu retained previous screen scroll position: "+after);
          const menuCount=await page.locator(".menu-card").count();
          if(menuCount<4) throw new Error("Menu did not render");
          await page.screenshot({path:"02-menu.png",fullPage:true});

          // Space detail must have 3+ real LUME photos.
          await page.locator('#bottom-nav [data-tab="home"]').click();
          await page.locator(".space-card").first().click();
          await page.waitForSelector(".space-detail");
          const galleryCount=await page.locator(".gallery-frame img").count();
          if(galleryCount<3) throw new Error("Space gallery has fewer than 3 photos");
          const galleryImages=await page.locator(".gallery-frame img").evaluateAll(imgs=>imgs.map(img=>({src:img.currentSrc||img.src,w:img.naturalWidth})));
          if(galleryImages.some(x=>x.w===0||!x.src.includes("/assets/lume/spaces/"))) throw new Error("Space gallery contains unloaded/nonlocal media");
          await page.screenshot({path:"03-space.png",fullPage:true});

          // Exact AI complaint scenario.
          await page.locator('#bottom-nav [data-tab="concierge"]').click();
          await page.waitForSelector("#concierge-input");
          await page.fill("#concierge-input","Покажи фотографии всех зон LUME и коротко расскажи о каждой");
          await page.locator('[data-action="concierge-send"]').click();
          await page.waitForSelector(".ai-space-card",{timeout:30000});
          const cards=await page.locator(".ai-space-card").count();
          if(cards!==4) throw new Error("AI did not render all four zone cards: "+cards);
          const aiText=(await page.locator(".chat").innerText()).trim();
          if(/text.?based|cannot.*photo|не могу.*фото|не могу.*изображ/i.test(aiText)) throw new Error("AI still refuses to show photos: "+aiText);
          if(!/[А-Яа-яЁё]/.test(aiText)) throw new Error("AI did not answer Russian message in Russian");
          const aiImages=await page.locator(".ai-space-card img").evaluateAll(imgs=>imgs.map(img=>({src:img.currentSrc||img.src,w:img.naturalWidth})));
          if(aiImages.some(x=>x.w===0||!x.src.includes("/assets/lume/spaces/"))) throw new Error("AI cards do not show local LUME photos");
          await page.screenshot({path:"04-ai.png",fullPage:true});

          // AI card must open the rich gallery.
          await page.locator(".ai-space-card").first().locator('[data-action="view-space"]').first().click();
          await page.waitForSelector(".space-detail");
          if(await page.locator(".gallery-frame").count()<3) throw new Error("AI space card does not lead to gallery");
          await page.screenshot({path:"05-ai-space.png",fullPage:true});

          // Premium nav icon contract: SVG only, five icons.
          const navSvg=await page.locator("#bottom-nav .nav-icon svg").count();
          if(navSvg!==5) throw new Error("Premium nav SVG icon set incomplete: "+navSvg);

          fs.writeFileSync("qa.json",JSON.stringify({logo,hero,spaceImages,menuCount,before,after,galleryCount,cards,aiText,navSvg,errors,failed},null,2));
          if(errors.length) throw new Error("Browser errors: "+errors.join(" | "));
          if(failed.length) throw new Error("Failed requests: "+failed.join(" | "));

          await browser.close();
          NODE
          node qa.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lume-signature-browser-qa
          path: |
            01-home.png
            02-menu.png
            03-space.png
            04-ai.png
            05-ai-space.png
            qa.json
          if-no-files-found: error
          retention-days: 5
