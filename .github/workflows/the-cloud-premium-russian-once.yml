name: The Cloud Premium Russian Demo Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/the-cloud-premium-russian-once.yml'

concurrency:
  group: the-cloud-russian-demo
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --quiet numpy

      - name: Capture The Cloud guest journey
        env:
          DEMO_STUDIO_ALLOWED_HOSTS: thecloud.viiversion.com
          ALLOW_PRIVATE_TARGETS: "false"
        run: npm run capture -- --scenario examples/the-cloud-russian-demo.json

      - name: Resolve run directory
        id: run
        shell: bash
        run: echo "dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Download premium Russian presenter voice
        shell: bash
        run: |
          set -euo pipefail
          run_dir="${{ steps.run.outputs.dir }}"
          mkdir -p "${run_dir}/voices"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/4474b4ce-3ab4-41d5-ab0e-8e33cabd7419/The_Cloud_RU_premium_voice_1.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZTQ3YTI1MTFiYmRmM2U4MCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMxODkyOX0.m6VXJhVfd-BGLJrZuAUvajHXHmHUBhBuMUHp1yiJMSs' -o "${run_dir}/voices/step-2.mp3"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/b8522752-2598-46af-9e3f-58cf9edaa5a9/The_Cloud_RU_premium_voice_2.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYWI4Y2RiNDcyYTRhNTMyYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMwOTUxMX0.sMC9YAg2SdZQYx7v2xZdsEGFZ0r49DRNBP5b3m0ek40' -o "${run_dir}/voices/step-5.mp3"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/7d2bfdf2-a8f4-4d22-b76e-a6bcb58cd80b/The_Cloud_RU_premium_voice_3.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMWY5MzlkYjZmOTg1NjllMCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM4MDY2Mn0.2hraWd_ZeNRvkPjHw5Vk5tqjJ-ls6jJgY46HWxcQO9M' -o "${run_dir}/voices/step-8.mp3"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/a33182dd-a435-43be-b08e-6568e9f1c228/The_Cloud_RU_premium_voice_4.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMTJhOWE4ZTI4NzQ5ZjY3ZCIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMyNjMwNn0.QRie2S5OP6DGVwLiUBC5HyK2DwR1F7Vbk769YYzV0z0' -o "${run_dir}/voices/step-11.mp3"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/b53fefed-4eb1-4b3e-bf4d-c71137eaa416/The_Cloud_RU_premium_voice_5.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTY4MjhkY2M3Zjg3NWZlZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTMzMzgzNn0.fIQu6IDc6pxxKe023bf9qBrKnPuqt-lg9PzcCOV_QTI' -o "${run_dir}/voices/step-14.mp3"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/e8a18edc-e388-4f2a-a8de-606d3d3fb216/The_Cloud_RU_premium_voice_6.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiOGQzNzVhMzI2ZmFjNWUzYSIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM3MTgyNn0.VhWlXDFf83PljYafO4py_lxkrKEvDuB92HwLrObqoqc' -o "${run_dir}/voices/step-17.mp3"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/2577504f-8ff3-469c-a0a8-7502fba34fc1/The_Cloud_RU_premium_voice_7.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMjNiZTFjYWVhNmRmZTAyMyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM3Njk0Mn0.cjU5LwA5ntSwI6PlOzC-w4n5qQGbw85k5M5d_JwriKQ' -o "${run_dir}/voices/step-19.mp3"
          curl -L --fail --retry 3 --silent --show-error 'https://dnznrvs05pmza.cloudfront.net/text_to_speech/866f6863-2b8b-46b4-8374-27e7135cbb33/The_Cloud_RU_premium_voice_8.mp3?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiYTdkZWNiNjFmMjRmOWUzZiIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MTM0NjUyOX0.JnSNQlz-M75snBu2RjaUkU1SSyEHCyAzAUT8Jp-v2dA' -o "${run_dir}/voices/step-22.mp3"
          for clip in "${run_dir}"/voices/step-*.mp3; do
            test -s "$clip"
          done

      - name: Synchronize narration and captions
        run: |
          npx tsx src/narration-sync-cli.ts --run "${{ steps.run.outputs.dir }}" --bpm 98
          sed -i 's/Style: Default,DejaVu Sans,28,/Style: Default,DejaVu Sans,56,/' "${{ steps.run.outputs.dir }}/synced-captions.ass"

      - name: Generate subtle background music
        shell: bash
        env:
          RUN_DIR: ${{ steps.run.outputs.dir }}
        run: |
          python3 - <<'PY'
          import os, wave
          import numpy as np
          sr=44100
          duration=120.0
          n=int(duration*sr)
          t=np.arange(n,dtype=np.float64)/sr
          left=np.zeros(n,dtype=np.float64)
          right=np.zeros(n,dtype=np.float64)
          chords=[(196.0,246.94,293.66),(174.61,220.0,261.63),(220.0,261.63,329.63),(164.81,196.0,246.94)]
          chord_len=15.0
          for ci in range(int(duration/chord_len)):
              chord=chords[ci%len(chords)]
              start=int(ci*chord_len*sr); end=min(n,int((ci+1)*chord_len*sr))
              tt=np.arange(end-start,dtype=np.float64)/sr
              fade=np.minimum(1,tt/2.0)*np.minimum(1,(chord_len-tt)/2.0)
              for j,f in enumerate(chord):
                  amp=0.025/(j+1)
                  left[start:end]+=amp*np.sin(2*np.pi*f*tt+0.13*j)*fade
                  right[start:end]+=amp*np.sin(2*np.pi*f*tt+0.21*j)*fade
          pulse=0.0022*np.sin(2*np.pi*49*t)*(0.55+0.45*np.sin(2*np.pi*(98/60/2)*t)**2)
          left+=pulse; right+=pulse
          peak=max(np.max(np.abs(left)),np.max(np.abs(right)),1e-9)
          stereo=np.stack([left/peak*0.5,right/peak*0.5],axis=1)
          pcm=(np.clip(stereo,-1,1)*32767).astype(np.int16)
          out=os.path.join(os.environ['RUN_DIR'],'background.wav')
          with wave.open(out,'wb') as w:
              w.setnchannels(2); w.setsampwidth(2); w.setframerate(sr); w.writeframes(pcm.tobytes())
          PY
          run_dir="${{ steps.run.outputs.dir }}"
          ffmpeg -y -i "${run_dir}/background.wav" -af "highpass=f=70,lowpass=f=8500,loudnorm=I=-28:TP=-7:LRA=6" -c:a aac -b:a 160k "${run_dir}/background.m4a"

      - name: Render final premium Russian presentation
        run: |
          npm run render -- \
            --run "${{ steps.run.outputs.dir }}" \
            --preset 9:16 \
            --voiceover "${{ steps.run.outputs.dir }}/voiceover.mp3" \
            --captions-file "${{ steps.run.outputs.dir }}/synced-captions.ass" \
            --music "${{ steps.run.outputs.dir }}/background.m4a" \
            --music-volume 0.08 \
            --music-bpm 98 \
            --brand "THE CLOUD" \
            --title "Мини-приложение гостя" \
            --intro-seconds 2.0 \
            --outro-seconds 4.6 \
            --cta "Выбор атмосферы, бронирование и AI — в одном приложении" \
            --cta-secondary "The Cloud · Nha Trang"

      - name: Verify final video
        shell: bash
        run: |
          run_dir="${{ steps.run.outputs.dir }}"
          test -s "${run_dir}/final-9x16.mp4"
          ffprobe -v error -show_entries format=duration -of csv=p=0 "${run_dir}/final-9x16.mp4"

      - name: Upload The Cloud premium presentation
        uses: actions/upload-artifact@v4
        with:
          name: the-cloud-russian-premium-demo
          path: artifacts/
          if-no-files-found: error
