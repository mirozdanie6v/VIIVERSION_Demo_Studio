name: Deploy LUME v2 Production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-lume-production-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lume-v2-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare token
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            exit 0
          fi
          curl -fsS "https://api.cloudflare.com/client/v4/zones?name=viiversion.com&per_page=5"             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/zones.json
          id=$(jq -r '[.result[]? | select(.name=="viiversion.com")][0].account.id // empty' /tmp/zones.json)
          test -n "${id}"
          echo "CLOUDFLARE_ACCOUNT_ID=${id}" >> "${GITHUB_ENV}"

      - name: Materialize production source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p lume-prod
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          for(const file of ['.deploy/lume-prod-bundle-a.json','.deploy/lume-prod-bundle-b.json']){
            const bundle=JSON.parse(fs.readFileSync(file,'utf8'));
            for(const [name,content] of Object.entries(bundle)){
              const target=path.join('lume-prod',name);
              fs.mkdirSync(path.dirname(target),{recursive:true});
              fs.writeFileSync(target,content,'utf8');
            }
          }
          NODE

      - name: Validate and build
        shell: bash
        run: |
          set -euo pipefail
          cd lume-prod
          npm run check:syntax
          npm run build
          test -f dist/index.html
          test -f dist/src/app.js
          test -f dist/styles/app.css
          grep -Fq 'lume.viiversion.com' wrangler.jsonc

      - name: Deploy production Worker
        shell: bash
        run: |
          set -euo pipefail
          cd lume-prod
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify production and AI
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 36); do
            code=$(curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/lume.html -w '%{http_code}' "https://lume.viiversion.com/" || true)
            if [ "${code}" = "200" ] && grep -Fq '<title>LUME</title>' /tmp/lume.html && grep -Fq '/src/app.js' /tmp/lume.html; then
              ready=1
              break
            fi
            echo "Waiting for production (attempt ${attempt}, HTTP ${code})"
            sleep 5
          done
          test "${ready}" -eq 1

          curl -fsS "https://lume.viiversion.com/api/health" > /tmp/health.json
          jq -e '.ok == true and .aiBinding == true' /tmp/health.json >/dev/null

          curl -fsS -X POST "https://lume.viiversion.com/api/concierge"             -H 'content-type: application/json'             --data '{"message":"Romantic dinner for two with seafood around sunset","lang":"en","history":[],"context":{"selectedMenuItemIds":["lobster"]}}'             > /tmp/concierge.json
          jq -e '.reply | type == "string" and length > 0' /tmp/concierge.json >/dev/null
          jq -e '.plan.areaId | IN("dining","garden","bar","rooftop")' /tmp/concierge.json >/dev/null

          echo "LUME v2 production verified: https://lume.viiversion.com"
