name: Diagnose LUME Signature Frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-lume-signature-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install playwright@1.55.0 --no-audit --no-fund >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Diagnose preview
        shell: bash
        run: |
          cat > debug.mjs <<'NODE'
          import { chromium } from "playwright";
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:430,height:932},isMobile:true,hasTouch:true});
          const messages=[];
          page.on("console",m=>messages.push({type:m.type(),text:m.text()}));
          page.on("pageerror",e=>messages.push({type:"pageerror",text:e.message,stack:e.stack}));
          page.on("requestfailed",r=>messages.push({type:"requestfailed",text:r.url()+" :: "+(r.failure()?.errorText||"")}));
          await page.goto("https://lume-v2.viiversion.com/",{waitUntil:"networkidle"});
          await page.waitForTimeout(2500);
          const state=await page.evaluate(()=>({
            url:location.href,
            body:document.body.innerHTML.slice(0,8000),
            topbar:document.querySelector("#topbar")?.innerHTML||"",
            screen:document.querySelector("#screen")?.innerHTML||"",
            nav:document.querySelector("#bottom-nav")?.innerHTML||"",
            scripts:[...document.scripts].map(s=>s.src),
            ready:document.readyState
          }));
          console.log("MESSAGES="+JSON.stringify(messages,null,2));
          console.log("STATE="+JSON.stringify(state,null,2));
          await page.screenshot({path:"debug.png",fullPage:true});
          await browser.close();
          NODE
          node debug.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lume-signature-frontend-debug
          path: debug.png
          if-no-files-found: warn
          retention-days: 2
