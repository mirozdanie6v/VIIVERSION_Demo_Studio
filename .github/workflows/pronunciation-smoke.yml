name: Pronunciation Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'config/pronunciation-registry.json'
      - 'scripts/hf_tts.py'
      - 'scripts/hf_tts_batch.py'
      - 'scripts/pronunciation_preflight.py'
      - '.github/workflows/pronunciation-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'config/pronunciation-registry.json'
      - 'scripts/hf_tts.py'
      - 'scripts/hf_tts_batch.py'
      - 'scripts/pronunciation_preflight.py'
      - '.github/workflows/pronunciation-smoke.yml'

jobs:
  pronunciation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRESSONNX_MODEL: ruaccent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache StressONNX assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
          key: pronunciation-stressonnx-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install StressONNX
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet stressonnx==0.0.2

      - name: Run full pronunciation preflight
        run: python scripts/pronunciation_preflight.py --full
