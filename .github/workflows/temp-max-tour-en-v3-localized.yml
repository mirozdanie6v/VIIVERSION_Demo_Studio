name: MAX TOUR English Localized Fullscreen Final

on:
  push:
    branches:
      - 'render/max-tour-en-v3-fullscreen-20261004'
    paths:
      - '.github/workflows/temp-max-tour-en-v3-localized.yml'

concurrency:
  group: max-tour-en-v3-localized
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load temporary media URLs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          text=Path('.github/workflows/temp-max-tour-en-v3-fullscreen.yml').read_text()
          names=['V_HOOK','V_CATALOG','V_TOUR','V_CHOICE','V_BOOKING','V_AI','V_VALUE','V_CTA','MUSIC']
          rows=[]
          for name in names:
              m=re.search(r'^\s*'+name+r':\s*"([^"]+)"',text,re.M)
              if not m:
                  raise SystemExit(f'missing {name}')
              rows.append(f'{name}={m.group(1)}')
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('\n'.join(rows)+'\n')
          PY

      - name: Install dependencies
        run: npm install

      - name: Install browser and media tools
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python3 -m pip install --quiet pillow

      - name: Capture English-localized MAX TOUR journey
        env:
          DEMO_STUDIO_ALLOWED_HOSTS: max-tour.viiversion.com
          ALLOW_PRIVATE_TARGETS: "false"
        run: npm run capture -- --scenario examples/max-tour-english-dynamic-v2.json

      - name: Resolve run directory
        id: run
        shell: bash
        run: echo "dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Download Niki narration and music
        shell: bash
        run: |
          set -euo pipefail
          d="artifacts/english-voices-v3"
          mkdir -p "$d"
          curl -L --fail --retry 3 "$V_HOOK" -o "$d/hook.mp3"
          curl -L --fail --retry 3 "$V_CATALOG" -o "$d/catalog.mp3"
          curl -L --fail --retry 3 "$V_TOUR" -o "$d/tour.mp3"
          curl -L --fail --retry 3 "$V_CHOICE" -o "$d/choice.mp3"
          curl -L --fail --retry 3 "$V_BOOKING" -o "$d/booking.mp3"
          curl -L --fail --retry 3 "$V_AI" -o "$d/ai.mp3"
          curl -L --fail --retry 3 "$V_VALUE" -o "$d/value.mp3"
          curl -L --fail --retry 3 "$V_CTA" -o "$d/cta.mp3"
          curl -L --fail --retry 3 "$MUSIC" -o "artifacts/english-music-v3.mp3"

      - name: Render fullscreen dynamic English sales demo
        run: |
          python3 scripts/render_max_tour_en_dynamic_v2.py             --run "${{ steps.run.outputs.dir }}"             --voices artifacts/english-voices-v3             --music artifacts/english-music-v3.mp3             --out artifacts/max-tour-english-v3-localized

      - name: Verify final output
        shell: bash
        run: |
          set -euo pipefail
          f="artifacts/max-tour-english-v3-localized/MAX_TOUR_English_Dynamic_FINAL.mp4"
          test -s "$f"
          duration=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
          echo "FINAL_DURATION=$duration"
          awk -v d="$duration" 'BEGIN { exit !(d >= 82 && d <= 110) }'
          ffprobe -v error -show_entries stream=codec_type,width,height -of json "$f"

      - uses: actions/upload-artifact@v4
        with:
          name: max-tour-english-v3-localized-final
          path: artifacts/max-tour-english-v3-localized/
          if-no-files-found: error
