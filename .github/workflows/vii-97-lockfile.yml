name: VII-97 Generate Lockfile

on:
  push:
    branches:
      - mirozdanie6v/vii-97-v014-production-readiness
    paths:
      - package.json
      - .github/workflows/vii-97-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirozdanie6v/vii-97-v014-production-readiness

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-fund --no-audit

      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "v0.14: add deterministic npm lockfile"
          git push origin HEAD:mirozdanie6v/vii-97-v014-production-readiness
