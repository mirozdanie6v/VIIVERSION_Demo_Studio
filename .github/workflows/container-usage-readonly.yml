name: Cloudflare container usage metrics (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/container-usage-readonly.yml"]
permissions:
  contents: read
  statuses: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect daily container resource use
        id: probe
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          account="${CLOUDFLARE_ACCOUNT_ID:-}"
          api=https://api.cloudflare.com/client/v4
          if [ -z "${account}" ]; then
            if curl -fsS --max-time 30 "${api}/memberships?status=accepted&per_page=50" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/memberships.json; then
              account=$(jq -r '[.result[]?.account.id] | unique | if length == 1 then .[0] else empty end' /tmp/memberships.json)
            fi
          fi
          if [ -z "${account}" ]; then
            if curl -fsS --max-time 30 "${api}/zones?name=viiversion.com&per_page=5" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/zones.json; then
              account=$(jq -r '[.result[]?.account.id] | unique | if length == 1 then .[0] else empty end' /tmp/zones.json)
            fi
          fi
          test -n "${account}"
          curl -fsS --max-time 30 "${api}/accounts/${account}/containers/applications?per_page=500" \
             -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -o /tmp/apps.json
          app_id=$(jq -r '[.result[] | select(.name == "viiversion-demo-studio" or (.name | ascii_downcase | contains("viiversion-demo-studio") and contains("demostudiocontainer"))) | .id] | if length == 1 then .[0] else empty end' /tmp/apps.json)
          test -n "${app_id}" || exit 3
          jq -n --arg account "${account}" '{
            query:"query ContainerUsage($tag: String) { viewer { accounts(filter:{accountTag:$tag}) { containersUsageAdaptiveGroups(limit:100,filter:{date_geq:\"2026-10-10\",date_leq:\"2026-10-15\"},orderBy:[date_ASC]) { dimensions { date applicationId } sum { allocatedMemory allocatedDisk cpuTimeSec } } } } }",
            variables:{tag:$account}
          }' > /tmp/usage-query.json
          code=$(curl -sS --max-time 60 -o /tmp/usage.json -w '%{http_code}' -X POST \
            "${api}/graphql" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            --data-binary @/tmp/usage-query.json)
          test "${code}" = 200 || { echo "Analytics API HTTP ${code}"; exit 3; }
          jq -e '(.errors == null or (.errors | length == 0)) and (.data.viewer.accounts | type == "array")' /tmp/usage.json >/dev/null
          APP_ID="${app_id}" python3 - <<'PY'
          import os,json,subprocess
          from decimal import Decimal
          doc=json.load(open('/tmp/usage.json'))
          rows=[x for acc in doc['data']['viewer']['accounts']
                for x in acc.get('containersUsageAdaptiveGroups',[])
                if x.get('dimensions',{}).get('applicationId') == os.environ['APP_ID']]
          print('Cloudflare daily container usage (read-only), Demo Studio rows:',len(rows))
          if not rows: raise RuntimeError('No usage samples returned for Demo Studio; do not assume zero cost')
          for row in rows:
              day=row['dimensions']['date']
              s=row['sum']
              gib_hours=Decimal(str(s['allocatedMemory'])) / (Decimal(2)**30*3600)
              disk_gb_hours=Decimal(str(s['allocatedDisk'])) / (Decimal(10)**9*3600)
              cpu_seconds=Decimal(str(s['cpuTimeSec']))
              print('Date:',day,'Provisioned GiB-hours:',round(gib_hours,3),
                    'Disk GB-hours:',round(disk_gb_hours,3),'CPU-seconds:',round(cpu_seconds,3))
              context='demo-studio/usage-'+day+'-gibh-'+str(round(gib_hours,1)).replace('.','p')
              payload=json.dumps({'state':'success','description':'Cloudflare container usage in GiB-hours; all applications separated','context':context})
              subprocess.run(['curl','-fsS','--max-time','20','-X','POST',
                '-H','Authorization: Bearer '+os.environ['GH_TOKEN'],
                '-H','Content-Type: application/json','--data-binary',payload,
                'https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/statuses/'+os.environ['GITHUB_SHA']],
                check=True,stdout=subprocess.DEVNULL)
          PY
      - name: Record analytics access
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          if [ "${PROBE_OUTCOME}" = success ]; then state=success; else state=failure; fi
          jq -n --arg state "${state}" '{state:$state,description:"Read-only usage metrics (requires Analytics Read)",context:"demo-studio/usage-analytics"}' >/tmp/status.json
          curl -fsS --max-time 20 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Content-Type: application/json" \
            --data-binary @/tmp/status.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" >/dev/null
      - name: Fail unavailable metrics
        if: steps.probe.outcome != 'success'
        run: exit 1
