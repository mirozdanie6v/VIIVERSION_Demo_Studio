name: Recording Smoke Test

on:
  pull_request:
    paths:
      - 'src/**'
      - 'examples/smoke.json'
      - 'fixtures/smoke.html'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/smoke-recording.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/smoke.json'
      - 'fixtures/smoke.html'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/smoke-recording.yml'
  workflow_dispatch:

concurrency:
  group: demo-studio-recording-smoke
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1

      - name: Start local demo app
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/demo-studio-http.log 2>&1 &
          echo $! > /tmp/demo-studio-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/fixtures/smoke.html >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat /tmp/demo-studio-http.log
          exit 1

      - name: Verify integrated Chromium process reuse
        env:
          ALLOW_PRIVATE_TARGETS: "true"
          DEMO_STUDIO_REUSE_BROWSER: "true"
        run: npx tsx scripts/smoke_browser_reuse.ts http://127.0.0.1:4173/fixtures/smoke.html

      - name: Verify UX audit cache re-materialization
        env:
          ALLOW_PRIVATE_TARGETS: "true"
          DEMO_STUDIO_UX_CACHE_TTL_MS: "600000"
        run: npx tsx scripts/smoke_ux_cache.ts http://127.0.0.1:4173/fixtures/smoke.html

      - name: Verify experimental hybrid capture is faster
        env:
          ALLOW_PRIVATE_TARGETS: "true"
        run: npx tsx scripts/smoke_hybrid_capture.ts http://127.0.0.1:4173/fixtures/smoke.html

      - name: Record local walkthrough
        env:
          ALLOW_PRIVATE_TARGETS: "true"
        run: npm run capture -- --scenario examples/smoke.json

      - name: Resolve run directory
        id: run
        shell: bash
        run: echo "dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Run UX Design Brain preflight
        env:
          ALLOW_PRIVATE_TARGETS: "true"
        run: npm run ux-audit -- --url http://127.0.0.1:4173/fixtures/smoke.html --out "${{ steps.run.outputs.dir }}"

      - name: Render final MP4
        run: npm run render -- --run "${{ steps.run.outputs.dir }}" --preset 16:9 --brand VIIVERSION --cta "Built with VIIVERSION Demo Studio" --design-contract "${{ steps.run.outputs.dir }}/design_contract.json" --ux-preflight "${{ steps.run.outputs.dir }}/ux_preflight.json"

      - name: Verify editorial brain artifacts
        shell: bash
        run: |
          set -euo pipefail
          run_dir="${{ steps.run.outputs.dir }}"
          test -s "${run_dir}/editor_brain.json"
          test -s "${run_dir}/editor_critic.json"
          test -s "${run_dir}/music_brain.json"
          test -s "${run_dir}/captions.json"
          test -s "${run_dir}/captions.srt"
          test -s "${run_dir}/scenes.json"
          jq -e '.version == "editor-brain-v1" and .qualityGate.passed == true and .qualityGate.checks.sourceOverlapFree == true and (.scenes | length) >= 2' "${run_dir}/editor_brain.json" >/dev/null
          jq -e '.version == "editor-critic-v1" and .passed == true' "${run_dir}/editor_critic.json" >/dev/null
          jq -e '.version == "music-brain-v1"' "${run_dir}/music_brain.json" >/dev/null
          jq -e '.version == "caption-brain-v1" and (.cues | length) > 0 and .resolvedPlacement == "top" and .resolvedStyle.alignment == 6' "${run_dir}/captions.json" >/dev/null
          jq -e '.editorBrainVersion == "editor-brain-v1" and (.scenes | length) > 0' "${run_dir}/scenes.json" >/dev/null
          test -s "${run_dir}/ux_preflight.json"
          test -s "${run_dir}/design_profile.json"
          test -s "${run_dir}/design_contract.json"
          test -s "${run_dir}/ux_desktop.png"
          test -s "${run_dir}/ux_mobile.png"
          test -s "${run_dir}/overlay_plan.json"
          test -s "${run_dir}/visual_critic.json"
          jq -e '.version == "ux-preflight-v1" and .status == "PASS"' "${run_dir}/ux_preflight.json" >/dev/null
          jq -e '.version == "design-profile-v1"' "${run_dir}/design_profile.json" >/dev/null
          jq -e '.version == "design-contract-v1"' "${run_dir}/design_contract.json" >/dev/null
          jq -e '.version == "overlay-plan-v1"' "${run_dir}/overlay_plan.json" >/dev/null
          jq -e '.version == "visual-critic-v1" and .status == "PASS"' "${run_dir}/visual_critic.json" >/dev/null

      - name: Upload recording artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-studio-smoke-recording
          path: artifacts/
          if-no-files-found: error
