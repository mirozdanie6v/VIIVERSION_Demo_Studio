name: Recording Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: demo-studio-recording-smoke
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Record example walkthrough
        run: npm run capture -- --scenario examples/viiversion-v1.json

      - name: Resolve run directory
        id: run
        shell: bash
        run: echo "dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_OUTPUT"

      - name: Render final MP4
        run: npm run render -- --run "${{ steps.run.outputs.dir }}" --preset 16:9 --brand VIIVERSION --cta "Built with VIIVERSION Demo Studio"

      - name: Upload recording artifacts
        uses: actions/upload-artifact@v4
        with:
          name: demo-studio-smoke-recording
          path: artifacts/
          if-no-files-found: error
