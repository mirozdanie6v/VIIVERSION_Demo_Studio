name: MAX TOUR Native EN Flow Diagnostic

on:
  push:
    branches:
      - 'render/max-tour-en-v5-full-journey-20261004'
    paths:
      - '.github/workflows/temp-max-tour-native-en-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect native English flow
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:430,height:932}});
          await page.goto('https://max-tour.viiversion.com/',{waitUntil:'domcontentloaded',timeout:30000});
          await page.waitForTimeout(3000);
          await page.getByRole('button',{name:'EN',exact:true}).click();
          await page.waitForTimeout(1200);
          console.log('=== HOME EN ===');
          console.log((await page.locator('body').innerText()).slice(0,5000));
          console.log('BUTTONS_HOME=',await page.locator('button').allTextContents());
          await page.screenshot({path:'diag-home-en.png',fullPage:false});

          const choose=page.getByRole('button',{name:/choose|tour/i}).filter({visible:true}).first();
          if(await choose.count()){ await choose.click(); await page.waitForTimeout(1200); }
          console.log('=== CATALOG EN ===');
          console.log((await page.locator('body').innerText()).slice(0,7000));
          console.log('BUTTONS_CATALOG=',await page.locator('button').allTextContents());
          console.log('CLASSES_CATALOG=',await page.locator('[class]').evaluateAll(els=>[...new Set(els.flatMap(e=>String(e.className||'').split(/\s+/)).filter(Boolean))].filter(x=>/catalog|tour|card|assistant|booking|ai|cta/i.test(x)).slice(0,180)));
          await page.screenshot({path:'diag-catalog-en.png',fullPage:false});

          const dalat=page.getByText(/Dalat.*Premium/i).first();
          if(await dalat.count()){ await dalat.click(); await page.waitForTimeout(1200); }
          console.log('=== TOUR EN ===');
          console.log((await page.locator('body').innerText()).slice(0,8000));
          console.log('BUTTONS_TOUR=',await page.locator('button').allTextContents());
          console.log('CLASSES_TOUR=',await page.locator('[class]').evaluateAll(els=>[...new Set(els.flatMap(e=>String(e.className||'').split(/\s+/)).filter(Boolean))].filter(x=>/tour|detail|assistant|booking|ai|cta|sticky/i.test(x)).slice(0,180)));
          await page.screenshot({path:'diag-tour-en.png',fullPage:false});

          const ai=page.getByRole('button',{name:/AI|assistant/i}).first();
          if(await ai.count()){ await ai.click(); await page.waitForTimeout(700); }
          console.log('=== AI EN ===');
          console.log((await page.locator('body').innerText()).slice(-5000));
          console.log('INPUTS_AI=',await page.locator('input,textarea,[contenteditable=true]').evaluateAll(els=>els.map(e=>({tag:e.tagName,placeholder:e.getAttribute('placeholder'),aria:e.getAttribute('aria-label'),class:e.className}))));
          console.log('BUTTONS_AI=',await page.locator('button').allTextContents());
          console.log('CLASSES_AI=',await page.locator('[class]').evaluateAll(els=>[...new Set(els.flatMap(e=>String(e.className||'').split(/\s+/)).filter(Boolean))].filter(x=>/assistant|chat|ai|message|booking|tour/i.test(x)).slice(0,180)));
          await page.screenshot({path:'diag-ai-en.png',fullPage:false});
          await browser.close();
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: max-tour-native-en-diagnostic
          path: diag-*.png
