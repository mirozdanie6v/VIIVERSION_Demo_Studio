name: Inspect LUME Cloudflare

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-lume-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: lume-mini-app
      CUSTOM_DOMAIN: lume.viiversion.com
    steps:
      - name: Resolve account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            curl -fsS "https://api.cloudflare.com/client/v4/zones?name=viiversion.com&per_page=5"               -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/zones.json
            id=$(jq -r '[.result[]?.account.id] | unique | if length == 1 then .[0] else empty end' /tmp/zones.json)
            test -n "${id}"
            echo "CLOUDFLARE_ACCOUNT_ID=${id}" >> "${GITHUB_ENV}"
          fi
      - name: Inspect Pages
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT_NAME}"
          curl -fsS "${api}" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/project.json
          curl -fsS "${api}/domains" -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" > /tmp/domains.json
          echo "PROJECT="
          jq '{name:.result.name,subdomain:.result.subdomain,production_branch:.result.production_branch,domains:.result.domains,source:.result.source}' /tmp/project.json
          echo "DOMAIN="
          jq --arg d "${CUSTOM_DOMAIN}" '.result[]? | select(.name == $d)' /tmp/domains.json
