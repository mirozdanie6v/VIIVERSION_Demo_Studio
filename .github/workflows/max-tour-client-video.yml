name: MAX TOUR Client Video

on:
  push:
    branches: [main]
    paths:
      - 'examples/max-tour-client.json'
      - '.github/workflows/max-tour-client-video.yml'
  workflow_dispatch:

concurrency:
  group: max-tour-client-video
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Inspect live MAX TOUR UI
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:430,height:932}});
          page.on('console', msg => console.log('BROWSER', msg.type(), msg.text()));
          page.on('pageerror', err => console.log('PAGEERROR', err.message));
          async function dump(label) {
            console.log('--- LIVE UI ' + label + ' ---');
            console.log('URL', page.url());
            console.log('BUTTONS', JSON.stringify(await page.getByRole('button').allTextContents()));
            console.log('LINKS', JSON.stringify(await page.locator('a').evaluateAll(els => els.map(a => ({text:(a.textContent||'').trim(), href:a.getAttribute('href')})))));
            console.log((await page.locator('body').innerText()).slice(0,10000));
          }
          await page.goto('https://max-tour.viiversion.com/', {waitUntil:'domcontentloaded', timeout:30000});
          await page.waitForTimeout(3500);
          await dump('/');
          const choose = page.getByRole('button', {name:'Выбрать тур'}).first();
          if (await choose.count()) {
            await choose.click();
            await page.waitForTimeout(1800);
            await dump('after Выбрать тур');
          }
          const dalat = page.locator('h3:visible').filter({hasText:'Далат «Премиум»'}).first();
          if (await dalat.count()) {
            console.log('DALAT_ANCESTORS', await dalat.evaluate(el => {
              const out=[]; let n=el;
              for(let i=0;i<5 && n;i++,n=n.parentElement) out.push({tag:n.tagName,cls:n.className,role:n.getAttribute('role'),html:i<2?n.outerHTML.slice(0,2200):undefined});
              return JSON.stringify(out);
            }));
            try {
              await dalat.click();
              await page.waitForTimeout(2200);
              await dump('after Далат Премиум');
            } catch (e) {
              console.log('DALAT_CLICK_ERROR', e.message);
            }
          }
          await browser.close();
          NODE

      - name: Capture MAX TOUR walkthrough
        env:
          DEMO_STUDIO_ALLOWED_HOSTS: max-tour.viiversion.com
          ALLOW_PRIVATE_TARGETS: "false"
        run: npm run capture -- --scenario examples/max-tour-client.json

      - name: Resolve run directory
        id: run
        shell: bash
        run: echo "dir=$(find artifacts -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Render client MP4
        run: |
          npm run render --             --run "${{ steps.run.outputs.dir }}"             --preset 9:16             --brand "VIIVERSION"             --title "MAX TOUR · клиентский путь"             --cta "Так может выглядеть ваше приложение"

      - name: Upload client video
        uses: actions/upload-artifact@v4
        with:
          name: max-tour-client-video
          path: artifacts/
          if-no-files-found: error
