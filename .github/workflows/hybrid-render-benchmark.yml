name: Hybrid Render Benchmark

on:
  pull_request:
    paths:
      - 'src/hybrid-compose.ts'
      - 'src/hybrid-capture.ts'
      - 'src/render.ts'
      - 'src/runner.ts'
      - 'scripts/benchmark_hybrid_render.ts'
      - 'examples/smoke.json'
      - 'fixtures/smoke.html'
      - '.github/workflows/hybrid-render-benchmark.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Start fixture app
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/hybrid-render-fixture.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/fixtures/smoke.html >/dev/null && exit 0
            sleep 0.25
          done
          cat /tmp/hybrid-render-fixture.log
          exit 1

      - name: Benchmark standard vs hybrid capture and render
        env:
          ALLOW_PRIVATE_TARGETS: "true"
        run: npx tsx scripts/benchmark_hybrid_render.ts http://127.0.0.1:4173

      - name: Upload hybrid benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-render-benchmark
          path: /tmp/demo-hybrid-render-benchmark
          retention-days: 3
