<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VIIVERSION Demo Studio Smoke App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background: radial-gradient(circle at 20% 20%, #26314a, #090b10 55%);
      color: white;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }
    main {
      width: min(920px, calc(100vw - 48px));
      padding: 72px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 32px;
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(24px);
      box-shadow: 0 30px 100px rgba(0,0,0,.42);
    }
    .eyebrow { opacity: .62; letter-spacing: .14em; text-transform: uppercase; }
    h1 { font-size: clamp(42px, 6vw, 74px); line-height: .98; margin: 18px 0 28px; }
    p { font-size: 19px; line-height: 1.55; opacity: .8; max-width: 650px; }
    button {
      margin-top: 30px;
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 16px 26px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    #catalog {
      margin-top: 36px;
      padding: 28px;
      border-radius: 22px;
      background: rgba(255,255,255,.1);
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">VIIVERSION</div>
    <h1>Demo Studio</h1>
    <p>Deterministic local application used to verify automated capture, presentation motion and final rendering.</p>
    <button id="open-catalog" type="button">Open catalog</button>
    <section id="catalog" data-testid="catalog" hidden>
      <h2>Premium Demo</h2>
      <p>The capture engine successfully completed the interactive step.</p>
    </section>
  </main>
  <script>
    document.getElementById("open-catalog").addEventListener("click", () => {
      document.getElementById("catalog").hidden = false;
    });
  </script>
</body>
</html>
